<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit — Personal OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23241129'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23e8567f'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5.5' fill='none' stroke='%238b5fbf' stroke-width='2' transform='rotate(-25 16 16)'/%3E%3C/svg%3E">
<meta name="theme-color" content="#150d19" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f1e8da" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Orbit — a personal operating system: calendar, tasks, notes, habits, focus, money and trips in one place.">
<style>
/* ============================================================
   ORBIT — a personal operating system
   Single file. No build step. No network. Your data stays local.
   ============================================================ */

:root{
  color-scheme: dark;
  --bg:#150d19;
  --wall-1:#31183a; --wall-2:#150d19; --wall-3:#25122b;
  --surface:#201628;
  --surface-2:#2a1d33;
  --surface-3:#382541;
  --glass:rgba(40,26,49,.76);
  --glass-strong:rgba(27,17,33,.91);
  --border:rgba(246,236,226,.11);
  --border-strong:rgba(246,236,226,.21);
  --text:#f6ece2;
  --text-2:#d2c0cb;
  --muted:#9e8897;
  --accent:#ee6b93;
  --accent-fill:#c9265a;
  --on-accent:#fffaf2;
  --accent-soft:rgba(238,107,147,.16);
  --plum:#8b5fbf;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --grid:#33223c; --axis:#452e4f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --ord1:#9ec5f4; --ord2:#6da7ec; --ord3:#3987e5; --ord4:#256abf; --ord5:#184f95;
  /* 20 picker colours — for accents, projects and labels */
  --c1:#ff5c8a; --c2:#ff7657; --c3:#ffc857; --c4:#f4e35e;
  --c5:#7ddf7d; --c6:#36d399; --c7:#2dd4bf; --c8:#4cc9f0;
  --c9:#3b82f6; --c10:#6366f1; --c11:#8b5cf6; --c12:#a78bfa;
  --c13:#d946ef; --c14:#f472b6; --c15:#fb7185; --c16:#ff6b9a;
  --c17:#ff8a3d; --c18:#fbbf24; --c19:#22c55e; --c20:#06b6d4;
  --shadow-glass:0 8px 32px rgba(0,0,0,.30);
  --shadow-win:0 1px 2px rgba(0,0,0,.45), 0 18px 50px -12px rgba(10,2,14,.8);
  --shadow-pop:0 12px 40px -8px rgba(10,2,14,.65);
  --r-win:14px; --r-md:10px; --r-sm:7px;
  --menubar-h:32px; --dock-h:74px;
  --font:'Lora',Georgia,'Times New Roman',serif;
}
html[data-theme="light"]{
  color-scheme: light;
  --bg:#f1e8da;
  --wall-1:#ecdfcd; --wall-2:#f5ede1; --wall-3:#ebdfe9;
  --surface:#fffaf2;
  --surface-2:#f8f0e4;
  --surface-3:#ece0d0;
  --glass:rgba(255,250,242,.82);
  --glass-strong:rgba(255,251,245,.94);
  --border:rgba(60,26,52,.13);
  --border-strong:rgba(60,26,52,.23);
  --text:#2c1329;
  --text-2:#5b4055;
  --muted:#8a7183;
  --accent:#b01c53;
  --accent-fill:#b01c53;
  --on-accent:#fffaf2;
  --accent-soft:rgba(176,28,83,.10);
  --plum:#6d3a7e;
  --grid:#e4d6c5; --axis:#ccbaa7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --ord1:#86b6ef; --ord2:#5598e7; --ord3:#2a78d6; --ord4:#1c5cab; --ord5:#104281;
  --shadow-glass:0 8px 32px rgba(60,26,52,.15);
  --shadow-win:0 1px 2px rgba(60,26,52,.10), 0 18px 44px -14px rgba(60,26,52,.28);
  --shadow-pop:0 12px 36px -10px rgba(60,26,52,.24);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); color:var(--text); background:var(--bg);
  overflow:hidden; -webkit-font-smoothing:antialiased;
  font-size:13.5px; line-height:1.5; letter-spacing:.002em;
}
h1,h2,h3,h4{letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ---------- desktop ---------- */
#desktop{
  position:fixed; inset:0; overflow:hidden;
  background:
    radial-gradient(1200px 800px at 12% -10%, var(--wall-1) 0%, transparent 60%),
    radial-gradient(1000px 700px at 88% 108%, var(--wall-3) 0%, transparent 62%),
    linear-gradient(160deg, var(--wall-2), var(--bg));
}
#desktop::after{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:radial-gradient(circle at 1px 1px, rgba(246,236,226,.05) 1px, transparent 0);
  background-size:26px 26px;
}
html[data-theme="light"] #desktop::after{background-image:radial-gradient(circle at 1px 1px, rgba(60,26,52,.055) 1px, transparent 0)}
body[data-wall="plain"] #desktop{background:linear-gradient(170deg,var(--wall-2),var(--bg))}
body[data-wall="plain"] #desktop::after{display:none}

/* ---------- richer desktop atmosphere ---------- */
#desktop::before{
  content:""; position:absolute; inset:-12%;
  pointer-events:none; opacity:.52;
  background:
    radial-gradient(520px 320px at 18% 22%, rgba(238,107,147,.16), transparent 68%),
    radial-gradient(620px 380px at 82% 74%, rgba(139,95,191,.18), transparent 70%),
    radial-gradient(420px 300px at 58% 8%, rgba(57,135,229,.08), transparent 70%);
  filter:blur(12px);
  animation:orbitAtmosphere 18s ease-in-out infinite alternate;
}
@keyframes orbitAtmosphere{from{transform:translate3d(-1.5%,0,0) scale(1)}to{transform:translate3d(1.5%,1%,0) scale(1.035)}}
body[data-wall="mesh"] #desktop{
  background:
    linear-gradient(115deg,rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(35deg,rgba(255,255,255,.02) 1px,transparent 1px),
    radial-gradient(900px 600px at 15% 15%,rgba(139,95,191,.30),transparent 65%),
    radial-gradient(800px 520px at 88% 76%,rgba(238,107,147,.20),transparent 65%),
    linear-gradient(145deg,var(--wall-2),var(--bg));
  background-size:34px 34px,34px 34px,auto,auto,auto;
}
html[data-theme="light"] #desktop::before{opacity:.30}

/* creative dock icons */
.dock-btn{
  position:relative; overflow:visible;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 8px 18px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.18);
}
.dock-btn::before{
  content:""; position:absolute; inset:-5px;
  border:1px solid currentColor; border-radius:30%;
  opacity:0; transform:rotate(-18deg) scale(.82);
  transition:opacity .18s, transform .18s;
}
.dock-btn::after{
  content:""; position:absolute; width:6px;height:6px;border-radius:50%;
  right:-2px;top:-2px;background:currentColor;
  box-shadow:0 0 0 3px rgba(255,255,255,.08);
  opacity:.0; transition:opacity .18s;
}
.dock-item:hover .dock-btn::before{opacity:.28;transform:rotate(-18deg) scale(1)}
.dock-item:hover .dock-btn::after{opacity:.8}
body[data-wall="mesh"] #desktop{
  background:
    radial-gradient(700px 500px at 20% 20%, rgba(139,95,191,.34), transparent 60%),
    radial-gradient(600px 500px at 80% 28%, rgba(201,38,90,.28), transparent 60%),
    radial-gradient(700px 600px at 55% 95%, rgba(246,220,196,.16), transparent 62%),
    linear-gradient(160deg,var(--wall-2),var(--bg));
}

/* ---------- menu bar ---------- */
#menubar{
  position:fixed; top:0; left:0; right:0; height:var(--menubar-h); z-index:9000;
  display:flex; align-items:center; gap:14px; padding:0 12px;
  background:var(--glass); backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border-bottom:1px solid var(--border); font-size:12.5px;
}
#menubar .mb-logo{display:flex;align-items:center;gap:7px;font-weight:700;letter-spacing:.2px}
#menubar .mb-logo svg{display:block}
#menubar .mb-app{color:var(--text-2);font-weight:400}
#menubar .mb-spacer{flex:1}
.mb-btn{
  display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;
  color:var(--text-2); transition:background .15s,color .15s;
}
.mb-btn:hover{background:var(--surface-3);color:var(--text)}
#mb-clock{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
#mb-date{color:var(--text-2)}

/* ---------- desktop icons ---------- */
#dicons{
  position:absolute; top:calc(var(--menubar-h) + 18px); left:18px;
  display:flex; flex-direction:column; flex-wrap:wrap; gap:6px;
  max-height:calc(100vh - var(--menubar-h) - var(--dock-h) - 40px); align-content:flex-start;
}
.dicon{
  width:96px;padding:9px 4px;border-radius:var(--r-md);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--text); transition:background .15s;
}
.dicon:hover{background:rgba(246,236,226,.10)}
html[data-theme="light"] .dicon:hover{background:rgba(60,26,52,.07)}
.dicon .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;box-shadow:0 4px 14px -4px rgba(0,0,0,.5)}
.dicon .lbl{font-size:11.5px;line-height:1.3;text-shadow:0 1px 3px rgba(10,2,14,.6)}
html[data-theme="light"] .dicon .lbl{text-shadow:0 1px 2px rgba(255,250,242,.9)}

/* ---------- windows ---------- */
.win{
  position:absolute; display:flex; flex-direction:column; min-width:320px; min-height:220px;
  background:var(--surface); border:1px solid var(--border-strong);
  border-radius:var(--r-win); box-shadow:var(--shadow-win); overflow:hidden;
  animation:winIn .16s cubic-bezier(.2,.8,.3,1);
}
@keyframes winIn{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.win.minimized{display:none}
.win.maximized{border-radius:0}
.win-bar{
  height:40px; flex:0 0 40px; display:flex; align-items:center; gap:10px; padding:0 12px;
  background:var(--glass-strong); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border); cursor:grab; user-select:none;
}
.win-bar:active{cursor:grabbing}
.lights{display:flex;gap:7px;flex:0 0 auto}
.light{width:12px;height:12px;border-radius:99px;position:relative;transition:filter .15s}
.light:hover{filter:brightness(1.15)}
.light.close{background:#e8556f}.light.min{background:#e8a33a}.light.max{background:#4fae7d}
.light svg{position:absolute;inset:0;margin:auto;opacity:0;transition:opacity .12s}
.lights:hover .light svg{opacity:.65}
.win-title{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2);min-width:0}
.win-title .tdot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.win-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-bar .bar-spacer{flex:1}
.win-body{flex:1;overflow:auto;position:relative;background:var(--surface)}
.win-rz{position:absolute;z-index:5}
.rz-e{top:0;right:-3px;width:8px;height:100%;cursor:ew-resize}
.rz-s{bottom:-3px;left:0;width:100%;height:8px;cursor:ns-resize}
.rz-w{top:0;left:-3px;width:8px;height:100%;cursor:ew-resize}
.rz-n{top:-3px;left:0;width:100%;height:8px;cursor:ns-resize}
.rz-se{bottom:-2px;right:-2px;width:16px;height:16px;cursor:nwse-resize}
.rz-sw{bottom:-2px;left:-2px;width:16px;height:16px;cursor:nesw-resize}
.rz-ne{top:-2px;right:-2px;width:16px;height:16px;cursor:nesw-resize}
.rz-nw{top:-2px;left:-2px;width:16px;height:16px;cursor:nwse-resize}

/* ---------- dock ---------- */
#dock{
  position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:8000;
  display:flex; align-items:flex-end; gap:6px; padding:8px 10px;
  background:var(--glass); backdrop-filter:blur(24px) saturate(170%);
  -webkit-backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow-pop);
  max-width:calc(100vw - 24px); overflow-x:auto; scrollbar-width:none;
  margin-bottom:env(safe-area-inset-bottom, 0px);
}
#dock::-webkit-scrollbar{display:none}
.dock-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.dock-btn{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  transition:transform .18s cubic-bezier(.2,.9,.3,1.4), box-shadow .18s;
  box-shadow:0 4px 12px -4px rgba(0,0,0,.55);
}
.dock-btn:hover{transform:translateY(-9px) scale(1.08);box-shadow:0 10px 20px -6px rgba(0,0,0,.6)}
.dock-dot{width:4px;height:4px;border-radius:99px;background:var(--text-2);opacity:0;transition:opacity .15s}
.dock-item.running .dock-dot{opacity:.85}
.dock-tip{
  position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
  background:var(--glass-strong);backdrop-filter:blur(12px);border:1px solid var(--border);
  padding:3px 9px;border-radius:7px;font-size:11.5px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .14s;box-shadow:var(--shadow-pop);
}
.dock-item:hover .dock-tip{opacity:1}
.dock-sep{width:1px;align-self:stretch;background:var(--border);margin:6px 4px}

/* ---------- generic UI kit ---------- */
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.app-head{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface);
}
.app-head h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.app-head .sub{color:var(--muted);font-size:12px}
.app-body{flex:1;min-height:0;overflow:auto;padding:16px}
.app-body.nopad{padding:0}
.split{display:flex;height:100%;min-height:0}
.side{flex:0 0 216px;border-right:1px solid var(--border);background:var(--surface-2);overflow:auto;padding:10px}
.side.wide{flex-basis:260px}
.main{flex:1;min-width:0;min-height:0;overflow:auto}
.spacer{flex:1}

.btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-sm);
  background:var(--surface-3);border:1px solid var(--border);font-size:13px;font-weight:600;
  transition:background .15s,border-color .15s,transform .08s;
}
.btn:hover{background:var(--border);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent-fill);border-color:transparent;color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent-fill)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--crit)}
.btn.danger:hover{background:rgba(208,59,59,.14)}
.btn[disabled]{opacity:.45;pointer-events:none}

.inp,select.inp,textarea.inp{
  width:100%;padding:7px 10px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--border);transition:border-color .15s,background .15s;font-size:13px;
}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.55}
label.fld{display:block;margin-bottom:10px}
label.fld > .lb{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px}
.row > *{flex:1;min-width:0}

.card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px}
.card.pad0{padding:0;overflow:hidden}
.card h3{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--text-2)}
.grid{display:grid;gap:12px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;
  font-size:11.5px;font-weight:600;background:var(--surface-3);border:1px solid var(--border);
}
.chip .dot{width:7px;height:7px;border-radius:99px;flex:0 0 auto}
.navitem{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-sm);
  font-size:13px;width:100%;text-align:left;transition:background .13s;
}
.navitem:hover{background:var(--surface-3)}
.navitem.active{background:var(--accent-soft);color:var(--text);font-weight:600}
.navitem .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.navitem .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-h{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px 5px}
.empty{display:grid;place-items:center;align-content:center;height:100%;min-height:180px;text-align:center;color:var(--muted);padding:30px;gap:8px}
.empty .big{font-size:34px;opacity:.5}
.hr{height:1px;background:var(--border);margin:12px 0;border:0}
.mono{font-variant-numeric:tabular-nums}
.tiny{font-size:11.5px;color:var(--muted)}
.strike{text-decoration:line-through;opacity:.5}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:7px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border)}
.tbl tr:hover td{background:var(--surface-2)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}

  .vision-editable{padding:10px 12px;border:1px solid transparent;border-radius:12px;transition:background .18s,border-color .18s,transform .18s}
  .vision-editable:hover{background:rgba(255,255,255,.045);border-color:var(--border);transform:translateY(-1px)}
  .ck .btn{opacity:.55;transition:opacity .16s,transform .16s}
  .ck:hover .btn{opacity:1}
  .trait{transition:transform .16s,box-shadow .16s}
  .trait:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(0,0,0,.12)}
.goal-stages{display:grid;gap:5px;margin-top:10px}.goal-stage{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:5px 7px;border:1px solid var(--border);background:var(--surface-2);border-radius:9px;color:var(--text-2);cursor:pointer}.goal-stage span{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;background:var(--surface-3);font-size:9px;font-weight:800}.goal-stage em{font-style:normal;font-size:10.5px}.goal-stage.done{border-color:color-mix(in srgb,var(--good) 35%,var(--border));background:color-mix(in srgb,var(--good) 8%,var(--surface-2))}.goal-stage.done span{background:var(--good);color:#08110d}.challenge-progress-history{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.challenge-progress-history span{font-size:9px;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted)}
.rich-note-toolbar .rich-note-swatch{width:22px;height:22px;min-width:22px;padding:0;border-radius:7px;border:1px solid rgba(255,255,255,.22);cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.16);transition:.16s ease}.rich-note-toolbar .rich-note-swatch:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 5px 12px rgba(0,0,0,.24)}.rich-note-toolbar .rich-note-swatch.deep{border-color:rgba(255,255,255,.38)}
</style>

<style>
/* ---------- modal / sheet ---------- */
#modal-root{position:fixed;inset:0;z-index:9500;display:none;align-items:center;justify-content:center;padding:20px}
#modal-root.open{display:flex}
#modal-root .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
.sheet{
  position:relative;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r-win);box-shadow:var(--shadow-win);width:100%;
  max-height:min(86vh,760px);display:flex;flex-direction:column;overflow:hidden;
  animation:winIn .15s cubic-bezier(.2,.8,.3,1);
}
.sheet.wide{width:100%}
.sheet-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sheet-h h3{margin:0;font-size:15px;font-weight:700}
.sheet-b{padding:18px;overflow:auto;flex:1}
.sheet-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2)}

/* ---------- spotlight ---------- */
#spot{position:fixed;inset:0;z-index:9600;display:none;justify-content:center;padding-top:14vh}
#spot.open{display:flex}
#spot .scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(4px)}
.spot-box{
  position:relative;width:min(620px,92vw);height:max-content;max-height:64vh;display:flex;flex-direction:column;
  background:var(--glass-strong);backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--border-strong);border-radius:16px;box-shadow:var(--shadow-win);overflow:hidden;
}
.spot-box input{
  width:100%;padding:16px 18px;background:transparent;border:none;font-size:17px;outline:none;
}
.spot-res{overflow:auto;border-top:1px solid var(--border);padding:6px}
.spot-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;width:100%;text-align:left}
.spot-item.sel{background:var(--accent-soft)}
.spot-item .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
.spot-item .t{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot-item .s{font-size:11.5px;color:var(--muted)}
.spot-hint{padding:8px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;gap:14px}
kbd{background:var(--surface-3);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:10.5px;font-family:var(--font)}

/* ---------- toast ---------- */
#toasts{position:fixed;bottom:calc(var(--dock-h) + 18px);left:50%;transform:translateX(-50%);z-index:9700;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--glass-strong);backdrop-filter:blur(18px);border:1px solid var(--border-strong);
  padding:9px 16px;border-radius:99px;font-size:13px;box-shadow:var(--shadow-pop);
  animation:toastIn .2s cubic-bezier(.2,.8,.3,1);display:flex;align-items:center;gap:8px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- calendar ---------- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,minmax(92px,1fr));min-height:100%;border-top:1px solid var(--border);border-left:1px solid var(--border)}
.cal-dow{padding:7px 8px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface-2);text-align:center}
.cal-cell{min-height:96px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px 6px;display:flex;flex-direction:column;gap:3px;transition:background .12s;cursor:pointer;position:relative}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.out{opacity:.38}
.cal-cell.today .dnum{background:var(--accent);color:#fff;font-weight:700}
.cal-cell .dnum{width:23px;height:23px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.cal-cell.wknd{background:var(--surface-2)}
.cal-cell.wknd:hover{background:var(--surface-3)}
.ev{
  font-size:11px;padding:2px 6px;border-radius:5px;display:flex;align-items:center;gap:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
  background:var(--surface-3);border-left:3px solid var(--muted);
}
.ev:hover{filter:brightness(1.12)}
.ev .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .tm{color:var(--muted);font-variant-numeric:tabular-nums;font-size:10px;flex:0 0 auto}
.cal-more{font-size:10.5px;color:var(--muted);padding-left:4px}
.agenda-day{padding:10px 14px;border-bottom:1px solid var(--border)}
.agenda-day .dh{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.agenda-ev{display:flex;gap:11px;padding:7px 9px;border-radius:var(--r-sm);align-items:flex-start}
.agenda-ev:hover{background:var(--surface-2)}
.agenda-ev .bar{width:3px;align-self:stretch;border-radius:99px;flex:0 0 auto;min-height:24px}
.agenda-ev .tm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 62px}

/* ---------- tasks ---------- */
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:var(--r-sm);transition:background .12s}
.task:hover{background:var(--surface-2)}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task.task-notdone{background:color-mix(in srgb,var(--crit) 4%,transparent);border:1px solid color-mix(in srgb,var(--crit) 16%,transparent)}
.cbox{
  width:18px;height:18px;border-radius:99px;border:1.8px solid var(--muted);flex:0 0 auto;margin-top:1px;
  display:grid;place-items:center;transition:background .15s,border-color .15s;
}
.cbox:hover{border-color:var(--accent)}
.cbox.on{background:var(--good);border-color:var(--good)}
.cbox svg{opacity:0}.cbox.on svg{opacity:1}
.task .ttl{font-size:13.5px;word-break:break-word}
.task .meta{display:flex;gap:9px;align-items:center;margin-top:3px;flex-wrap:wrap}
.pri{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.due{font-size:11.5px;color:var(--muted)}
.due.over{color:var(--crit);font-weight:700}
.due.soon{color:var(--warn);font-weight:700}
.quickadd{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.prog{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}

/* ---------- notes ---------- */
.note-item{padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent}
.note-item:hover{background:var(--surface-3)}
.note-item.active{background:var(--accent-soft);border-color:var(--border)}
.note-item .nt{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item .np{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
#note-title{width:100%;border:none;background:transparent;font-size:21px;font-weight:700;padding:0;outline:none;letter-spacing:-.02em}
#note-body{width:100%;flex:1;border:none;background:transparent;outline:none;resize:none;font-size:14px;line-height:1.7;font-family:var(--font)}
.mood{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-size:17px;border:1.5px solid var(--border);transition:transform .12s}
.mood:hover{transform:scale(1.1)}
.mood.on{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- habits ---------- */
.hb-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.hb-name{flex:0 0 150px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;overflow:hidden}
.hb-cells{display:flex;gap:4px;flex:1;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hb-cells::-webkit-scrollbar{display:none}
.hb-cell{width:26px;height:26px;border-radius:7px;flex:0 0 auto;background:var(--surface-3);border:1px solid transparent;display:grid;place-items:center;font-size:9.5px;color:var(--muted);transition:transform .1s}
.hb-cell:hover{transform:scale(1.14)}
.hb-cell.today{border-color:var(--border-strong)}
.streak{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:52px;text-align:right}

/* ---------- pomodoro ---------- */
.pomo-wrap{display:grid;place-items:center;gap:20px;padding:26px 16px}
.pomo-ring{position:relative;width:224px;height:224px}
.pomo-ring svg{transform:rotate(-90deg)}
.pomo-time{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pomo-mode{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:99px;border:1px solid var(--border)}
.pomo-mode button{padding:5px 15px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.pomo-mode button.on{background:var(--accent);color:#fff}

/* ---------- goal command summary ---------- */
.goal-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.goal-summary>div{position:relative;overflow:hidden;padding:13px 15px;border:1px solid var(--border);border-radius:12px;background:linear-gradient(145deg,var(--surface-2),var(--surface))}

.goal-summary small{display:block;color:var(--text-2);font-size:10.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:650px){.goal-summary{grid-template-columns:1fr}.goal-summary>div{min-height:80px}}

/* ---------- home command center ---------- */
.home-hero{
  position:relative; overflow:hidden; min-height:180px; display:flex; align-items:center;
  gap:18px; padding:24px 28px; margin-bottom:16px;
  border:1px solid var(--border-strong); border-radius:18px;
  background:
    radial-gradient(500px 220px at 90% 20%,rgba(139,95,191,.28),transparent 70%),
    radial-gradient(400px 220px at 15% 100%,rgba(238,107,147,.20),transparent 70%),
    linear-gradient(135deg,var(--glass-strong),rgba(55,31,67,.55));
  backdrop-filter:blur(18px) saturate(135%);
  box-shadow:var(--shadow-glass);
}
.home-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.045),transparent 70%);pointer-events:none}
.home-hero-copy{position:relative;z-index:2;max-width:600px}
.home-kicker{font-size:10px;letter-spacing:.18em;font-weight:800;color:var(--accent);margin-bottom:7px}
.home-title{font-size:31px;line-height:1.05;font-weight:700;letter-spacing:-.035em}
.home-date{font-size:13px;color:var(--text-2);margin-top:8px}
.home-note{font-size:12px;color:var(--muted);margin-top:12px;max-width:520px}
.home-live{position:relative;z-index:2;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.04em;color:var(--text);white-space:nowrap}
.home-orb{position:relative;width:120px;height:120px;flex:0 0 120px;display:grid;place-items:center;color:var(--text);border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 62%);z-index:1}

.home-orbit{position:absolute;border:1px solid rgba(255,255,255,.18);border-radius:50%;inset:4px;transform:rotate(-20deg)}
.home-orbit.o1{inset:0 8px;transform:rotate(24deg)}
.home-orbit.o2{inset:10px -4px;transform:rotate(-38deg)}
.home-orbit.o3{inset:-6px 16px;transform:rotate(68deg);opacity:.5}
.home-stat{
  position:relative;overflow:hidden;padding:14px 15px 13px 58px;min-height:106px;
  background:linear-gradient(150deg,var(--surface-2),var(--surface));
  border:1px solid var(--border);border-radius:13px;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.home-stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-glass);border-color:var(--border-strong)}
.home-stat-icon{
  position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:10px;
  display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--tile),color-mix(in srgb,var(--tile) 55%,#000));
  box-shadow:0 6px 14px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.2)
}
.home-stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.home-stat .v{font-size:25px;line-height:1.05;font-weight:600;margin-top:5px}
.home-stat .d{font-size:11px;color:var(--text-2);margin-top:5px}
@media(max-width:700px){
  .home-hero{padding:20px;min-height:155px}.home-orb{width:86px;height:86px;flex-basis:86px}.home-orb i{width:48px;height:48px}.home-title{font-size:25px}.home-note{display:none}.home-live{font-size:20px}
}
/* Goal seasons + stickers */
.goal-season{margin:22px 0 28px;position:relative}.goal-season-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:10px 14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--season-color) 30%,var(--border));background:linear-gradient(100deg,color-mix(in srgb,var(--season-color) 14%,var(--surface-2)),transparent 72%);position:relative;overflow:hidden}.goal-season-head:after{content:"";position:absolute;width:150px;height:150px;right:-55px;top:-70px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--season-color) 24%,transparent),transparent 68%);pointer-events:none}.goal-season-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--season-color),color-mix(in srgb,var(--season-color) 45%,#111));color:#fff;font-size:22px;box-shadow:0 9px 24px color-mix(in srgb,var(--season-color) 22%,transparent);z-index:1}.goal-season-title{font-size:15px;font-weight:850}.goal-season-sub{font-size:10.5px;color:var(--muted);margin-top:2px}.goal-season-count{margin-left:auto;font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px;background:color-mix(in srgb,var(--season-color) 11%,var(--surface-3));color:var(--text-2);z-index:1}.goal-sticker{position:absolute;right:12px;top:10px;width:auto;height:auto;display:grid;place-items:center;background:transparent;border:0;box-shadow:none;font-size:31px;line-height:1;transform:none;z-index:2}.goal-v5 h3{padding-right:50px}.goal-season .goal-v5{min-height:188px}.challenge-dates{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.challenge-date{font-size:10px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-2)}
@media(max-width:700px){.goal-season-head{padding:9px 10px}.goal-season-count{display:none}.goal-sticker{font-size:27px;width:auto;height:auto}}
/* ---------- goal system ---------- */
.goal-kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;margin:0 0 14px}
.goal-kpi-mini{padding:10px 11px;border:1px solid var(--border);background:linear-gradient(135deg,var(--surface-2),var(--surface));border-radius:11px;box-shadow:0 8px 22px rgba(0,0,0,.08)}
.goal-kpi-top{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700}.goal-kpi-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.goal-kpi-top strong{color:var(--accent)}
.goal-kpi-bar,.body-target-bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:7px}.goal-kpi-bar i,.body-target-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--c13));transition:width .25s}.body-target-bar.pink i{background:linear-gradient(90deg,var(--c1),var(--c14))}
/* ---------- body tracker ---------- */
.body-dashboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.body-stat{position:relative;overflow:hidden;padding:16px 15px 15px 54px;min-height:118px;border:1px solid var(--border);border-radius:15px;background:linear-gradient(145deg,var(--surface-2),var(--surface));box-shadow:0 10px 30px rgba(0,0,0,.09)}
.body-stat::after{content:"";position:absolute;width:90px;height:90px;right:-30px;top:-35px;border-radius:50%;background:var(--body-accent,var(--accent));opacity:.12;filter:blur(2px)}
.body-stat-icon{position:absolute;left:14px;top:15px;width:29px;height:29px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--body-accent,var(--accent)),color-mix(in srgb,var(--body-accent,var(--accent)) 55%,#120914));box-shadow:0 8px 18px rgba(0,0,0,.18)}
.body-stat.weight{--body-accent:var(--c13)}.body-stat.protein{--body-accent:var(--c7)}.body-stat.measure{--body-accent:var(--c3)}
.body-stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.body-stat .v{font-size:28px;line-height:1.1;font-weight:700;margin-top:5px}.body-stat .v span{font-size:12px;color:var(--muted);margin-left:4px;font-weight:600}.body-stat .d{font-size:11px;color:var(--text-2);margin-top:6px}
.body-targets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:12px}.body-target-card{padding:12px 14px;border-radius:13px;background:linear-gradient(135deg,rgba(139,92,246,.10),rgba(255,92,138,.06));border:1px solid var(--border)}.body-target-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700}.body-target-head strong{font-variant-numeric:tabular-nums}
.body-chart{min-height:150px}.body-chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.body-chart-head h3{margin:0}.body-spark{height:86px;display:flex;align-items:flex-end;gap:5px;padding:6px 2px}.body-bar{flex:1;min-width:5px;max-width:18px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--accent),var(--plum));opacity:.82;transition:transform .15s}.body-bar:hover{transform:translateY(-3px);opacity:1}
.measure-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.measure-card{padding:11px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2)}.measure-name{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.measure-v{font-size:22px;font-weight:700;margin-top:4px}.measure-v span{font-size:10px;color:var(--muted);margin-left:3px}.measure-d{font-size:10.5px;margin-top:4px;color:var(--muted)}.measure-d.good{color:var(--good)}
.body-history{display:flex;flex-direction:column;gap:5px}.body-history-row{display:grid;grid-template-columns:1.2fr .8fr 1fr 1fr;gap:8px;align-items:center;padding:9px 10px;border:1px solid transparent;border-radius:9px;background:var(--surface-2);text-align:left;font-size:11.5px}.body-history-row:hover{border-color:var(--border-strong);background:var(--surface-3)}.body-history-row strong{font-variant-numeric:tabular-nums}.body-empty{display:flex;align-items:center;gap:14px;margin-bottom:12px;background:linear-gradient(135deg,rgba(255,92,138,.10),rgba(139,92,246,.10));border-color:var(--border-strong)}.body-empty-orb{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;color:#fff;background:conic-gradient(from 20deg,var(--c14),var(--c11),var(--c7),var(--c3),var(--c14));box-shadow:0 10px 28px rgba(0,0,0,.18)}
@media(max-width:760px){.body-dashboard,.body-targets{grid-template-columns:1fr}.measure-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.body-history-row{grid-template-columns:1fr 1fr}.body-history-row span:nth-child(n+3){display:none}}
/* ---------- finance / charts ---------- */
.stat{
  position:relative; overflow:hidden;
  background:linear-gradient(150deg,var(--surface-2),var(--surface));
  border:1px solid var(--border); border-radius:var(--r-md); padding:13px 15px;
  transition:transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s, border-color .2s;
}
.stat::before{
  content:""; position:absolute; inset:0 auto auto 0; width:100%; height:2px;
  background:linear-gradient(90deg,var(--accent),transparent 70%); opacity:.6;
}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-glass);border-color:var(--border-strong)}
.card.glass{
  background:var(--glass); backdrop-filter:blur(12px) saturate(140%);
  -webkit-backdrop-filter:blur(12px) saturate(140%);
  border:1px solid var(--border-strong); box-shadow:var(--shadow-glass);
}
.card.glass:hover{box-shadow:var(--shadow-pop)}
.color-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;padding:4px 0}
.color-opt{
  display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r-sm);
  border:1.5px solid var(--border);background:var(--surface);transition:all .15s;font-size:12px;
}
.color-opt:hover{border-color:var(--border-strong);background:var(--surface-2);transform:translateY(-1px)}
.color-opt.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.color-opt .swatch{width:22px;height:22px;border-radius:50%;flex:0 0 auto;border:2px solid var(--border-strong);transition:transform .2s}
.color-opt:hover .swatch{transform:scale(1.12)}
.color-opt .cname{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.stat .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.bar-row{display:grid;grid-template-columns:118px 1fr 92px;gap:11px;align-items:center;padding:5px 0}
.bar-row .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.bar-track{height:20px;background:var(--surface-3);border-radius:5px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:0 4px 4px 0;transition:width .45s cubic-bezier(.2,.8,.3,1);min-width:2px}
.bar-row .vl{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:600}
.spark{display:flex;align-items:flex-end;gap:3px;height:70px}
.spark .sb{flex:1;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px;position:relative;transition:opacity .15s}
.spark .sb:hover{opacity:.75}
.budget-bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.budget-bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.tt{position:fixed;z-index:9800;background:var(--glass-strong);backdrop-filter:blur(14px);border:1px solid var(--border-strong);border-radius:8px;padding:7px 11px;font-size:12px;box-shadow:var(--shadow-pop);pointer-events:none;display:none;white-space:nowrap}
.tt.on{display:block}
.tt .tk{color:var(--muted);font-size:11px}
.tt .tv{font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- trips ---------- */
.trip-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;cursor:pointer;transition:border-color .15s,transform .12s}
.trip-card:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.trip-hero{height:82px;display:flex;align-items:flex-end;padding:11px 14px;color:#fff;position:relative}
.trip-hero .cd{position:absolute;top:10px;right:12px;font-size:11px;font-weight:700;background:rgba(0,0,0,.32);padding:2px 9px;border-radius:99px;backdrop-filter:blur(6px)}
.trip-hero h4{margin:0;font-size:16px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.45)}

/* Courses: richer, color-led cards */
.course-card{position:relative;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;box-shadow:0 5px 18px rgba(10,2,14,.10)}
.course-card:hover{transform:translateY(-5px);border-color:var(--border-strong);box-shadow:0 16px 34px rgba(10,2,14,.18)}
.course-card .course-cover{height:112px;position:relative;padding:14px;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.course-card .course-cover:before{content:'';position:absolute;inset:-35%;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.42),transparent 32%),radial-gradient(circle at 15% 100%,rgba(255,255,255,.16),transparent 38%);transform:rotate(-8deg);pointer-events:none}
.course-card .course-cover:after{content:'';position:absolute;left:0;right:0;bottom:0;height:48%;background:linear-gradient(transparent,rgba(0,0,0,.34));pointer-events:none}
.course-card .course-icon{position:absolute;top:13px;left:14px;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);z-index:1}
.course-card .course-cost{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;backdrop-filter:blur(8px);z-index:2}
.course-card .course-title{position:relative;z-index:2;font-size:16px;font-weight:750;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.35);max-width:82%}
.course-card .course-body{padding:13px 14px 15px}
.course-card .course-meta{display:flex;align-items:center;gap:7px;min-height:25px}
.course-card .course-status{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;font-size:10.5px;font-weight:750;background:var(--surface-3);border:1px solid var(--border)}
.course-card .course-provider{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-card .course-reason{margin-top:10px;font-size:12px;line-height:1.55;color:var(--text-2);min-height:37px}
.course-card .course-progress{margin-top:12px}
.course-card .course-progress-row{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:5px}
.course-card .course-progress-bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.course-card .course-progress-bar i{display:block;height:100%;border-radius:999px;transition:width .2s ease}
.course-card .course-accent{position:absolute;left:0;top:0;bottom:0;width:4px;z-index:4}
.ck{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--r-sm)}
.ck:hover{background:var(--surface-3)}
.ck.on .cktext{text-decoration:line-through;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);padding:3px;border-radius:var(--r-sm);border:1px solid var(--border);gap:2px}
.seg button{padding:4px 12px;border-radius:5px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* ---------- Akedia 25 ---------- */
.vision-hero{
  position:relative; overflow:hidden; border-radius:var(--r-md);
  padding:26px 28px; border:1px solid var(--plum); isolation:isolate;
}
.vision-hero::before{
  content:""; position:absolute; inset:-60%; z-index:-1; opacity:.30;
  background:conic-gradient(from 0deg, var(--plum), var(--accent), var(--plum), var(--accent), var(--plum));
  filter:blur(70px); animation:auraSpin 26s linear infinite;
}
html[data-theme="light"] .vision-hero::before{opacity:.20}
@keyframes auraSpin{to{transform:rotate(360deg)}}
.vision-motto{
  font-size:clamp(20px,3.1vw,32px); font-weight:700; line-height:1.28;
  letter-spacing:-.015em; text-wrap:balance;
}
.vision-nums{display:flex;gap:30px;flex-wrap:wrap;margin-top:20px}
.vision-num{font-variant-numeric:tabular-nums;font-size:32px;font-weight:600;line-height:1;letter-spacing:-.02em}
.vision-num.big{font-size:44px}

/* a life, one square per week */
.wk-grid{display:grid;grid-template-columns:repeat(52,minmax(0,11px));gap:2.5px;margin-top:8px;justify-content:start}
.wk{aspect-ratio:1;border-radius:2px;background:var(--surface-3);opacity:.5}
.wk.lived{background:var(--plum);opacity:1}
.wk.now{background:var(--accent);box-shadow:0 0 0 1.5px var(--surface),0 0 9px var(--accent);animation:nowPulse 2.6s ease-in-out infinite}
@keyframes nowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
.wk-legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}

/* trait chips that actually glow a little */
.trait{
  display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:99px;
  font-size:13.5px;font-weight:600;border:1px solid var(--plum);
  background:color-mix(in srgb, var(--plum) 15%, transparent);
  transition:transform .14s, box-shadow .18s;
}
.trait:hover{transform:translateY(-2px);box-shadow:0 6px 18px -6px var(--plum)}

/* circular progress on the pillar cards */
.ring{position:relative;width:62px;height:62px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg);display:block}
.ring .pct{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.pillar-card{
  background:linear-gradient(155deg,color-mix(in srgb,var(--pc) 12%,var(--surface-2)),var(--surface-2) 60%);

const Vault = (() => {

  let mem = null, persistent = true;
  try { const t = '__orbit__'; localStorage.setItem(t, '1'); localStorage.removeItem(t); }
  catch (e) { persistent = false; }
  return {
    get persistent() { return persistent; },
    load() { try { return persistent ? localStorage.getItem(KEY) : mem; } catch (e) { return mem; } },
    save(v) { try { if (persistent) { localStorage.setItem(KEY, v); return; } } catch (e) { persistent = false; } mem = v; },
    wipe() { try { localStorage.removeItem(KEY); } catch (e) {} mem = null; }
  };
})();

/* a snapshot of your own data is baked into this file, so a fresh copy
   (new browser, new device, a re-download) never starts blank */
function embeddedSnapshot() {
  try {
    const el = document.getElementById('orbit-snapshot');
    if (!el) return null;
    const p = JSON.parse(el.textContent);
    return (p && typeof p === 'object') ? p : null;
  } catch (e) { console.warn('Embedded snapshot unreadable', e); return null; }
}
const isEmptyDB = p => !p || !(
  (p.events || []).length + (p.txns || []).length + (p.tasks || []).length +
  (p.notes || []).length + (p.courses || []).length + (p.trips || []).length +
  (p.habits || []).length + (p.goals || []).length + ((p.vision || {}).pillars || []).length);

function restoreSnapshot(quiet) {
  const snap = embeddedSnapshot();
  if (!snap) return false;
  const keep = DB.settings || {};
  DB = Object.assign(DEFAULTS(), snap);
  DB.settings = Object.assign(DEFAULTS().settings, snap.settings || {}, { googleClientId: keep.googleClientId || (snap.settings || {}).googleClientId || '' });
  DB.settings.snapDone = true;
  migrate(); save();
  if (!quiet) toast('Restored your data from the copy inside this file', 'download');
  return true;
}

function loadDB() {
  const raw = Vault.load();
  if (!raw) { DB = DEFAULTS(); if (!restoreSnapshot(true)) save(); return; }
  try {
    const p = JSON.parse(raw);
    DB = Object.assign(DEFAULTS(), p);
    DB.settings = Object.assign(DEFAULTS().settings, p.settings || {});
    DB.settings.pomo = Object.assign({ focus: 25, short: 5, long: 15 }, (p.settings || {}).pomo || {});
    if (isEmptyDB(p) && !DB.settings.snapDone) { DB.settings.snapDone = true; restoreSnapshot(true); }
  } catch (e) { console.warn('Could not read saved data, starting fresh.', e); seed(); }
  migrate();
  if (restoreCourseNotesLocal()) Vault.save(JSON.stringify(DB));
}
/* runs after every route that replaces DB: local load, Drive restore, backup import */
function migrate() {

function makeDraggable(node, handle) {
  handle.addEventListener('pointerdown', e => {
    if (e.target.closest('.light') || e.button !== 0) return;
    if (node.classList.contains('maximized')) return;
    const r = node.getBoundingClientRect();
    const ox = e.clientX - r.left, oy = e.clientY - r.top;
    handle.setPointerCapture(e.pointerId);
    const mv = ev => {
      node.style.left = clamp(ev.clientX - ox, -r.width + 90, window.innerWidth - 90) + 'px';
      node.style.top = clamp(ev.clientY - oy, 32, window.innerHeight - 44) + 'px';
    };
    const up = () => { handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); };
    handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up);
  });

function makeResizable(node) {
  $$('.win-rz', node).forEach(hd => {
    const dir = hd.className.split('rz-')[1];
    hd.addEventListener('pointerdown', e => {
      if (e.button !== 0 || node.classList.contains('maximized')) return;
      e.preventDefault(); e.stopPropagation();
      const r = node.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY;
      hd.setPointerCapture(e.pointerId);
      const mv = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (dir.includes('e')) node.style.width = Math.max(320, r.width + dx) + 'px';
        if (dir.includes('s')) node.style.height = Math.max(220, r.height + dy) + 'px';
        if (dir.includes('w')) { const w = Math.max(320, r.width - dx); node.style.width = w + 'px'; node.style.left = (r.right - w) + 'px'; }
        if (dir.includes('n')) { const ht = Math.max(220, r.height - dy); node.style.height = ht + 'px'; node.style.top = Math.max(32, r.bottom - ht) + 'px'; }
      };
      const up = () => { hd.removeEventListener('pointermove', mv); hd.removeEventListener('pointerup', up); };
      hd.addEventListener('pointermove', mv); hd.addEventListener('pointerup', up);
    });
  });

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => clamp(Math.round(c + (amt / 100) * 255), 0, 255);

const PALETTE = [

  ['var(--c5)', 'Leaf'], ['var(--c6)', 'Mint'], ['var(--c7)', 'Teal'], ['var(--c8)', 'Sky'],
  ['var(--c9)', 'Blue'], ['var(--c10)', 'Iris'], ['var(--c11)', 'Violet'], ['var(--c12)', 'Purple'],
  ['var(--c13)', 'Orchid'], ['var(--c14)', 'Pink'], ['var(--c15)', 'Blossom'], ['var(--c16)', 'Rose'],
  ['var(--c17)', 'Ember'], ['var(--c18)', 'Honey'], ['var(--c19)', 'Emerald'], ['var(--c20)', 'Lagoon'],
];

function field(f, val) {
  const wrap = h('label', { class: 'fld' });
  if (f.label) wrap.append(h('span', { class: 'lb', text: f.label }));
  let inp;
  if (f.type === 'textarea') inp = h('textarea', { class: 'inp', placeholder: f.placeholder || '', rows: f.rows || 4 });
  else if (f.type === 'select') {
    inp = h('select', { class: 'inp' });
    (f.options || []).forEach(o => {
      const [v, l] = Array.isArray(o) ? o : [o, o];
      inp.append(h('option', { value: v, text: l }));
    });
  } else if (f.type === 'color') {
    inp = h('input', { type: 'hidden' });
    const opts = (f.options && f.options.length ? f.options : PALETTE).map(o => Array.isArray(o) ? o : [o, o]);
    if (val && !opts.some(o => o[0] === val)) opts.unshift([val, 'Current']);
    const grid = h('div', { class: 'color-grid' });
    const paint = () => [...grid.children].forEach(b => b.classList.toggle('active', b.dataset.v === inp.value));
    opts.forEach(([v, l]) => grid.append(h('button', {
      type: 'button', class: 'color-opt', dataset: { v }, title: l,
      html: `<i class="swatch" style="background:${v}"></i><span class="cname">${esc(l)}</span>`,
      onclick: () => { inp.value = v; paint(); } })));
    if (!val && !f.def && opts.length) inp.value = opts[0][0];
    wrap.append(grid);
    f._paint = paint;
  } else {
    inp = h('input', { class: 'inp', type: f.type || 'text', placeholder: f.placeholder || '', step: f.step, min: f.min });
    if (f.suggest && f.suggest.length) {
      const lid = 'dl-' + f.k + '-' + uid();
      const dl = h('datalist', { id: lid });
      f.suggest.forEach(o => dl.append(h('option', { value: o })));
      inp.setAttribute('list', lid);
      wrap.append(dl);
    }
  }
  inp.name = f.k;
  if (val != null) inp.value = val;
  else if (f.def != null) inp.value = f.def;
  if (f.required && f.type !== 'color') inp.required = true;
  wrap.append(inp);
  if (f._paint) f._paint();
  if (f.hint) wrap.append(h('div', { class: 'tiny', text: f.hint, style: { marginTop: '4px' } }));
  return wrap;
}
function formModal(title, fields, init = {}, opts = {}) {

    form.onsubmit = e => {
      e.preventDefault();
      const out = {};
      fields.flatMap(f => f.type === 'row' ? f.fields : [f]).forEach(f => {
        const el = form.querySelector(`[name="${f.k}"]`); if (!el) return;
        out[f.k] = f.type === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value;
      });
      closeModal(); resolve(out);
    };
    modal({ title, bodyNode: form, footNode: foot, wide: opts.wide });
  });
}
function confirmModal(title, msg, okLabel = 'Delete') {
  return new Promise(resolve => {
    const body = h('div', { text: msg, style: { color: 'var(--text-2)' } });
    const foot = h('div', { style: { display: 'flex', gap: '8px' } },

}
function toast(msg, ic = 'check') {
  const t = h('div', { class: 'toast', html: `${icon(ic, 15)}<span>${esc(msg)}</span>` });
  $('#toasts').append(t);
  setTimeout(() => { t.style.transition = 'opacity .3s,transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 320); }, 2200);
}

/* ---------- chart tooltip ---------- */
const TT = $('#tooltip');
function bindTip(node, htmlFn) {
  node.addEventListener('pointerenter', () => { TT.innerHTML = htmlFn(); TT.classList.add('on'); });
  node.addEventListener('pointermove', e => {
    TT.style.left = Math.min(e.clientX + 14, window.innerWidth - TT.offsetWidth - 10) + 'px';
    TT.style.top = Math.max(8, e.clientY - TT.offsetHeight - 12) + 'px';
  });
  node.addEventListener('pointerleave', () => TT.classList.remove('on'));
}

/* ---------- file import / export ---------- */
function downloadFile(name, content, type = 'application/json') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function pickFile(accept) {
  return new Promise(res => {
    const i = h('input', { type: 'file', accept, style: { display: 'none' } });
    i.onchange = () => { const f = i.files[0]; if (!f) return res(null); const r = new FileReader(); r.onload = () => res({ name: f.name, text: r.result }); r.readAsText(f); i.remove(); };
    document.body.append(i); i.click();
  });
}
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  const s = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) { if (c === '"') { if (s[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

<script>
/* ============================================================
   THE SAMPLE-DATA SWEEPER

   Earlier versions of Orbit filled themselves with invented content on
   first run. That was a mistake. This finds those exact records — by
   their exact titles, so nothing of yours is ever caught by accident —
   and offers to take them out, leaving anything you wrote untouched.
   ============================================================ */
const SAMPLE = {
  events: ['Morning workout', 'Team standup', 'Dentist', 'Dinner with friends', 'Quarterly review', 'Grocery run', 'Flight to Lisbon', 'Pay rent'],
  tasks: ['Renew passport', 'Draft Q3 summary', 'Reply to landlord', 'Book Lisbon airport transfer', 'Finish chapter 4 exercises', 'Order new desk lamp', 'Back up laptop', 'Send invoice'],
  notes: ['Lisbon trip ideas', 'Things that made this week better', 'Reading list'],
  habits: ['Read 20 min', 'Exercise', 'No phone before bed', 'Water 2L'],
  projects: ['Personal', 'Work', 'Home', 'Learning'],
  trips: ['Lisbon'],
  journal: ['Slow start, good finish.', 'Too many small interruptions.'],
  reasons: ['Lunch out', 'Coffee and a sandwich', 'Groceries for the week', 'Metro top-up',
    'Taxi home, too late for the bus', 'Monthly subscription', 'Design tool renewal', 'Course instalment',
    'Book I had been putting off', 'Home internet', 'Electricity', 'Water', 'Gym membership',
    'Skin appointment', 'A shirt I did not need', 'Shoes, finally', 'Birthday present',
    'Monthly transfer', 'Monthly pay', 'Side project invoice'],
  /* the even older seed, before Money was rebuilt around your form */
  oldCats: ['Groceries', 'Rent', 'Transport', 'Dining', 'Utilities', 'Shopping', 'Health', 'Subscriptions', 'Salary'],
  budgets: { Groceries: 450, Dining: 200, Transport: 150, Shopping: 250, Subscriptions: 60,
    'Food & Drink': 320, 'Transportation': 150, 'Clothes': 200, 'Digital Tools': 90, 'Knowledge & Improving myself': 250 },
};

/* An entry you typed yourself always carries a reason or a payment source —
   the form makes both unavoidable. The old invented ones carry neither. */
const isSampleTxn = t =>
  SAMPLE.reasons.includes(t.reason) ||
  (!t.source && !t.reason && !t.note && SAMPLE.oldCats.includes(t.category));

function sampleFound() {
  const f = {
    events: DB.events.filter(x => !x.gid && SAMPLE.events.includes(x.title)).length,
    tasks: DB.tasks.filter(x => SAMPLE.tasks.includes(x.title)).length,
    notes: DB.notes.filter(x => SAMPLE.notes.includes(x.title)).length,
    journal: DB.journal.filter(x => SAMPLE.journal.some(b => (x.body || '').startsWith(b))).length,
    habits: DB.habits.filter(x => SAMPLE.habits.includes(x.name)).length,
    trips: DB.trips.filter(x => SAMPLE.trips.includes(x.name) && /Portugal/i.test(x.dest || '')).length,
    txns: DB.txns.filter(isSampleTxn).length,
    sessions: DB.sessions.filter(x => !x.label && x.minutes === 25).length,
  };
  f.total = f.events + f.tasks + f.notes + f.journal + f.habits + f.trips + f.txns;
  return f;
}

function removeSample() {
  const f = sampleFound();
  DB.events = DB.events.filter(x => x.gid || !SAMPLE.events.includes(x.title));
  DB.tasks = DB.tasks.filter(x => !SAMPLE.tasks.includes(x.title));
  DB.notes = DB.notes.filter(x => !SAMPLE.notes.includes(x.title));
  DB.journal = DB.journal.filter(x => !SAMPLE.journal.some(b => (x.body || '').startsWith(b)));
  DB.habits = DB.habits.filter(x => !SAMPLE.habits.includes(x.name));
  DB.trips = DB.trips.filter(x => !(SAMPLE.trips.includes(x.name) && /Portugal/i.test(x.dest || '')));
  DB.txns = DB.txns.filter(x => !isSampleTxn(x));
  DB.sessions = DB.sessions.filter(x => x.label || x.minutes !== 25);
  Object.entries(SAMPLE.budgets).forEach(([k, v]) => { if (DB.budgets[k] === v) delete DB.budgets[k]; });
  /* projects only go if nothing of yours is still filed under them */
  DB.projects = DB.projects.filter(p =>
    !SAMPLE.projects.includes(p.name) || DB.tasks.some(t => t.projectId === p.id));
  DB.catPalette = {};
  DB.settings.sampleDismissed = true;
  save(); refresh();
  return f;
}

function sampleBanner() {

  const acts = h('div', { style: { display: 'flex', gap: '8px', marginTop: '12px', flexWrap: 'wrap' } },
    h('button', { class: 'btn primary', html: `${icon('trash', 14)} Remove all of it`, onclick: async () => {

  card.append(acts);

}
