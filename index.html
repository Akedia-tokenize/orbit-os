<script>
/* ============================================================
   GOOGLE — Calendar (all of them, two-way) + Drive (data sync)

   Everything runs in the browser. Google Identity Services hands us an
   access token and we call the REST APIs directly. No server, no secret.
   Google only allows this from an https origin (or localhost).

   The token is cached in this browser for its ~1 hour life, so a reload
   or a background sync never needs to open a window. Popups are only
   ever opened straight out of a real click.
   ============================================================ */
const TOKEN_KEY = 'orbit.gtoken';

const G = {
  SCOPES: 'https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/drive.appdata openid email',
  token: null, expiry: 0, client: null, email: '', lastError: '',

  get clientId() { return (DB.settings.googleClientId || '').trim(); },
  get originOk() { return location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname); },
  get connected() { return !!this.token && Date.now() < this.expiry; },

  restore() {
    try {
      const t = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null');
      if (t && t.exp > Date.now() + 60000) { this.token = t.tok; this.expiry = t.exp; this.email = t.email || ''; }
    } catch (e) {}
  },
  remember() { try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ tok: this.token, exp: this.expiry, email: this.email })); } catch (e) {} },
  forget() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} },

  loadSdk() {
    if (window.google?.accounts?.oauth2) return Promise.resolve();
    if (this._sdk) return this._sdk;
    this._sdk = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true; s.defer = true;
      s.onload = res;
      s.onerror = () => rej(new Error('Could not reach Google — check your connection.'));
      document.head.append(s);
    });
    return this._sdk;
  },

  /* Only ever called straight out of a click. */
  async auth() {
    if (this.connected) return this.token;
    if (!this.originOk) throw new Error('Google needs an https address. See Settings → Google.');
    if (!this.clientId) throw new Error('Paste your Google Client ID in Settings → Google first.');
    await this.loadSdk();
    return new Promise((resolve, reject) => {
      this.client = google.accounts.oauth2.initTokenClient({
        client_id: this.clientId,
        scope: this.SCOPES,
        callback: r => {
          if (r.error) { this.lastError = r.error_description || r.error; return reject(new Error(this.lastError)); }
          this.token = r.access_token;
          this.expiry = Date.now() + (Number(r.expires_in || 3500) - 180) * 1000;
          this.remember();
          resolve(this.token);
        },
        error_callback: e => {
          const t = e?.type || '';
          if (t === 'popup_failed_to_open') return reject(new Error('POPUP_BLOCKED'));
          if (t === 'popup_closed') return reject(new Error('Sign-in window was closed before you finished.'));
          reject(new Error(e?.message || 'Sign-in failed.'));
        }
      });
      this.client.requestAccessToken();
    });
  },

  disconnect() {
    try { if (this.token) google.accounts.oauth2.revoke(this.token, () => {}); } catch (e) {}
    this.token = null; this.expiry = 0; this.email = '';
    this.forget();
    DB.settings.googleOn = false; commit();
  },

  /* Never opens a popup — throws NEEDS_SIGNIN and lets the UI ask for a click. */
  async api(url, opts = {}) {
    if (!this.connected) throw new Error('NEEDS_SIGNIN');
    const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + this.token, ...(opts.headers || {}) } });
    if (r.status === 401) { this.token = null; this.expiry = 0; this.forget(); throw new Error('NEEDS_SIGNIN'); }
    if (!r.ok) {
      let msg = r.status + ' ' + r.statusText;
      try { const j = await r.json(); msg = j.error?.message || msg; } catch (e) {}
      if (r.status === 403 && /has not been used in project|is disabled/i.test(msg)) throw new Error('API_OFF:' + msg);
      if (r.status === 403 && /insufficient|scope/i.test(msg)) throw new Error('SCOPE_MISSING');
      throw new Error(msg);
    }
    return r.status === 204 ? null : r.json();
  },

  async whoami() {
    try { const j = await this.api('https://www.googleapis.com/oauth2/v3/userinfo'); this.email = j.email || ''; this.remember(); } catch (e) {}
  },

  /* ---------- the calendar list ----------
     A Google account usually has many calendars, not one. We read them all
     and let you tick which ones belong in Orbit. */
  async fetchCalendars() {
    const r = await this.api('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=250&showHidden=false');
    const prev = new Map((DB.gcals || []).map(c => [c.id, c]));
    DB.gcals = (r.items || []).map(c => ({
      id: c.id,
      name: c.summaryOverride || c.summary || c.id,
      color: c.backgroundColor || '#7b3f92',
      readOnly: !['owner', 'writer'].includes(c.accessRole),
      primary: !!c.primary,
      /* first time we see a calendar: sync it, unless it is a holiday feed */
      sync: prev.has(c.id) ? prev.get(c.id).sync : !/holiday|#contacts|birthday/i.test(c.id),
    })).sort((a, b) => (b.primary ? 1 : 0) - (a.primary ? 1 : 0) || a.name.localeCompare(b.name));
    if (!DB.settings.gWriteCal || !DB.gcals.some(c => c.id === DB.settings.gWriteCal && !c.readOnly)) {
      DB.settings.gWriteCal = (DB.gcals.find(c => c.primary && !c.readOnly) || DB.gcals.find(c => !c.readOnly) || {}).id || 'primary';
    }
    return DB.gcals;
  },

  /* ---------- event mapping ---------- */
  toLocal(ev, calId) {
    const allDay = !!ev.start?.date;
    const startISO = ev.start?.dateTime || ev.start?.date;
    const endISO = ev.end?.dateTime || ev.end?.date;
    const hhmm = x => { const t = new Date(x); return pad(t.getHours()) + ':' + pad(t.getMinutes()); };
    return {
      gid: ev.id, gcal: calId, gUpdated: ev.updated,
      title: ev.summary || '(no title)',
      date: allDay ? String(ev.start.date) : ymd(new Date(startISO)),
      start: allDay ? '' : hhmm(startISO),
      end: allDay || !ev.end?.dateTime ? '' : hhmm(endISO),
      allDay, loc: ev.location || '', notes: (ev.description || '').slice(0, 1500),
      cal: 'gcal', dirty: false,
    };
  },
  toGoogle(e) {
    const body = { summary: e.title, location: e.loc || '', description: e.notes || '' };
    if (e.allDay || !e.start) {
      body.start = { date: e.date };
      body.end = { date: addDays(e.date, 1) };
    } else {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const end = e.end && e.end > e.start ? e.end : e.start;
      body.start = { dateTime: `${e.date}T${e.start}:00`, timeZone: tz };
      body.end = { dateTime: `${e.date}T${end}:00`, timeZone: tz };
    }
    return body;
  },

  /* ---------- the calendar sync ---------- */
  async syncCalendar(onProgress = () => {}) {
    if (!DB.gcals || !DB.gcals.length) await this.fetchCalendars();
    const cals = (DB.gcals || []).filter(c => c.sync !== false);
    const writable = new Set(DB.gcals.filter(c => !c.readOnly).map(c => c.id));
    let pushed = 0, pulled = 0, removed = 0;
    const failures = [];
    const justPushed = new Set();   // never sweep away what we only just created

    /* 1 — local deletions go up first */
    for (const t of (DB.gTrash || []).slice()) {
      const cal = t.cal || DB.settings.gWriteCal || 'primary';
      try { await this.api(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal)}/events/${encodeURIComponent(t.gid)}`, { method: 'DELETE' }); } catch (e) { if (e.message === 'NEEDS_SIGNIN') throw e; }
      DB.gTrash = DB.gTrash.filter(x => x.gid !== t.gid);
    }

    /* 2 — local creates and edits */
    for (const e of DB.events.filter(x => x.dirty)) {
      const cal = (e.gcal && writable.has(e.gcal)) ? e.gcal : (DB.settings.gWriteCal || 'primary');
      const body = this.toGoogle(e);
      try {
        if (e.gid) {
          const r = await this.api(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal)}/events/${encodeURIComponent(e.gid)}`,
            { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          e.gUpdated = r.updated;
        } else {
          const r = await this.api(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal)}/events`,
            { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          e.gid = r.id; e.gcal = cal; e.gUpdated = r.updated; e.cal = 'gcal';
        }
        justPushed.add(e.gid);
        e.dirty = false; pushed++;
      } catch (err) { if (err.message === 'NEEDS_SIGNIN') throw err; failures.push(err.message); }
    }

    /* 3 — pull every calendar you ticked */
    const lo = addDays(today(), -180), hi = addDays(today(), 365);
    const timeMin = new Date(fromYmd(lo)).toISOString();
    const timeMax = new Date(fromYmd(hi)).toISOString();
    const seen = new Set();
    const byGid = new Map(DB.events.filter(e => e.gid).map(e => [e.gid, e]));

    for (let i = 0; i < cals.length; i++) {
      const cal = cals[i];
      onProgress(`${i + 1}/${cals.length} · ${cal.name}`);
      let pageToken = '';
      try {
        do {
          const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events`
            + `?singleEvents=true&orderBy=startTime&maxResults=250`
            + `&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}`
            + (pageToken ? `&pageToken=${pageToken}` : '');
          const r = await this.api(url);
          (r.items || []).forEach(ev => {
            if (ev.status === 'cancelled') return;
            seen.add(ev.id);
            const inc = this.toLocal(ev, cal.id);
            const local = byGid.get(ev.id);
            if (!local) { const n = { id: uid(), ...inc }; DB.events.push(n); byGid.set(ev.id, n); pulled++; }
            else if (local.gUpdated !== inc.gUpdated || local.gcal !== cal.id) { Object.assign(local, inc); pulled++; }
          });
          pageToken = r.nextPageToken || '';
        } while (pageToken);
      } catch (err) {
        if (err.message === 'NEEDS_SIGNIN' || String(err.message).startsWith('API_OFF')) throw err;
        failures.push(`${cal.name}: ${err.message}`);
      }
    }

    /* 4 — anything that came from a synced calendar, sits in the window,
           and is no longer there was deleted on Google's side */
    const syncedIds = new Set(cals.map(c => c.id));
    const before = DB.events.length;
    DB.events = DB.events.filter(e =>
      !(e.gid && syncedIds.has(e.gcal) && !seen.has(e.gid) && !justPushed.has(e.gid)
        && e.date >= lo && e.date <= hi && !e.dirty));
    removed = before - DB.events.length;

    return { pushed, pulled, removed, calendars: cals.length, failures };
  },

  /* ---------- Drive (appDataFolder) ---------- */
  FILE: 'orbit-data.json',
  async findFile() {
    const r = await this.api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)&q=${encodeURIComponent("name='" + this.FILE + "'")}`);
    return (r.files || [])[0] || null;
  },
  async readFile(id) {
    if (!this.connected) throw new Error('NEEDS_SIGNIN');
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers: { Authorization: 'Bearer ' + this.token } });
    if (r.status === 401) { this.token = null; this.forget(); throw new Error('NEEDS_SIGNIN'); }
    if (!r.ok) throw new Error('Could not read the backup in Drive.');
    return r.json();
  },
  async writeFile(id) {
    if (!this.connected) throw new Error('NEEDS_SIGNIN');
    const tok = this.token;
    const payload = JSON.stringify(DB);
    if (id) {
      const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
        method: 'PATCH', headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' }, body: payload });
      if (!r.ok) throw new Error(r.status === 401 ? 'NEEDS_SIGNIN' : 'Could not save to Drive.');
      return id;
    }
    const boundary = 'orbit' + uid();
    const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`
      + JSON.stringify({ name: this.FILE, parents: ['appDataFolder'] })
      + `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n--${boundary}--`;
    const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST', headers: { Authorization: 'Bearer ' + tok, 'Content-Type': `multipart/related; boundary=${boundary}` }, body });
    if (!r.ok) throw new Error(r.status === 401 ? 'NEEDS_SIGNIN' : 'Could not create the file in Drive.');
    return (await r.json()).id;
  },

  async syncDrive() {
    const f = await this.findFile();
    if (!f) { DB.driveId = await this.writeFile(null); return { dir: 'up', first: true }; }
    DB.driveId = f.id;
    let remote = null;
    try { remote = await this.readFile(f.id); } catch (e) { if (e.message === 'NEEDS_SIGNIN') throw e; remote = null; }
    if (remote && (remote.savedAt || '') > (DB.savedAt || '')) {
      const keepId = DB.settings.googleClientId;
      DB = Object.assign(DEFAULTS(), remote);
      DB.settings = Object.assign(DEFAULTS().settings, remote.settings || {});
      DB.settings.googleClientId = keepId || DB.settings.googleClientId;
      DB.driveId = f.id;
      Vault.save(JSON.stringify(DB));
      return { dir: 'down' };
    }
    await this.writeFile(f.id);
    return { dir: 'up' };
  },
};

/* ============================================================
   The one entry point the UI calls
   ============================================================ */
let gSyncing = false, gNeedsSignin = false, gProgress = '';

function gExplain(msg) {
  const m = String(msg || '');
  if (m === 'NEEDS_SIGNIN') return { short: 'Your Google session expired', fix: 'Sessions last about an hour. Click Sync now and approve once — after that it stays quiet for another hour.' };
  if (m === 'POPUP_BLOCKED') return { short: 'Your browser blocked the Google window', fix: 'Click the blocked-popup icon in the address bar, choose "Always allow pop-ups from this site", then try again.' };
  if (m === 'SCOPE_MISSING') return { short: 'Calendar or Drive permission was not granted', fix: 'Disconnect, then Connect again and tick EVERY checkbox on the Google permission screen.' };
  if (m.startsWith('API_OFF:')) {
    const pid = (m.match(/project (\d+)/) || [])[1] || '';
    return {
      short: 'A Google API is switched off for this project',
      fix: 'Open these two links, press ENABLE on each, wait a minute, then sync again:',
      links: pid ? [
        `https://console.cloud.google.com/apis/library/calendar-json.googleapis.com?project=${pid}`,
        `https://console.cloud.google.com/apis/library/drive.googleapis.com?project=${pid}`
      ] : []
    };
  }
  if (/redirect_uri_mismatch|origin/i.test(m)) return { short: 'This address is not registered on your Client ID', fix: `Add ${location.origin} under "Authorised JavaScript origins", then reload.` };
  if (/access_denied/i.test(m)) return { short: 'Google refused access', fix: 'Add your own email under OAuth consent screen → Audience → Test users.' };
  return { short: m, fix: '' };
}

async function googleSync({ silent = false, fromClick = false } = {}) {
  if (gSyncing || !DB.settings.googleOn) return;

  /* A popup may only open from a real click — never from a timer. */
  if (!G.connected) {
    if (!fromClick) { gNeedsSignin = true; paintSyncBadge(); return; }
    try { await G.auth(); } catch (e) { showSyncError(e.message); return; }
  }
  gNeedsSignin = false;
  gSyncing = true; gProgress = ''; paintSyncBadge();

  const notes = [];
  let warn = [];
  try {
    if (!G.email) await G.whoami();
    await G.fetchCalendars();

    if (DB.settings.gCal !== false) {
      const r = await G.syncCalendar(p => { gProgress = p; paintSyncBadge(); });
      notes.push(`${r.pulled} event${r.pulled === 1 ? '' : 's'} in from ${r.calendars} calendar${r.calendars === 1 ? '' : 's'}`
        + (r.pushed ? `, ${r.pushed} out` : '') + (r.removed ? `, ${r.removed} removed` : ''));
      warn = r.failures || [];
    }

    /* the pull changed local data — stamp it BEFORE Drive decides who wins,
       otherwise Drive would overwrite what we just fetched */
    save();

    if (DB.settings.gDrive !== false) {
      const r = await G.syncDrive();
      notes.push(r.dir === 'down' ? 'pulled newer data from Drive' : (r.first ? 'Drive backup created' : 'saved to Drive'));
    }

    G.lastError = '';
    DB.settings.gLast = new Date().toISOString();
    save(); refresh();
    if (!silent) {
      toast('Synced — ' + notes.join(' · '), 'cloud');
      if (warn.length) setTimeout(() => toast(`${warn.length} calendar(s) could not be read`, 'bolt'), 2400);
    }
  } catch (e) {
    if (e.message === 'NEEDS_SIGNIN') gNeedsSignin = true;
    G.lastError = e.message;
    if (!silent) showSyncError(e.message);
  } finally { gSyncing = false; gProgress = ''; paintSyncBadge(); refresh(); }
}

function showSyncError(msg) {
  const ex = gExplain(msg);
  toast('Sync failed: ' + ex.short, 'x');
  if (!ex.fix) return;
  const body = h('div', {}, h('div', { text: ex.fix, style: { color: 'var(--text-2)', lineHeight: '1.7' } }));
  (ex.links || []).forEach(u => body.append(h('div', { style: { marginTop: '10px' } },
    h('a', { href: u, target: '_blank', rel: 'noopener', style: { color: 'var(--accent)', fontSize: '12.5px', wordBreak: 'break-all' }, text: u }))));
  body.append(h('div', { class: 'tiny', style: { marginTop: '14px' }, html: 'Google said:<br>' + esc(String(msg).replace(/^API_OFF:/, '')) }));
  modal({
    title: ex.short, bodyNode: body,
    footNode: h('div', { style: { display: 'flex', gap: '8px' } },
      h('button', { class: 'btn', text: 'Close', onclick: closeModal }),
      h('button', { class: 'btn primary', text: 'Try again', onclick: () => { closeModal(); googleSync({ fromClick: true }); } }))
  });
}

function paintSyncBadge() {
  const b = $('#mb-sync'); if (!b) return;
  const on = DB.settings.googleOn;
  b.style.display = on ? 'flex' : 'none';
  if (!on) return;
  b.innerHTML = icon(gSyncing ? 'reset' : 'cloud', 15) + (gSyncing && gProgress ? `<span class="tiny" style="margin-left:4px">${esc(gProgress)}</span>` : '');
  b.style.color = gSyncing ? 'var(--accent)' : (gNeedsSignin || G.lastError ? 'var(--warn)' : '');
  b.title = gSyncing ? 'Syncing… ' + gProgress
    : gNeedsSignin ? 'Signed out of Google — click to sign in again'
    : G.lastError ? 'Last sync failed — click for details'
    : (DB.settings.gLast ? 'Synced ' + new Date(DB.settings.gLast).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' — click to sync now' : 'Click to sync now');
}

async function googleConnect() {
  try {
    await G.auth();
    await G.whoami();
    DB.settings.googleOn = true;
    if (DB.settings.gCal === undefined) DB.settings.gCal = true;
    if (DB.settings.gDrive === undefined) DB.settings.gDrive = true;
    G.lastError = ''; gNeedsSignin = false;
    commit();
    toast('Connected as ' + (G.email || 'your Google account'), 'cloud');
    await googleSync({ fromClick: true });
  } catch (e) { showSyncError(e.message); }
}

function startGoogleLoop() {
  G.restore();
  if (!DB.settings.googleOn || !G.originOk || !G.clientId) { paintSyncBadge(); return; }
  if (G.connected) googleSync({ silent: true }); else gNeedsSignin = true;
  paintSyncBadge();
  setInterval(() => { if (!document.hidden && G.connected) googleSync({ silent: true }); }, 180000);
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.connected) googleSync({ silent: true }); });
}
</script>
<script>
/* ============================================================
   REGISTRY · SPOTLIGHT · BOOT
   ============================================================ */
const APPS = [AppHome, AppVision, AppCalendar, AppTasks, AppNotes, AppHabits, AppFocus,
  AppFinance, AppCourses, AppTrips,
  Object.assign({ sep: true }, AppSettings)];

/* ---------- spotlight ---------- */
let spotSel = 0, spotItems = [];
function openSpot() {
  $('#spot').classList.add('open');
  const i = $('#spot-input'); i.value = ''; i.focus();
  runSpot('');
}
function closeSpot() { $('#spot').classList.remove('open'); }
$('#spot').addEventListener('click', e => { if (e.target.dataset.close) closeSpot(); });

function runSpot(q) {
  const s = q.trim().toLowerCase();
  const res = [];
  const push = (ic, color, t, sub, act) => res.push({ ic, color, t, sub, act });

  APPS.filter(a => !s || a.name.toLowerCase().includes(s)).forEach(a =>
    push(a.icon, a.color, a.name, 'Open app', () => openApp(a.id)));

  if (s) {
    DB.tasks.filter(t => t.title.toLowerCase().includes(s)).slice(0, 6).forEach(t =>
      push('tasks', AppTasks.color, t.title, `Task${t.due ? ' · ' + relDay(t.due) : ''}${t.done ? ' · done' : ''}`, () => { openApp('tasks'); editTask(t); }));
    DB.events.filter(e => e.title.toLowerCase().includes(s)).slice(0, 6).forEach(e =>
      push('calendar', AppCalendar.color, e.title, `Event · ${fmtDate(e.date)}`, () => { openApp('calendar', { date: e.date }); editEvent(e); }));
    DB.notes.filter(n => (n.title + n.body).toLowerCase().includes(s)).slice(0, 6).forEach(n =>
      push('notes', AppNotes.color, n.title || 'Untitled', 'Note · ' + (n.body || '').replace(/\n/g, ' ').slice(0, 46), () => { openApp('notes'); const w = WINS.get('notes'); if (w) { w.state.tab = 'notes'; w.state.sel = n.id; w.rerender(); } }));
    DB.txns.filter(t => ((t.category || '') + ' ' + (t.note || '')).toLowerCase().includes(s)).slice(0, 5).forEach(t =>
      push('wallet', AppFinance.color, `${t.category} — ${money(t.amount)}`, `Transaction · ${fmtDate(t.date)}`, () => { openApp('finance'); editTxn(t); }));
    DB.trips.filter(t => (t.name + ' ' + (t.dest || '')).toLowerCase().includes(s)).slice(0, 4).forEach(t =>
      push('plane', AppTrips.color, t.name, `Trip · ${fmtDate(t.start)}`, () => openApp('trips', { id: t.id })));
    DB.habits.filter(hb => hb.name.toLowerCase().includes(s)).slice(0, 4).forEach(hb =>
      push('flame', AppHabits.color, hb.name, `Habit · ${streakOf(hb)} day streak`, () => openApp('habits')));
    (DB.vision?.pillars || []).filter(x => (x.name + ' ' + (x.why || '')).toLowerCase().includes(s)).slice(0, 4).forEach(x =>
      push('compass', AppVision.color, x.name, 'Pillar · Akedia at 25', () => openApp('vision', { id: x.id })));
    (DB.courses || []).filter(x => (x.name + ' ' + (x.provider || '') + ' ' + (x.reason || '')).toLowerCase().includes(s)).slice(0, 4).forEach(x =>
      push('cap', AppCourses.color, x.name, `Course · ${stateOf(x.status).label}`, () => openApp('courses', { id: x.id })));
    (DB.wishlist || []).filter(x => ((x.title || '') + ' ' + (x.why || '')).toLowerCase().includes(s)).slice(0, 4).forEach(x =>
      push('heart', AppFinance.color, x.title, `Wishlist · ${daysBetween(x.added, today())} days`, () => { openApp('finance'); const w = WINS.get('finance'); if (w) { w.state.tab = 'wish'; w.rerender(); } }));

    push('plus', AppTasks.color, `Add task "${q.trim()}"`, 'Create', () => { const t = quickParse(q.trim()); DB.tasks.push({ id: uid(), done: false, createdAt: today(), ...t }); commit(); toast('Task added'); });
    push('calendar', AppCalendar.color, `Add event "${q.trim()}"`, 'Create for today', () => editEvent({ title: q.trim(), date: today() }));
  }

  spotItems = res.slice(0, 12);
  spotSel = 0;
  paintSpot();
}
function paintSpot() {
  const box = $('#spot-res'); box.innerHTML = '';
  if (!spotItems.length) { box.append(h('div', { class: 'tiny', style: { padding: '16px' }, text: 'Nothing matches.' })); return; }
  spotItems.forEach((r, i) => {
    const b = h('button', { class: 'spot-item' + (i === spotSel ? ' sel' : '') });
    b.innerHTML = `<span class="ic" style="background:${r.color};color:#fff">${icon(r.ic, 15, 2)}</span>
      <span style="min-width:0"><span class="t" style="display:block">${esc(r.t)}</span><span class="s">${esc(r.sub)}</span></span>`;
    b.onmouseenter = () => { spotSel = i; paintSpot(); };
    b.onclick = () => { closeSpot(); r.act(); };
    box.append(b);
  });
}
$('#spot-input').addEventListener('input', e => runSpot(e.target.value));
$('#spot-input').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); spotSel = Math.min(spotItems.length - 1, spotSel + 1); paintSpot(); $$('.spot-item')[spotSel]?.scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); spotSel = Math.max(0, spotSel - 1); paintSpot(); $$('.spot-item')[spotSel]?.scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'Enter') { const r = spotItems[spotSel]; if (r) { closeSpot(); r.act(); } }
  else if (e.key === 'Escape') closeSpot();
});

/* ---------- global keys ---------- */
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#spot').classList.contains('open') ? closeSpot() : openSpot(); return; }
  if (e.key === 'Escape') {
    if ($('#spot').classList.contains('open')) return closeSpot();
    if ($('#modal-root').classList.contains('open')) return closeModal();
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  if (mod && e.key.toLowerCase() === 'w') { const t = topWin(); if (t) { e.preventDefault(); closeApp(t); } return; }
  if (!typing && !mod && e.key >= '1' && e.key <= '9') { const a = APPS[+e.key - 1]; if (a) openApp(a.id); }
});

/* ---------- menu bar ---------- */
function tickClock() {
  const d = new Date();
  $('#mb-clock').textContent = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  $('#mb-date').textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + '  ';
}
$('#mb-search').innerHTML = icon('search', 15);
$('#mb-search').onclick = openSpot;
$('#mb-sync').onclick = () => googleSync({ fromClick: true });
$('#mb-theme').onclick = () => { DB.settings.theme = DB.settings.theme === 'dark' ? 'light' : 'dark'; applySettings(); commit(); };
$('#mb-clockwrap').onclick = () => openApp('calendar');

/* ---------- resize guard ---------- */
window.addEventListener('resize', () => {
  WINS.forEach(w => {
    const n = w.node;
    if (n.classList.contains('maximized')) return;
    n.style.left = clamp(parseFloat(n.style.left) || 0, -parseFloat(n.style.width) + 90, window.innerWidth - 90) + 'px';
    n.style.top = clamp(parseFloat(n.style.top) || 0, 32, window.innerHeight - 44) + 'px';
  });
});
window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); Vault.save(JSON.stringify(DB)); });

/* ---------- boot ---------- */
(function boot() {
  loadDB();
  applySettings();
  buildDock();
  buildDesktopIcons();
  tickClock();
  setInterval(tickClock, 10000);
  openApp('home');
  paintSyncBadge();
  startGoogleLoop();
  setTimeout(() => {
    if (!DB.settings.sampleDismissed && sampleFound().total) {
      toast('Sample data from an older version is still here — see Home', 'bolt');
      openApp('home');
    }
  }, 900);
  if (!Vault.persistent) setTimeout(() => toast('This browser blocks local storage — export a backup before you close the tab', 'bolt'), 1200);
  console.log('%cOrbit', 'font:700 15px Lora,serif;color:#e8567f', '— personal OS ready. Ctrl/⌘+K to search.');
})();
</script>
