/* ---------- WISHLIST ----------
   Things you want but have not bought. The number that matters here is
   how long it has been sitting on the list: wanting something for six
   weeks is a different fact from wanting it for six minutes. */
const WANT = { 1: 'Passing thought', 2: 'Would be nice', 3: 'Keep thinking about it', 4: 'Really want it', 5: 'Been wanting it for ages' };

async function editWish(w) {
  const isNew = !w.id;
  const out = await formModal(isNew ? 'Something you want' : 'Edit', [
    { k: 'title', label: 'What is it?', required: true, placeholder: 'Be specific — the exact thing' },
    { type: 'row', fields: [
      { k: 'price', label: 'Roughly what it costs', type: 'number', step: '0.01' },
      { k: 'want', label: 'How much do you want it?', type: 'select', options: [1, 2, 3, 4, 5].map(n => [n, `${n} · ${WANT[n]}`]) }] },
    { k: 'why', label: 'Why do you want it?', type: 'textarea', rows: 3, required: true,
      placeholder: 'The honest reason. You will read this back before you buy.' },
    { type: 'row', fields: [
      { k: 'decideBy', label: 'Decide by', type: 'date', hint: 'Optional — a date to stop thinking about it.' },
      { k: 'link', label: 'Link', placeholder: 'Optional' }] },
  ], { want: 3, ...w }, {
    onDelete: isNew ? null : async () => { DB.wishlist = DB.wishlist.filter(x => x.id !== w.id); commit(); toast('Removed', 'trash'); }
  });
  if (!out) return;
  out.price = Number(out.price) || 0;
  out.want = Number(out.want) || 3;
  if (isNew) { DB.wishlist ||= []; DB.wishlist.push({ id: uid(), added: today(), ...out }); }
  else Object.assign(DB.wishlist.find(x => x.id === w.id), out);
  commit();
}

async function buyWish(w) {
  const cats = expenseCats();
  const out = await formModal(`Buying: ${w.title}`, [
    { type: 'row', fields: [
      { k: 'date', label: 'Date', type: 'date' },
      { k: 'amount', label: 'What you actually paid', type: 'number', step: '0.01', required: true }] },
    { k: 'source', label: 'How did you pay for it?', type: 'select', options: PAY_SOURCES.map(p => [p.v, p.v]) },
    { k: 'category', label: 'Category', type: 'select', options: cats.map(c => [c, c]) },
    { k: 'essential', label: 'How essential was it, now that you have it?', type: 'select',
      options: [['', '— not rated —'], ...[1, 2, 3, 4, 5].map(n => [n, `${n} · ${ESSENTIAL[n]}`])] },
  ], { date: today(), amount: w.price, source: PAY_SOURCES[0].v, category: cats[0], essential: '' },
     { ok: 'I bought it' });
  if (!out) return;
  const waited = daysBetween(w.added, today());
  DB.txns.push({
    id: uid(), type: 'expense', date: out.date, amount: Math.abs(Number(out.amount) || 0),
    category: out.category, source: out.source,
    reason: `${w.title} — ${w.why}`.slice(0, 400),
    essential: out.essential === '' ? null : Number(out.essential),
    waitedDays: waited,
  });
  DB.wishlist = DB.wishlist.filter(x => x.id !== w.id);
  Money.jumpTo = monthKey(out.date);
  commit();
  toast(`Bought after ${waited} day${waited === 1 ? '' : 's'} of wanting it`, 'check');
}

function wishlistTab(body, st, re) {
  DB.wishlist ||= [];
  const list = DB.wishlist.slice().sort((a, b) => (b.want || 0) - (a.want || 0) || String(a.added).localeCompare(String(b.added)));
  const total = list.reduce((a, w) => a + (Number(w.price) || 0), 0);
  const oldest = list.length ? Math.max(...list.map(w => daysBetween(w.added, today()))) : 0;

  const bar = h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '14px', flexWrap: 'wrap' } },
    h('span', { class: 'tiny', text: list.length ? `${list.length} thing${list.length === 1 ? '' : 's'} · ${money(total)} if you bought them all · oldest has waited ${oldest} day${oldest === 1 ? '' : 's'}` : '' }),
    h('div', { class: 'spacer' }),
    h('button', { class: 'btn primary sm', html: `${icon('plus', 14)} Add something`, onclick: () => editWish({}) }));
  body.append(bar);

  if (!list.length) {
    body.append(h('div', { class: 'empty', style: { minHeight: '220px' }, html:
      `<div class="big">${icon('heart', 32)}</div><div>Nothing on the list.<br>Put things here instead of in a basket, and see<br>how many of them you still want in a month.</div>` }));
    return;
  }

  const grid = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fill,minmax(290px,1fr))' } });
  list.forEach(w => {
    const waited = daysBetween(w.added, today());
    const due = w.decideBy ? daysBetween(today(), w.decideBy) : null;
    const card = h('div', { class: 'card', style: { display: 'flex', flexDirection: 'column', gap: '9px' } });
    card.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:9px">
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:700;line-height:1.3">${esc(w.title)}</div>
          <div class="tiny" style="margin-top:2px">on the list for ${waited} day${waited === 1 ? '' : 's'}${due != null ? (due >= 0 ? ` · decide within ${due}` : ' · past your decide-by date') : ''}</div>
        </div>
        ${w.price ? `<div class="mono" style="font-size:16px;font-weight:600;flex:0 0 auto">${esc(money(w.price))}</div>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <i style="width:8px;height:8px;border-radius:2px;background:${ORD[(w.want || 3) - 1]}"></i>
        <span class="tiny">${esc(WANT[w.want || 3])}</span>
      </div>
      <div class="tiny" style="color:var(--text-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(w.why || '')}</div>`;
    const acts = h('div', { style: { display: 'flex', gap: '7px', marginTop: '4px', flexWrap: 'wrap' } },
      h('button', { class: 'btn primary sm', html: `${icon('check', 13)} I bought it`, onclick: () => buyWish(w) }),
      h('button', { class: 'btn ghost sm', html: icon('edit', 13), title: 'Edit', onclick: () => editWish(w) }),
      w.link ? h('a', { class: 'btn ghost sm', href: w.link, target: '_blank', rel: 'noopener', html: icon('link', 13), title: 'Open link' }) : null,
      h('div', { class: 'spacer' }),
      h('button', { class: 'btn ghost sm danger', html: `${icon('x', 13)} Let it go`, onclick: async () => {
        if (await confirmModal('Let it go?', `"${w.title}" comes off the list. No expense is recorded.`, 'Let it go')) {
          DB.wishlist = DB.wishlist.filter(x => x.id !== w.id); commit(); toast('Off the list', 'x');
        }
      } }));
    card.append(acts);
    grid.append(card);
  });
  body.append(grid);

  const patient = DB.txns.filter(t => t.waitedDays != null);
  if (patient.length) {
    const avg = patient.reduce((a, t) => a + t.waitedDays, 0) / patient.length;
    body.append(h('div', { class: 'card', style: { marginTop: '14px' } },
      h('h3', { text: 'What waiting has done for you' }),
      h('div', { class: 'tiny', text: `${patient.length} thing${patient.length === 1 ? '' : 's'} moved from this list into a real purchase, after an average of ${Math.round(avg)} days of wanting.` })));
  }
}

/* ---------- BUDGETS ---------- */
function budgetsTab(body, st, re, d) {
  const { exp, inv } = d;
  investCard(body, inv || [], st);
  const byCat = {};
  exp.forEach(t => { const c = t.category || 'Uncategorised'; byCat[c] = (byCat[c] || 0) + t.amount; });
  const card = h('div', { class: 'card' });
  card.append(h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '10px' } },
    h('h3', { text: 'Monthly budgets', style: { margin: 0 } }), h('div', { class: 'spacer' }),
    h('button', { class: 'btn sm', html: `${icon('grid', 13)} Categories`, onclick: manageCats }),
    h('button', { class: 'btn sm', html: `${icon('plus', 13)} Budget`, onclick: async () => {
      const cats = expenseCats();
      const o = await formModal('Set a budget', [
        { k: 'category', label: 'Category', type: 'select', options: cats.map(c => [c, c]) },
        { k: 'amount', label: 'Monthly limit', type: 'number', step: '1', required: true }], {});
      if (o) { DB.budgets[o.category] = Number(o.amount); commit(); }
    } })));
  const keys = Object.keys(DB.budgets);
  if (!keys.length) card.append(h('div', { class: 'empty', style: { minHeight: '120px' }, html:
    '<div>No budgets set. Add one and you will see<br>how close you are as the month goes.</div>' }));
  keys.sort().forEach(cat => {
    const lim = DB.budgets[cat], used = byCat[cat] || 0, pct = used / Math.max(1, lim) * 100;
    const state = pct > 100 ? ['var(--crit)', 'Over budget', 'bolt'] : pct > 80 ? ['var(--warn)', 'Getting close', 'clock'] : ['var(--good)', 'On track', 'check'];
    const row = h('div', { style: { padding: '10px 0', borderBottom: '1px solid var(--border)' } });
    row.innerHTML = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <i style="width:8px;height:8px;border-radius:2px;background:${catColor(cat)}"></i>
        <strong style="font-size:13.5px">${esc(cat)}</strong>
        <span class="chip" style="border-color:transparent;background:transparent;color:${state[0]};padding-left:0">${icon(state[2], 12, 2.4)}${state[1]}</span>
        <span style="flex:1"></span>
        <span class="mono" style="font-size:13px"><strong>${esc(money(used))}</strong> <span class="tiny">of ${esc(money(lim))}</span></span></div>
      <div class="budget-bar"><i style="width:${Math.min(100, pct)}%;background:${state[0]}"></i></div>`;
    row.append(h('button', { class: 'btn ghost sm', html: icon('trash', 12), style: { marginTop: '6px' }, onclick: () => { delete DB.budgets[cat]; commit(); } }));
    card.append(row);
  });
  body.append(card);

  const un = Object.keys(byCat).filter(c => !DB.budgets[c]).sort();
  if (un.length) {
    const c2 = h('div', { class: 'card', style: { marginTop: '14px' } });
    c2.append(h('h3', { text: 'Spending with no budget' }));
    un.forEach(c => c2.append(h('div', { style: { display: 'flex', padding: '5px 0', fontSize: '13px' } },
      h('span', { text: c }), h('span', { class: 'spacer' }), h('span', { class: 'mono', text: money(byCat[c]) }))));
    body.append(c2);
  }
}

function investCard(body, inv, st) {
  const monthTotal = inv.reduce((a, t) => a + t.amount, 0);
  const allTime = DB.txns.filter(isInvest).reduce((a, t) => a + t.amount, 0);
  const byAsset = {};
  DB.txns.filter(isInvest).forEach(t => { const c = t.category || 'Other'; byAsset[c] = (byAsset[c] || 0) + t.amount; });

  const card = h('div', { class: 'card', style: { marginBottom: '14px' } });
  card.append(h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '4px' } },
    h('h3', { text: 'Investments', style: { margin: 0 } }),
    h('span', { class: 'tiny', text: 'kept out of your spending totals' }),
    h('div', { class: 'spacer' }),
    h('button', { class: 'btn primary sm', html: `${icon('plus', 13)} Investment`,
      onclick: () => editInvest({ date: st.month === monthKey(today()) ? today() : st.month + '-01' }) })));

  const tiles = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(140px,1fr))', margin: '10px 0' } });
  tiles.append(
    h('div', { class: 'stat', html: `<div class="k">This month</div><div class="v">${esc(money(monthTotal))}</div><div class="d">${inv.length} entr${inv.length === 1 ? 'y' : 'ies'}</div>` }),
    h('div', { class: 'stat', html: `<div class="k">Invested so far</div><div class="v">${esc(money(allTime))}</div><div class="d">all time</div>` }));
  Object.entries(byAsset).sort((a, b) => b[1] - a[1]).slice(0, 3).forEach(([k, v]) =>
    tiles.append(h('div', { class: 'stat', html: `<div class="k">${esc(k)}</div><div class="v">${esc(money(v))}</div><div class="d">${allTime ? Math.round(v / allTime * 100) : 0}% of the pot</div>` })));
  card.append(tiles);

  if (!inv.length) card.append(h('div', { class: 'tiny', text: 'Nothing invested this month yet.' }));
  inv.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).forEach(t => {
    const row = h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', padding: '7px 0', borderBottom: '1px solid var(--border)', fontSize: '13px' } });
    row.append(h('span', { class: 'tiny mono', text: fmtDate(t.date) }),
      h('strong', { text: t.category || 'Other' }),
      h('span', { class: 'tiny', text: (t.reason || '').slice(0, 60) }),
      h('span', { class: 'spacer' }),
      h('span', { class: 'mono', text: money(t.amount) }),
      h('button', { class: 'btn ghost sm', html: icon('edit', 12), onclick: () => editInvest(t) }),
      h('button', { class: 'btn ghost sm danger', html: icon('trash', 12), onclick: () => deleteTxns([t.id]) }));
    card.append(row);
  });
  body.append(card);
}

/* ---------- deleting, one or many ---------- */
async function deleteTxns(ids, quiet) {
  const chosen = DB.txns.filter(t => ids.includes(t.id));
  if (!chosen.length) return false;
  const sum = chosen.reduce((a, t) => a + t.amount, 0);
  const ok = quiet || await confirmModal(
    chosen.length === 1 ? 'Delete this entry?' : `Delete ${chosen.length} entries?`,
    chosen.length === 1
      ? `${money(chosen[0].amount)} · ${chosen[0].category || ''}${chosen[0].reason ? ' · ' + chosen[0].reason.slice(0, 60) : ''}`
      : `${money(sum)} in total, between ${fmtDate(chosen.map(t => t.date).sort()[0])} and ${fmtDate(chosen.map(t => t.date).sort().pop())}. This cannot be undone.`,
    'Delete');
  if (!ok) return false;
  DB.txns = DB.txns.filter(t => !ids.includes(t.id));
  commit();
  toast(`Deleted ${chosen.length} ${chosen.length === 1 ? 'entry' : 'entries'}`, 'trash');
  return true;
}

async function recategorise(ids) {
  const chosen = DB.txns.filter(t => ids.includes(t.id));
  if (!chosen.length) return;
  const anyIncome = chosen.some(isIncome);
  const cats = anyIncome && chosen.every(isIncome) ? incomeCats() : expenseCats();
  const o = await formModal(`Move ${chosen.length} ${chosen.length === 1 ? 'entry' : 'entries'} to…`,
    [{ k: 'category', label: 'Category', type: 'select', options: cats.map(c => [c, c]) }], {}, { ok: 'Move them' });
  if (!o) return;
  chosen.forEach(t => { t.category = o.category; if (isIncome(t)) t.source = o.category; });
  commit();
  toast(`Moved ${chosen.length} to ${o.category}`, 'check');
}

function manageCats() {
  const body = h('div', {});
  const list = h('div', { style: { marginBottom: '14px' } });
  const draw = () => {
    list.innerHTML = '';
    expenseCats().forEach(c => {
      const inUse = DB.txns.some(t => isExpense(t) && t.category === c);
      const row = h('div', { style: { display: 'flex', alignItems: 'center', gap: '9px', padding: '7px 0', borderBottom: '1px solid var(--border)' } });
      row.append(
        h('i', { style: { width: '10px', height: '10px', borderRadius: '3px', background: catColor(c), flex: '0 0 auto' } }),
        h('span', { text: c, style: { flex: '1', fontSize: '13px' } }),
        inUse ? h('span', { class: 'tiny', text: 'in use' }) : null,
        h('button', { class: 'btn ghost sm', html: icon('trash', 12),
          style: { opacity: inUse ? .35 : 1, pointerEvents: inUse ? 'none' : 'auto' },
          onclick: () => { DB.cats = expenseCats().filter(x => x !== c); save(); draw(); refresh(); } }));
      list.append(row);
    });
  };
  draw();
  const inp = h('input', { class: 'inp', placeholder: 'Add a category and press Enter' });
  inp.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const v = inp.value.trim(); if (!v) return;
    if (!DB.cats || !DB.cats.length) DB.cats = EXPENSE_CATS.slice();
    if (!DB.cats.includes(v)) DB.cats.push(v);
    inp.value = ''; save(); draw(); refresh();
  };
  body.append(list, inp);
  modal({ title: 'Expense categories', bodyNode: body,
    footNode: h('button', { class: 'btn primary', text: 'Done', onclick: closeModal }) });
}

function manageIncomeCats() {
  const body = h('div', {});
  const list = h('div', { style: { marginBottom: '14px' } });
  const draw = () => {
    list.innerHTML = '';
    incomeCats().forEach(c => {
      const inUse = DB.txns.some(t => isIncome(t) && incomeCatOf(t) === c);
      const row = h('div', { style: { display: 'flex', alignItems: 'center', gap: '9px', padding: '7px 0', borderBottom: '1px solid var(--border)' } });
      row.append(
        h('i', { style: { width: '10px', height: '10px', borderRadius: '3px', background: 'var(--good)', flex: '0 0 auto' } }),
        h('span', { text: c, style: { flex: '1', fontSize: '13px' } }),
        inUse ? h('span', { class: 'tiny', text: 'in use' }) : null,
        h('button', { class: 'btn ghost sm', html: icon('trash', 12),
          style: { opacity: inUse ? .35 : 1, pointerEvents: inUse ? 'none' : 'auto' },
          onclick: () => { DB.incomeCats = incomeCats().filter(x => x !== c); save(); draw(); refresh(); } }));
      list.append(row);
    });
  };
  draw();
  const inp = h('input', { class: 'inp', placeholder: 'Add an income category and press Enter' });
  inp.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const v = inp.value.trim(); if (!v) return;
    if (!DB.incomeCats) DB.incomeCats = INCOME_SOURCES.slice();
    if (!DB.incomeCats.includes(v)) DB.incomeCats.push(v);
    inp.value = ''; save(); draw(); refresh();
  };
  body.append(list, inp);
  modal({ title: 'Income categories', bodyNode: body,
    footNode: h('button', { class: 'btn primary', text: 'Done', onclick: closeModal }) });
}

/* ---------- ALL ENTRIES ---------- */
function entriesTab(body, st, re, d) {
  const { mt } = d;
  st.filter = st.filter || 'all';
  st.picked = st.picked || new Set();

  const list = mt.filter(t => st.filter === 'all' || (st.filter === 'income' ? isIncome(t) : isExpense(t)))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const visible = new Set(list.map(t => t.id));
  [...st.picked].forEach(id => { if (!visible.has(id)) st.picked.delete(id); });

  const bar = h('div', { style: { display: 'flex', gap: '8px', marginBottom: '10px', alignItems: 'center', flexWrap: 'wrap' } });
  const fseg = h('div', { class: 'seg' });
  [['all', 'All'], ['expense', 'Expenses'], ['income', 'Income']].forEach(([k, l]) =>
    fseg.append(h('button', { class: st.filter === k ? 'on' : '', text: l, onclick: () => { st.filter = k; st.picked.clear(); re(); } })));
  bar.append(fseg, h('span', { class: 'tiny', text: `${list.length} in ${monthLabel(st.month)}` }), h('div', { class: 'spacer' }),
    h('button', { class: 'btn sm', html: `${icon('upload', 13)} Export CSV`, onclick: exportCSV }));
  body.append(bar);

  /* the bulk bar only exists while something is ticked */
  if (st.picked.size) {
    const ids = [...st.picked];
    const sum = DB.txns.filter(t => st.picked.has(t.id)).reduce((a, t) => a + t.amount, 0);
    const sel = h('div', { class: 'card', style: {
      marginBottom: '10px', padding: '10px 14px', display: 'flex', alignItems: 'center', gap: '10px',
      flexWrap: 'wrap', background: 'var(--accent-soft)', borderColor: 'var(--accent)' } });
    sel.append(
      h('strong', { style: { fontSize: '13.5px' }, text: `${st.picked.size} selected` }),
      h('span', { class: 'tiny mono', text: money(sum) }),
      h('div', { class: 'spacer' }),
      h('button', { class: 'btn sm', html: `${icon('grid', 13)} Change category`, onclick: () => recategorise(ids) }),
      h('button', { class: 'btn sm', text: 'Clear', onclick: () => { st.picked.clear(); re(); } }),
      h('button', { class: 'btn primary sm', style: { background: 'var(--crit)' }, html: `${icon('trash', 13)} Delete ${st.picked.size}`,
        onclick: async () => { if (await deleteTxns(ids)) st.picked.clear(); } }));
    body.append(sel);
  }

  const card = h('div', { class: 'card pad0' });
  const tbl = h('table', { class: 'tbl' });
  const thead = h('thead');
  const hr = h('tr');
  const allTicked = list.length && list.every(t => st.picked.has(t.id));
  const master = h('input', { type: 'checkbox', style: { accentColor: 'var(--accent-fill)', cursor: 'pointer' }, title: 'Select everything shown' });
  master.checked = !!allTicked;
  master.onchange = () => { if (master.checked) list.forEach(t => st.picked.add(t.id)); else st.picked.clear(); re(); };
  hr.append(h('th', { style: { width: '34px' } }, master));
  ['Date', 'Category', 'Paid from', 'Reason', 'Essential'].forEach(x => hr.append(h('th', { text: x })));
  hr.append(h('th', { class: 'num', text: 'Amount' }), h('th', { style: { width: '62px' } }));
  thead.append(hr); tbl.append(thead);

  const tb = h('tbody');
  list.forEach(t => {
    const income = isIncome(t);
    const p = payOf(t.source);
    const on = st.picked.has(t.id);
    const tr = h('tr', { style: on ? { background: 'var(--accent-soft)' } : {} });

    const cbTd = h('td');
    const cb = h('input', { type: 'checkbox', style: { accentColor: 'var(--accent-fill)', cursor: 'pointer' } });
    cb.checked = on;
    cb.onchange = () => { cb.checked ? st.picked.add(t.id) : st.picked.delete(t.id); re(); };
    cbTd.append(cb);
    tr.append(cbTd);

    const cells = h('template');
    cells.innerHTML = `<td class="mono tiny" style="color:var(--text-2)">${esc(fmtDate(t.date, { month: 'short', day: 'numeric' }))}</td>
      <td><span class="chip"><i class="dot" style="background:${income ? 'var(--good)' : catColor(t.category)}"></i>${esc((income ? incomeCatOf(t) : t.category) || '—')}</span></td>
      <td class="tiny" style="${!income && !p.ok ? 'color:var(--crit);font-weight:600' : ''}">${income ? '—' : esc(p.short)}</td>
      <td class="tiny" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t.reason || t.note || '')}">${esc(t.reason || t.note || '')}</td>
      <td class="tiny mono">${!income && t.essential ? `<i style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${ORD[t.essential - 1]};margin-right:5px"></i>${t.essential}/5` : ''}</td>
      <td class="num" style="font-weight:600;color:${income ? 'var(--good)' : 'var(--text)'}">${income ? '+' : ''}${esc(money(t.amount))}</td>`;
    tr.append(...cells.content.childNodes);

    const td = h('td', { style: { whiteSpace: 'nowrap' } });
    td.append(
      h('button', { class: 'btn ghost sm', html: icon('edit', 13), title: 'Edit', onclick: () => editTxn(t) }),
      h('button', { class: 'btn ghost sm danger', html: icon('trash', 13), title: 'Delete', onclick: () => deleteTxns([t.id]) }));
    tr.append(td);
    tb.append(tr);
  });
  if (!list.length) tb.innerHTML = '<tr><td colspan="8" style="padding:34px;text-align:center;color:var(--muted)">Nothing recorded this month.</td></tr>';
  tbl.append(tb); card.append(tbl);
  body.append(card);

  if (list.length) body.append(h('div', { class: 'tiny', style: { marginTop: '10px' },
    text: 'Tick the boxes to delete or recategorise several at once. The box in the header selects everything shown.' }));
}

/* kept so older callers (Spotlight) still work */
const editTxn = t => !t ? editExpense(t) : isIncome(t) ? editIncome(t) : isInvest(t) ? editInvest(t) : editExpense(t);
</script>
<script>
/* ============================================================
   TRIPS
   ============================================================ */
const TRIP_COLORS = [1, 3, 7, 2, 5, 4].map(i => `var(--s${i})`);

async function editTrip(t) {
  const isNew = !t.id;
  const out = await formModal(isNew ? 'New trip' : 'Edit trip', [
    { k: 'name', label: 'Trip', required: true, placeholder: 'e.g. Lisbon' },
    { k: 'dest', label: 'Destination', placeholder: 'City, country' },
    { type: 'row', fields: [{ k: 'start', label: 'Leaves', type: 'date' }, { k: 'end', label: 'Returns', type: 'date' }] },
    { type: 'row', fields: [
      { k: 'budget', label: 'Budget', type: 'number', step: '1' },
      { k: 'color', label: 'Colour', type: 'color' }] },
    { k: 'notes', label: 'Notes', type: 'textarea', rows: 3 },
  ], { start: today(), end: addDays(today(), 5), color: TRIP_COLORS[0], ...t }, {
    onDelete: isNew ? null : async () => {
      if (await confirmModal('Delete trip?', `"${t.name}" and its checklist will be removed.`)) { DB.trips = DB.trips.filter(x => x.id !== t.id); commit(); }
    }
  });
  if (!out) return;
  out.budget = Number(out.budget) || 0;
  if (isNew) DB.trips.push({ id: uid(), checklist: [], bookings: [], ...out });
  else Object.assign(DB.trips.find(x => x.id === t.id), out);
  commit();
}

const AppTrips = {
  id: 'trips', name: 'Trips', icon: 'plane', color: '#4a6fa5', w: 900, h: 640,
  onArg(arg, re) { if (arg && arg.id) this._sel = arg.id; re && re(); },
  render(root, re, st) {
    if (this._sel) { st.sel = this._sel; this._sel = null; }
    const app = h('div', { class: 'app' });
    const trip = DB.trips.find(t => t.id === st.sel);

    const head = h('div', { class: 'app-head' });
    if (trip) head.append(h('button', { class: 'btn ghost sm', html: icon('left', 15), onclick: () => { st.sel = null; re(); }, title: 'All trips' }));
    head.append(h('h2', { text: trip ? trip.name : 'Trips' }), h('div', { class: 'spacer' }));
    if (trip) head.append(h('button', { class: 'btn sm', html: `${icon('edit', 14)} Edit`, onclick: () => editTrip(trip) }));
    head.append(h('button', { class: 'btn primary sm', html: `${icon('plus', 14)} Trip`, onclick: () => editTrip({}) }));
    app.append(head);

    const body = h('div', { class: 'app-body' });

    if (!trip) {
      if (!DB.trips.length) body.append(h('div', { class: 'empty', html: `<div class="big">${icon('plane', 34)}</div><div>No trips planned yet.<br>Add one and the countdown starts.</div>` }));
      const grid = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fill,minmax(258px,1fr))' } });
      DB.trips.slice().sort((a, b) => String(a.start).localeCompare(String(b.start))).forEach(t => {
        const days = daysBetween(today(), t.start);
        const done = (t.checklist || []).filter(c => c.done).length, all = (t.checklist || []).length;
        const spent = (t.bookings || []).reduce((a, b) => a + (Number(b.cost) || 0), 0);
        const card = h('div', { class: 'trip-card', onclick: () => { st.sel = t.id; re(); } });
        card.innerHTML = `
          <div class="trip-hero" style="background:linear-gradient(135deg,${t.color},color-mix(in srgb, ${t.color} 55%, #000))">
            <span class="cd">${days > 0 ? `in ${days} day${days === 1 ? '' : 's'}` : days === 0 ? 'today' : (daysBetween(today(), t.end) >= 0 ? 'happening now' : 'past')}</span>
            <h4>${esc(t.name)}</h4></div>
          <div style="padding:12px 14px">
            <div class="tiny">${esc(t.dest || '')}</div>
            <div style="font-size:12.5px;margin:6px 0">${esc(fmtDate(t.start))} → ${esc(fmtDate(t.end))} · ${Math.max(1, daysBetween(t.start, t.end))} nights</div>
            <div class="prog"><i style="width:${all ? done / all * 100 : 0}%;background:${t.color}"></i></div>
            <div style="display:flex;margin-top:6px"><span class="tiny">${done}/${all} packed & booked</span><span style="flex:1"></span><span class="tiny mono">${esc(money(spent))}${t.budget ? ' / ' + esc(money(t.budget)) : ''}</span></div>
          </div>`;
        grid.append(card);
      });
      body.append(grid);
      app.append(body); root.append(app); return;
    }

    /* --- trip detail --- */
    const days = daysBetween(today(), trip.start);
    const nights = Math.max(1, daysBetween(trip.start, trip.end));
    const spent = (trip.bookings || []).reduce((a, b) => a + (Number(b.cost) || 0), 0);
    const tiles = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' } });
    [['Countdown', days > 0 ? `${days}d` : (daysBetween(today(), trip.end) >= 0 ? 'Now' : 'Done'), days > 0 ? `leaves ${fmtDate(trip.start)}` : `${fmtDate(trip.start)} → ${fmtDate(trip.end)}`],
     ['Length', `${nights}`, nights === 1 ? 'night' : 'nights'],
     ['Booked', money(spent), trip.budget ? `of ${money(trip.budget)} budget` : 'no budget set'],
     ['Left to plan', `${(trip.checklist || []).filter(c => !c.done).length}`, 'open items']
    ].forEach(([k, v, d]) => tiles.append(h('div', { class: 'stat', html: `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div>` })));
    body.append(tiles);

    if (trip.budget) {
      const pct = Math.min(100, spent / trip.budget * 100);
      const over = spent > trip.budget;
      const bcard = h('div', { class: 'card', style: { marginTop: '14px' } });
      bcard.innerHTML = `<h3>Budget</h3>
        <div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:20px;font-weight:600" class="mono">${esc(money(spent))}</span>
        <span class="tiny">committed of ${esc(money(trip.budget))}</span><span style="flex:1"></span>
        <span class="chip" style="color:${over ? 'var(--crit)' : 'var(--good)'};background:transparent;border-color:transparent">
          ${icon(over ? 'bolt' : 'check', 12, 2.4)}${over ? 'Over budget' : money(trip.budget - spent) + ' left'}</span></div>
        <div class="budget-bar" style="height:10px"><i style="width:${pct}%;background:${over ? 'var(--crit)' : trip.color}"></i></div>`;
      body.append(bcard);
    }

    const cols = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(290px,1fr))', marginTop: '14px' } });

    /* checklist */
    const ck = h('div', { class: 'card' });
    ck.append(h('h3', { text: 'Checklist' }));
    (trip.checklist || []).forEach(c => {
      const row = h('div', { class: 'ck' + (c.done ? ' on' : '') });
      const cb = h('button', { class: 'cbox' + (c.done ? ' on' : ''), html: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg>`, onclick: () => { c.done = !c.done; commit(); } });
      row.append(cb, h('span', { class: 'cktext', text: c.text, style: { flex: '1', fontSize: '13px' } }),
        h('button', { class: 'btn ghost sm', html: icon('x', 12), onclick: () => { trip.checklist = trip.checklist.filter(x => x.id !== c.id); commit(); } }));
      ck.append(row);
    });
    const ci = h('input', { class: 'inp', placeholder: 'Add an item…', style: { marginTop: '8px' } });
    ci.onkeydown = e => { if (e.key === 'Enter' && ci.value.trim()) { (trip.checklist ||= []).push({ id: uid(), text: ci.value.trim(), done: false }); ci.value = ''; commit(); } };
    ck.append(ci);
    cols.append(ck);

    /* bookings */
    const bk = h('div', { class: 'card' });
    const bh = h('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '10px' } },
      h('h3', { text: 'Bookings', style: { margin: 0 } }), h('div', { class: 'spacer' }),
      h('button', { class: 'btn sm', html: icon('plus', 13), onclick: async () => {
        const o = await formModal('Add booking', [
          { k: 'type', label: 'Type', type: 'select', options: ['Flight', 'Train', 'Stay', 'Car', 'Tour', 'Other'].map(x => [x, x]) },
          { k: 'title', label: 'Detail', required: true, placeholder: 'e.g. Outbound 06:40' },
          { type: 'row', fields: [{ k: 'date', label: 'Date', type: 'date' }, { k: 'cost', label: 'Cost', type: 'number', step: '1' }] },
          { k: 'ref', label: 'Reference', placeholder: 'Booking code' }], { date: trip.start });
        if (o) { (trip.bookings ||= []).push({ id: uid(), ...o, cost: Number(o.cost) || 0 }); commit(); }
      } }));
    bk.append(bh);
    if (!(trip.bookings || []).length) bk.append(h('div', { class: 'tiny', text: 'Nothing booked yet.' }));
    (trip.bookings || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).forEach(b => {
      const row = h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', padding: '7px 0', borderBottom: '1px solid var(--border)' } });
      row.innerHTML = `<span class="chip">${esc(b.type)}</span>
        <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.title)}</div>
        <div class="tiny">${esc(fmtDate(b.date))}${b.ref ? ' · ' + esc(b.ref) : ''}</div></div>
        <span class="mono" style="font-size:13px;font-weight:600">${esc(money(b.cost || 0))}</span>`;
      row.append(h('button', { class: 'btn ghost sm', html: icon('trash', 12), onclick: () => { trip.bookings = trip.bookings.filter(x => x.id !== b.id); commit(); } }));
      bk.append(row);
    });
    cols.append(bk);
    body.append(cols);

    /* notes */
    const nc = h('div', { class: 'card', style: { marginTop: '14px' } });
    nc.append(h('h3', { text: 'Notes' }));
    const ta = h('textarea', { class: 'inp', rows: 4, placeholder: 'Ideas, addresses, things not to forget…' });
    ta.value = trip.notes || '';
    ta.oninput = () => { trip.notes = ta.value; save(); };
    nc.append(ta);
    body.append(nc);

    app.append(body); root.append(app);
  }
};
</script>
<script>
/* ============================================================
   AKEDIA AT 25 — the long view

   A motto, the person you are becoming written down, the traits you
   want to be known for, and the pillars you are actually putting hours
   into. Progress is logged by hand, on purpose: the point is to notice
   you did the work, not to have a timer notice for you.
   ============================================================ */

const PILLAR_COLORS = [1, 3, 7, 2, 5, 4, 6, 8].map(i => `var(--s${i})`);

function vision() {
  if (!DB.vision) DB.vision = { motto: '', statement: '', birthday: '', traits: [], pillars: [] };
  const v = DB.vision;
  v.traits ||= []; v.pillars ||= [];
  return v;
}

/* days until the 25th birthday, if a birthday is set */
function turns25() {
  const v = vision();
  if (!v.birthday) return null;
  const b = fromYmd(v.birthday);
  const target = new Date(b.getFullYear() + 25, b.getMonth(), b.getDate());
  const days = daysBetween(today(), ymd(target));
  const age = (new Date() - b) / (365.2425 * DAY);
  return { date: ymd(target), days, age };
}

const pillarLogged = p => (p.log || []).reduce((a, x) => a + (Number(x.amount) || 0), 0);
const pillarUnit = p => p.goalType === 'hours' ? 'h' : (p.unit || '');

/* how fast you are actually moving, from the last 60 days of entries */
function pillarPace(p) {
  const since = addDays(today(), -60);
  const recent = (p.log || []).filter(x => x.date >= since);
  if (recent.length < 2 || !p.target) return null;
  const total = recent.reduce((a, x) => a + (Number(x.amount) || 0), 0);
  const perWeek = total / (60 / 7);
  if (perWeek <= 0) return null;
  const left = Math.max(0, p.target - pillarLogged(p));
  const weeks = left / perWeek;
  const eta = addDays(today(), Math.round(weeks * 7));
  return { perWeek, weeks, eta };
}

async function editVisionMeta() {
  const v = vision();
  const out = await formModal('The long view', [
    { k: 'motto', label: 'Your motto', placeholder: 'The line you want to live by' },
    { k: 'birthday', label: 'Your date of birth', type: 'date', hint: 'Used only for the countdown to 25.' },
    { k: 'statement', label: 'Who is Akedia at 25?', type: 'textarea', rows: 6,
      placeholder: 'Write it in the present tense, as if you already are that person.' },
  ], { motto: v.motto, birthday: v.birthday, statement: v.statement });
  if (!out) return;
  Object.assign(v, out); commit();
}

async function editPillar(p) {
  const v = vision();
  const isNew = !p.id;
  const out = await formModal(isNew ? 'New pillar' : 'Edit pillar', [
    { k: 'name', label: 'Pillar', required: true, placeholder: 'e.g. Personal brand, English, Strength' },
    { k: 'why', label: 'Why this matters', type: 'textarea', rows: 3, placeholder: 'What does the 25-year-old you have because of this?' },
    { k: 'goalType', label: 'Kind of goal', type: 'select', options: [
      ['hours', 'Hours of practice — the 10,000-hour kind'],
      ['number', 'A number to reach — weight, savings, followers…'],
      ['none', 'No number, just milestones']] },
    { type: 'row', fields: [
      { k: 'target', label: 'Target', type: 'number', step: 'any', placeholder: '10000' },
      { k: 'unit', label: 'Unit', placeholder: 'kg, €, books…', hint: 'Ignored for hour goals.' }] },
    { k: 'color', label: 'Colour', type: 'color' },
    { k: 'priority', label: 'Priority', type: 'select', options: [['normal','Normal'],['high','High'],['one','The One Thing']] },
  ], { goalType: 'hours', target: 10000, color: PILLAR_COLORS[v.pillars.length % PILLAR_COLORS.length], startDate: p.startDate||ORBIT_DEFAULT_DATE, endDate: p.endDate||ORBIT_DEFAULT_DATE, pinned: !!p.pinned, ...p }, {
    onDelete: isNew ? null : async () => {
      if (await confirmModal('Delete pillar?', `"${p.name}", its milestones and every hour you logged against it will be removed.`)) {
        v.pillars = v.pillars.filter(x => x.id !== p.id); commit();
      }
    }
  });
  if (!out) return;
  out.target = out.goalType === 'none' ? 0 : (Number(out.target) || 0);
  if (isNew) v.pillars.push({ id: uid(), log: [], milestones: [], notes: '', pinned: false, ...out });
  else Object.assign(v.pillars.find(x => x.id === p.id), out);
  commit();
}

async function editMilestone(p, m) {
  const isNew = !m || !m.id;
  const out = await formModal(isNew ? 'New milestone' : 'Edit milestone', [
    { k: 'text', label: 'What counts as reached?', required: true, placeholder: 'Something you could show someone' },
    { k: 'date', label: 'By when', type: 'date' },
  ], { text: '', date: ORBIT_DEFAULT_DATE, ...(m || {}) }, {
    ok: isNew ? 'Add milestone' : 'Save changes',
    onDelete: isNew ? null : async () => {
      if (await confirmModal('Delete milestone?', `"${m.text}" will be removed.`, 'Delete')) {
        p.milestones = (p.milestones || []).filter(x => x.id !== m.id);
        commit();
      }
    }
  });
  if (!out) return;
  if (isNew) (p.milestones ||= []).push({ id: uid(), text: out.text, date: out.date || '', done: false });
  else Object.assign(p.milestones.find(x => x.id === m.id), { text: out.text, date: out.date || '' });
  commit();
}

async function editPillarLog(p, entry) {
  const isNew = !entry || !entry.id;
  const isHours = p.goalType === 'hours';
  const out = await formModal(isNew ? `Log progress · ${p.name}` : 'Edit progress entry', [
    { type: 'row', fields: [
      { k: 'date', label: 'Date', type: 'date' },
      { k: 'amount', label: isHours ? 'Hours' : `Amount${p.unit ? ' (' + p.unit + ')' : ''}`, type: 'number', step: 'any', required: true }] },
    { k: 'note', label: 'What did you actually do?', type: 'textarea', rows: 3, placeholder: 'Optional, but useful later' },
  ], { date: ORBIT_DEFAULT_DATE, amount: '', note: '', ...(entry || {}) }, {
    ok: isNew ? 'Log it' : 'Save changes',
    onDelete: isNew ? null : async () => {
      if (await confirmModal('Delete progress entry?', 'This removes the logged progress, not the pillar itself.', 'Delete')) {
        p.log = (p.log || []).filter(x => x.id !== entry.id);
        commit();
      }
    }
  });
  if (!out) return;
  const data = { date: out.date, amount: Number(out.amount) || 0, note: out.note || '' };
  if (isNew) (p.log ||= []).push({ id: uid(), ...data });
  else Object.assign(p.log.find(x => x.id === entry.id), data);
  commit();
  toast(isNew ? `+${out.amount}${isHours ? 'h' : ''} · ${p.name}` : 'Progress entry updated', 'check');
}

async function editVisionTrait(v, tr) {
  const isNew = !tr || !tr.id;
  const out = await formModal(isNew ? 'New trait' : 'Edit trait', [
    { k: 'text', label: 'Trait', required: true, placeholder: 'e.g. disciplined, curious, decisive' }
  ], { text: '', ...(tr || {}) }, {
    ok: isNew ? 'Add trait' : 'Save changes',
    onDelete: isNew ? null : async () => {
      if (await confirmModal('Delete trait?', `"${tr.text}" will be removed.`, 'Delete')) {
        v.traits = (v.traits || []).filter(x => x.id !== tr.id);
        commit();
      }
    }
  });
  if (!out) return;
  if (isNew) (v.traits ||= []).push({ id: uid(), text: out.text });
  else Object.assign(v.traits.find(x => x.id === tr.id), { text: out.text });
  commit();
}

async function logPillar(p) {
  const isHours = p.goalType === 'hours';
  const out = await formModal(`Log progress · ${p.name}`, [
    { type: 'row', fields: [
      { k: 'date', label: 'Date', type: 'date' },
      { k: 'amount', label: isHours ? 'Hours' : `Amount${p.unit ? ' (' + p.unit + ')' : ''}`, type: 'number', step: 'any', required: true }] },
    { k: 'note', label: 'What did you actually do?', placeholder: 'Optional, but it is the part you reread later' },
  ], { date: today() }, { ok: 'Log it' });
  if (!out) return;
  (p.log ||= []).push({ id: uid(), date: out.date, amount: Number(out.amount) || 0, note: out.note || '' });
  commit();
  toast(`+${out.amount}${isHours ? 'h' : ''} · ${p.name}`, 'check');
}

const AppVision = {
  id: 'vision', name: 'Akedia 25', icon: 'compass', color: '#8b5fbf', w: 1000, h: 700,
  onArg(arg, re) { if (arg && arg.id) this._sel = arg.id; re && re(); },
  render(root, re, st) {
    if (this._sel) { st.sel = this._sel; this._sel = null; }
    const v = vision();
    const p = v.pillars.find(x => x.id === st.sel);
    const app = h('div', { class: 'app' });

    const head = h('div', { class: 'app-head' });
    if (p) head.append(h('button', { class: 'btn ghost sm', html: icon('left', 15), onclick: () => { st.sel = null; re(); }, title: 'Back' }));
    head.append(h('h2', { text: p ? p.name : (DB.settings.osName === 'Orbit' ? 'Akedia at 25' : 'The long view') }), h('div', { class: 'spacer' }));
    if (p) head.append(h('button', { class: 'btn sm', html: `${icon('edit', 14)} Edit`, onclick: () => editPillar(p) }),
      h('button', { class: 'btn primary sm', html: `${icon('plus', 14)} Log progress`, onclick: () => logPillar(p) }));
    else head.append(h('button', { class: 'btn sm', html: `${icon('edit', 14)} Motto & vision`, onclick: editVisionMeta }),
      h('button', { class: 'btn primary sm', html: `${icon('plus', 14)} Pillar`, onclick: () => editPillar({}) }));
    app.append(head);

    const body = h('div', { class: 'app-body' });
    p ? pillarDetail(body, p, re, st) : visionOverview(body, v, re, st);
    app.append(body); root.append(app);
  }
};

/* a ring, because a number climbing round a circle feels different
   from a number sitting in a box */
function ring(pct, color, label, size = 62) {
  const r = size / 2 - 5, C = 2 * Math.PI * r;
  const w = h('div', { class: 'ring', style: { width: size + 'px', height: size + 'px' } });
  w.innerHTML = `<svg width="${size}" height="${size}">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="5"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.min(1, pct / 100))}"
      style="transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.3,1)"/>
  </svg><div class="pct">${esc(label)}</div>`;
  return w;
}

function visionOverview(body, v, re, st) {
  const t25 = turns25();
  const totalHours = v.pillars.filter(p => p.goalType === 'hours').reduce((a, p) => a + pillarLogged(p), 0);

  /* ---- the hero ---- */
  const hero = h('div', { class: 'vision-hero' });
  const motto = h('div', { class: 'vision-motto', title: 'Click to edit', style: { cursor: 'pointer' }, onclick: editVisionMeta, text: v.motto ? '\u201c' + v.motto + '\u201d' : 'Write the line you want to live by.' });
  hero.append(motto);

  if (t25) {
    const nums = h('div', { class: 'vision-nums' });
    [[t25.days > 0 ? t25.days.toLocaleString('en-US') : '0', 'days until 25', true],
     [Math.max(0, Math.round(t25.days / 7)).toLocaleString('en-US'), 'weeks left', false],
     [t25.age.toFixed(1), 'years old today', false],
     [Math.round(totalHours).toLocaleString('en-US'), 'hours logged so far', false],
    ].forEach(([n, l, big]) => nums.append(h('div', {},
      h('div', { class: 'vision-num' + (big ? ' big' : '') , text: n }),
      h('div', { class: 'tiny', style: { marginTop: '4px' }, text: l }))));
    hero.append(nums);
  } else {
    hero.append(h('button', { class: 'btn sm', style: { marginTop: '16px' },
      html: `${icon('calendar', 13)} Add your birthday to start the countdown`, onclick: editVisionMeta }));
  }
  if (v.statement) {
    const statement = h('div', { class: 'vision-editable', title: 'Click to edit your vision', style: { cursor: 'pointer' }, onclick: editVisionMeta });
    statement.append(h('div', { style: { display: 'flex', alignItems: 'center', gap: '7px', marginBottom: '6px', color: 'var(--muted)', fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.08em' } }, icon('edit', 11), h('span', { text: 'Click to edit vision' })));
    statement.append(h('div', { style: { whiteSpace: 'pre-wrap', lineHeight: '1.8', fontSize: '14.5px' }, text: v.statement }));
    hero.append(h('hr', { class: 'hr' }), statement);
  }
  body.append(hero);

  /* ---- one square per week, birth to 25 ---- */
  if (t25) {
    const born = fromYmd(v.birthday);
    const lived = Math.max(0, Math.floor((new Date() - born) / (7 * DAY)));
    const total = 25 * 52;
    const card = h('div', { class: 'card', style: { marginTop: '14px' } });
    card.append(h('h3', { text: 'Every week you get before 25' }));
    const grid = h('div', { class: 'wk-grid' });
    for (let i = 0; i < total; i++) {
      const isNow = i === lived;
      const cell = h('div', { class: 'wk' + (i < lived ? ' lived' : '') + (isNow ? ' now' : '') });
      if (i < lived) cell.style.opacity = (0.35 + 0.65 * (i / Math.max(1, lived))).toFixed(2);
      const d = new Date(born.getTime() + i * 7 * DAY);
      cell.title = `Week ${i + 1} · age ${(i / 52).toFixed(1)} · ${d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}`;
      grid.append(cell);
    }
    card.append(grid);
    const left = Math.max(0, total - lived);
    card.append(h('div', { class: 'wk-legend' },
      h('span', { class: 'tiny', html: `<i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--plum);margin-right:6px"></i>${lived.toLocaleString('en-US')} lived` }),
      h('span', { class: 'tiny', html: `<i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--accent);margin-right:6px"></i>this week` }),
      h('span', { class: 'tiny', html: `<i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--surface-3);margin-right:6px"></i>${left.toLocaleString('en-US')} left` })));
    body.append(card);
  }

  /* ---- traits ---- */
  const tc = h('div', { class: 'card glass', style: { marginTop: '14px' } });
  tc.append(h('h3', { text: 'The traits he is known for' }));
  const chips = h('div', { style: { display: 'flex', gap: '9px', flexWrap: 'wrap' } });
  if (!v.traits.length) chips.append(h('div', { class: 'tiny', text: 'The handful of words you want people to use about you.' }));
  v.traits.forEach(tr => {
    const dir=orbitDirection(tr.text);
    const c = h('button', { class: 'trait'+(dir==='rtl'?' persian-text':''), title: 'Click to edit', dir });
    c.innerHTML = `<i style="width:6px;height:6px;border-radius:99px;background:var(--plum)"></i><span>${esc(tr.text)}</span> <span style="opacity:.55;margin-left:4px">${icon('edit', 10)}</span>`;
    c.onclick = () => editVisionTrait(v, tr);
    chips.append(c);
  });
  const ti = h('input', { class: 'inp', placeholder: 'Add a trait and press Enter', style: { marginTop: '12px' } });
  ti.onkeydown = e => { if (e.key === 'Enter' && ti.value.trim()) { v.traits.push({ id: uid(), text: ti.value.trim() }); ti.value = ''; commit(); } };
  tc.append(chips, ti);
  body.append(tc);

  /* ---- the pillars ---- */
  body.append(h('h3', { text: `Pillars${v.pillars.length ? ' · ' + v.pillars.length : ''}`, style: { margin: '22px 0 10px', fontSize: '13px' } }));
  if (!v.pillars.length) {
    body.append(h('div', { class: 'empty', style: { minHeight: '160px' }, html:
      `<div class="big">${icon('compass', 32)}</div><div>A pillar is one thing you are willing to<br>put a decade into. Add the first.</div>` }));
    return;
  }
  const grid = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))' } });
  v.pillars.slice().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||String(a.name||'').localeCompare(String(b.name||''))).forEach(p => {
    const done = pillarLogged(p);
    const pct = p.target ? Math.min(100, done / p.target * 100) : 0;
    const ms = p.milestones || [];
    const nextMs = ms.filter(m => !m.done).sort((a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999')))[0];
    const card = h('div', { class: 'pillar-card', style: { '--pc': p.color }, onclick: () => { st.sel = p.id; re(); } });
    card.style.setProperty('--pc', p.color);
    const top = h('div', { style: { display: 'flex', alignItems: 'center', gap: '14px' } });
    top.append(
      ring(p.goalType === 'none' ? (ms.length ? ms.filter(m => m.done).length / ms.length * 100 : 0) : pct, p.color,
        p.goalType === 'none' ? `${ms.filter(m => m.done).length}/${ms.length}` : (pct > 0 && pct < 1 ? pct.toFixed(1) : Math.round(pct)) + '%'),
      h('div', { style: { minWidth: 0, flex: '1' } },
        h('div', { style: { fontSize: '15px', fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }, text: p.name }),
        h('div', { class: 'tiny mono', style: { marginTop: '3px' }, text: p.goalType === 'none' ? `${ms.length} milestones` : `${done.toLocaleString('en-US', { maximumFractionDigits: 1 })} of ${(p.target || 0).toLocaleString('en-US')} ${pillarUnit(p)}` })
      ),
      h('button',{class:'pillar-pin-btn '+(p.pinned?'on':''),title:p.pinned?'Unpin pillar':'Pin pillar',text:p.pinned?'📌':'📍',onclick:e=>{e.stopPropagation();p.pinned=!p.pinned;save();re();}})
    );
    card.append(top);
    card.append(h('div', { class: 'tiny', style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' },
      text: nextMs ? 'Next: ' + nextMs.text : (p.why ? p.why.split('\n')[0] : ' ') }));
    grid.append(card);
  });
  body.append(grid);
}

function pillarDetail(body, p, re, st) {
  const done = pillarLogged(p);
  const pct = p.target ? Math.min(100, done / p.target * 100) : 0;
  const pace = pillarPace(p);

  const tiles = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' } });
  const stats = [];
  if (p.goalType !== 'none') {
    stats.push(['Logged', done.toLocaleString('en-US', { maximumFractionDigits: 1 }) + (unit ? ' ' + unit : ''), `of ${(p.target || 0).toLocaleString('en-US')}`]);
    stats.push(['Left', Math.max(0, (p.target || 0) - done).toLocaleString('en-US', { maximumFractionDigits: 1 }) + (unit ? ' ' + unit : ''), `${pct > 0 && pct < 1 ? pct.toFixed(1) : Math.round(pct)}% done`]);
  }
  stats.push(['Milestones', `${(p.milestones || []).filter(m => m.done).length}/${(p.milestones || []).length}`, 'reached']);
  stats.push(['Pace', pace ? pace.perWeek.toFixed(1) + (unit ? ' ' + unit : '') : '—', pace ? 'per week, last 60 days' : 'log a few entries first']);
  stats.forEach(([k, v2, d]) => tiles.append(h('div', { class: 'stat', html: `<div class="k">${esc(k)}</div><div class="v">${esc(v2)}</div><div class="d">${esc(d)}</div>` })));
  body.append(tiles);

  if (p.goalType !== 'none' && p.target) {
    const bar = h('div', { class: 'card', style: { marginTop: '14px' } });
    bar.innerHTML = `<div class="budget-bar" style="height:12px"><i style="width:${pct}%;background:${p.color}"></i></div>`;
    if (pace) bar.append(h('div', { class: 'tiny', style: { marginTop: '9px' },
      text: pace.weeks > 520
        ? `At this pace it is more than ten years away. Either the target is the wrong size, or the week is.`
        : `Keep this pace and you get there around ${fmtDate(pace.eta, { month: 'long', year: 'numeric' })} — about ${Math.round(pace.weeks)} weeks.` }));
    body.append(bar);
  }

  if (p.why) {
    const w = h('div', { class: 'card', style: { marginTop: '14px' } });
    w.append(h('h3', { text: 'Why this matters' }), h('div', { style: { whiteSpace: 'pre-wrap', lineHeight: '1.75', color: 'var(--text-2)' }, text: p.why }));
    body.append(w);
  }
  ensureGoalModel(); const linkedGoals=DB.goals.filter(g=>g.pillarId===p.id).sort(goalSort); const lg=h('div',{class:'card',style:{marginTop:'14px'}}); lg.append(h('div',{class:'body-chart-head'},h('h3',{text:'Goals connected to this pillar'}),h('span',{class:'tiny',text:`${linkedGoals.length} linked`}))); if(!linkedGoals.length) lg.append(h('div',{class:'tiny',text:'Connect a goal to this pillar from the Goal editor.'})); else linkedGoals.forEach(g=>lg.append(h('button',{class:'body-history-row',onclick:()=>openApp('goals') ,html:`<span>${esc(g.title)}</span><strong>${Math.round(goalPct(g))}%</strong><span>${esc(g.priority||'Medium')}</span><span>${esc(g.endDate?dualDate(g.endDate):'No deadline')}</span>`}))); body.append(lg);

  const cols = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(290px,1fr))', marginTop: '14px' } });

  /* milestones */
  const mc = h('div', { class: 'card' });
  mc.append(h('h3', { text: 'Milestones' }));
  (p.milestones || []).slice().sort((a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999'))).forEach(m => {
    const row = h('div', { class: 'ck' + (m.done ? ' on' : '') });
    const cb = h('button', { class: 'cbox' + (m.done ? ' on' : ''), style: m.done ? { background: p.color, borderColor: p.color } : {},
      html: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg>`,
      onclick: () => { m.done = !m.done; m.doneOn = m.done ? today() : null; commit(); } });
    row.append(cb, h('div', { style: { flex: '1', minWidth: 0 } },
      h('div', { class: 'cktext', text: m.text, style: { fontSize: '13px' } }),
      m.date ? h('div', { class: 'tiny', text: m.done ? `reached ${fmtDate(m.doneOn || m.date)}` : `by ${fmtDate(m.date)}` }) : null),
      h('button', { class: 'btn ghost sm', html: icon('edit', 12), title: 'Edit milestone', onclick: () => editMilestone(p, m) }),
      h('button', { class: 'btn ghost sm', html: icon('x', 12), title: 'Delete milestone', onclick: async () => {
        if (await confirmModal('Delete milestone?', `"${m.text}" will be removed.`, 'Delete')) {
          p.milestones = p.milestones.filter(x => x.id !== m.id); commit();
        }
      } }));
    mc.append(row);
  });
  const mAdd = h('button', { class: 'btn sm', style: { marginTop: '10px' }, html: `${icon('plus', 13)} Milestone`, onclick: () => editMilestone(p, {}) });
  mc.append(mAdd);
  cols.append(mc);

  /* the log */
  const lc = h('div', { class: 'card' });
  lc.append(h('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '10px' } },
    h('h3', { text: 'What you actually did', style: { margin: 0 } }), h('div', { class: 'spacer' }),
    h('button', { class: 'btn sm', html: icon('plus', 13), onclick: () => logPillar(p) })));
  const entries = (p.log || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  if (!entries.length) lc.append(h('div', { class: 'tiny', text: 'Nothing logged yet.' }));
  entries.slice(0, 40).forEach(x => {
    const row = h('div', { style: { display: 'flex', gap: '10px', alignItems: 'baseline', padding: '6px 0', borderBottom: '1px solid var(--border)' } });
    row.innerHTML = `<span class="tiny mono" style="flex:0 0 62px">${esc(fmtDate(x.date, { month: 'short', day: 'numeric' }))}</span>
      <span class="mono" style="font-weight:600;flex:0 0 auto">${esc(String(x.amount))}${esc(unit ? ' ' + unit : '')}</span>
      <span class="tiny" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.note || '')}</span>`;
    row.append(
      h('button', { class: 'btn ghost sm', html: icon('edit', 11), title: 'Edit entry', onclick: () => editPillarLog(p, x) }),
      h('button', { class: 'btn ghost sm', html: icon('x', 11), title: 'Delete entry', onclick: async () => {
        if (await confirmModal('Delete progress entry?', 'This removes the logged progress, not the pillar itself.', 'Delete')) {
          p.log = p.log.filter(y => y.id !== x.id); commit();

      } })
    );
    lc.append(row);
  });
  if (entries.length > 40) lc.append(h('div', { class: 'tiny', style: { marginTop: '8px' }, text: `showing the last 40 of ${entries.length}` }));
  cols.append(lc);
  body.append(cols);

  /* twelve weeks of effort, so a gap is visible */
  if (entries.length) {
    const weeks = [];
    for (let i = 11; i >= 0; i--) {
      const end = addDays(today(), -i * 7), start = addDays(end, -6);
      weeks.push([start, end, (p.log || []).filter(x => x.date >= start && x.date <= end).reduce((a, x) => a + (Number(x.amount) || 0), 0)]);
    }
    const maxW = Math.max(1, ...weeks.map(w => w[2]));
    const c = h('div', { class: 'card', style: { marginTop: '14px' } });
    c.append(h('h3', { text: 'The last twelve weeks' }));
    const sp = h('div', { class: 'spark', style: { height: '78px' } });
    weeks.forEach(([s, e, val]) => {
      const bar = h('div', { class: 'sb', style: { height: Math.max(3, val / maxW * 70) + 'px', background: p.color, opacity: val ? 1 : .25 } });
      bindTip(bar, () => `<div class="tk">${fmtDate(s)} – ${fmtDate(e)}</div><div class="tv">${val.toLocaleString('en-US', { maximumFractionDigits: 1 })}${unit ? ' ' + unit : ''}</div>`);
      sp.append(bar);
    });
    c.append(sp);
    const empties = weeks.filter(w => !w[2]).length;
    c.append(h('div', { class: 'tiny', style: { marginTop: '8px' },
      text: empties ? `${empties} of the last 12 weeks had nothing logged.` : 'Twelve weeks without a gap.' }));
    body.append(c);
  }

  /* notes */
  const nc = h('div', { class: 'card', style: { marginTop: '14px' } });
  nc.append(h('h3', { text: 'Notes' }));
  const ta = h('textarea', { class: 'inp', rows: 4, placeholder: 'Anything you want to remember about this pillar.' });
  ta.value = p.notes || '';
  ta.oninput = () => { p.notes = ta.value; save(); };
  nc.append(ta);
  body.append(nc);
}
</script>
<script>
function richDir(html){const text=String(html||'').replace(/<[^>]*>/g,' ');return orbitDirection(text)}
function sanitizeNoteHTML(v){const tmp=document.createElement('div');tmp.innerHTML=String(v||'');tmp.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(x=>x.remove());tmp.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{if(/^on/i.test(a.name))el.removeAttribute(a.name);if(a.name==='style'){const safe=a.value.split(';').map(x=>x.trim()).filter(x=>/^(text-align|font-weight|font-style|text-decoration|background-color|color|direction|font-size|font-family)\s*:/i.test(x)).join(';');if(safe)el.setAttribute('style',safe);else el.removeAttribute('style')}});if(el.tagName==='A'){const href=el.getAttribute('href')||'';if(!/^https?:\/\//i.test(href))el.removeAttribute('href');el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer')}});return tmp.innerHTML}
function noteExec(editable,cmd,value=null){editable.focus();try{if(cmd==='createLink'){const url=prompt('Enter URL');if(url)document.execCommand(cmd,false,url)}else{document.execCommand(cmd,false,value)}}catch(e){}editable.dispatchEvent(new Event('input',{bubbles:true}))}
function makeNoteToolbar(editable){
  const bar=h('div',{class:'rich-note-toolbar'});
  const btn=(label,cmd,title)=>h('button',{class:'rich-note-btn',type:'button',text:label,title,onclick:()=>{
    editable.focus(); document.execCommand(cmd,false,null); editable.dispatchEvent(new Event('input',{bubbles:true}));
  }});
  const run=(fn)=>()=>{ editable.focus(); fn(); editable.dispatchEvent(new Event('input',{bubbles:true})); };

  const fontSelect=h('select',{class:'rich-note-font-select',title:'Font',onchange:(e)=>{
    editable.focus(); document.execCommand('fontName',false,e.target.value);
    editable.dispatchEvent(new Event('input',{bubbles:true}));
  }});
  [
    ['Vazirmatn','Vazirmatn, sans-serif'],
    ['Estedad','Estedad, sans-serif'],
    ['Noto Naskh Arabic','Noto Naskh Arabic, serif'],
    ['Shabnam','Shabnam, sans-serif'],
    ['Tahoma','Tahoma, sans-serif'],
    ['Arial','Arial, sans-serif']
  ].forEach(([label,value])=>fontSelect.append(h('option',{text:label,value})));

  const sizeWrap=h('span',{class:'rich-note-size-wrap'});
  const sizeLabel=h('span',{class:'rich-note-size-label',text:'px'});
  const sizeInput=h('input',{class:'rich-note-size-input',type:'number',min:8,max:96,step:1,value:16,title:'Exact font size in pixels'});
  const applySize=()=>{
    const n=Math.max(8,Math.min(96,parseInt(sizeInput.value||16,10)));
    sizeInput.value=n;
    editable.focus();
    const sel=window.getSelection();
    if(sel && sel.rangeCount){
      const range=sel.getRangeAt(0);
      if(!range.collapsed){
        const span=document.createElement('span');
        span.style.fontSize=n+'px';
        span.appendChild(range.extractContents());
        range.insertNode(span);
        sel.removeAllRanges(); const r=document.createRange(); r.selectNodeContents(span); r.collapse(false); sel.addRange(r);
      } else {
        document.execCommand('fontSize',false,'7');
        editable.querySelectorAll('font[size="7"]').forEach(el=>{el.removeAttribute('size');el.style.fontSize=n+'px';});
      }
    }
    editable.dispatchEvent(new Event('input',{bubbles:true}));
  };
  const sizeBtn=h('button',{class:'rich-note-font-btn',type:'button',text:'Apply',title:'Apply exact font size',onclick:applySize});
  sizeWrap.append(sizeInput,sizeLabel,sizeBtn);

  bar.append(
    btn('B','bold','Bold'), btn('I','italic','Italic'), btn('U','underline','Underline'),
    btn('S','strikeThrough','Strikethrough'),
    btn('H','hiliteColor','Highlight'),
    h('button',{class:'rich-note-btn',type:'button',text:'↗ Link',title:'Add or edit a web link',onclick:()=>{
      editable.focus();
      const url=prompt('Enter URL (Google Drive, website, video, PDF…)');
      if(url && /^https?:\/\//i.test(url.trim())) document.execCommand('createLink',false,url.trim());
      editable.dispatchEvent(new Event('input',{bubbles:true}));
    }}),
    btn('• List','insertUnorderedList','Bullet list'),
    btn('1. List','insertOrderedList','Numbered list'),
    btn('↞','justifyLeft','Align left'), btn('↔','justifyCenter','Center'),
    btn('↠','justifyRight','Align right'), btn('↕','justifyFull','Justify'),
    fontSelect, sizeWrap,
    h('input',{type:'color',class:'rich-note-color',title:'Text color',value:'#4b1020',
      onchange:(e)=>{editable.focus();document.execCommand('foreColor',false,e.target.value);editable.dispatchEvent(new Event('input',{bubbles:true}));}}),
    h('input',{type:'color',class:'rich-note-color',title:'Highlight color',value:'#f4df9b',
      onchange:(e)=>{editable.focus();document.execCommand('hiliteColor',false,e.target.value);editable.dispatchEvent(new Event('input',{bubbles:true}));}})
  );
  return bar;
}
function createRichNoteEditor(initial,onChange){
  const wrap=h('div',{class:'rich-note-editor'});
  const editable=h('div',{class:'rich-note-editable',contenteditable:'true',spellcheck:'true'});
  editable.innerHTML=sanitizeNoteHTML(initial||'');
  editable.style.fontFamily='var(--font-en), Georgia, serif';
  editable.dir=richDir(initial||'');
  editable.classList.toggle('persian-text',editable.dir==='rtl');
  let lastDirection=editable.dir;
  const emit=()=>{
    const html=editable.innerHTML;
    const dir=richDir(html);
    if(dir!==lastDirection){editable.dir=dir;editable.classList.toggle('persian-text',dir==='rtl');lastDirection=dir;}
    onChange(html);
  };
  editable.addEventListener('input',emit);
  editable.addEventListener('blur',()=>onChange(sanitizeNoteHTML(editable.innerHTML)));
  wrap.append(makeNoteToolbar(editable),editable);
  return wrap;
}
async function richNoteModal(title,initial){
  return new Promise(resolve=>{
    const wrap=h('div',{class:'rich-note-modal'});
    let value=sanitizeNoteHTML(initial||'');
    const editor=createRichNoteEditor(value,v=>{value=v});
    wrap.append(editor);
    const foot=h('div',{style:{display:'flex',gap:'8px',justifyContent:'flex-end'}},
      h('button',{class:'btn',text:'Cancel',onclick:()=>{closeModal();resolve(null)}}),
      h('button',{class:'btn primary',text:'Save note',onclick:()=>{closeModal();resolve(sanitizeNoteHTML(value))}})
    );
    modal({title,bodyNode:wrap,footNode:foot,wide:true});
  })
}

/* ============================================================
   COURSES — what you signed up for, why, and what it cost

   The "why" field is the point. Money spent on learning is easy to
   justify in the moment and hard to account for later; writing the
   reason down at signup is what makes the answer honest six months on.
   ============================================================ */

const COURSE_STATES = [
  { v: 'planned', label: 'Planned', c: 'var(--muted)', ic: 'clock' },
  { v: 'active', label: 'In progress', c: 'var(--warn)', ic: 'bolt' },
  { v: 'done', label: 'Finished', c: 'var(--good)', ic: 'check' },
  { v: 'dropped', label: 'Dropped', c: 'var(--crit)', ic: 'x' },
];
const stateOf = v => COURSE_STATES.find(s => s.v === v) || COURSE_STATES[0];

async function editCourse(c) {
  const isNew = !c.id;
  DB.courses ||= [];
  const existingIndex = isNew ? DB.courses.length : Math.max(0, DB.courses.findIndex(x => x.id === c.id));
  const defaultColor = PALETTE[existingIndex % PALETTE.length][0];
  const out = await formModal(isNew ? 'New course' : 'Edit course', [
    { k: 'name', label: 'Course', required: true, placeholder: 'What is it called?' },
    { k: 'provider', label: 'Where / who from', placeholder: 'Platform, school, teacher' },
    { type: 'row', fields: [
      { k: 'start', label: 'Starts', type: 'date' },
      { k: 'end', label: 'Ends', type: 'date' }] },
    { k: 'reason', label: 'Why are you enrolling?', type: 'textarea', rows: 3, required: true,
      placeholder: 'What will you be able to do afterwards that you cannot do now?' },
    { type: 'row', fields: [
      { k: 'cost', label: 'Enrolment cost', type: 'number', step: '0.01' },
      { k: 'status', label: 'Status', type: 'select', options: COURSE_STATES.map(s => [s.v, s.label]) }] },
    { k: 'priority', label: 'Priority', type: 'select', options: [['normal','Normal'],['high','High'],['one','The One Thing']] },
    { k: 'color', label: 'Colour', type: 'color' },
    { k: 'link', label: 'Link', placeholder: 'Optional' },
  ], { start: ORBIT_DEFAULT_DATE, end: ORBIT_DEFAULT_DATE, status: 'planned', color: defaultColor, ...c }, {
    onDelete: isNew ? null : async () => {
      if (await confirmModal('Delete course?', `"${c.name}" will be removed. Any expense you already logged for it stays in Money.`)) {
        DB.courses = DB.courses.filter(x => x.id !== c.id); commit();
      }
    }
  });
  if (!out) return;
  out.cost = Number(out.cost) || 0;
  out.color = out.color || defaultColor;
  if (isNew) { DB.courses.push({ id: uid(), progress: 0, notes: '', sessions: [], ...out }); }
  else Object.assign(DB.courses.find(x => x.id === c.id), out);
  commit();
  toast(isNew ? 'Course added' : 'Course updated');
}

/* the fee is a real expense — offer to put it where it belongs */
async function billCourse(c) {
  const cats = expenseCats();
  const cat = cats.find(x => /knowledge/i.test(x)) || cats[0];
  const out = await formModal('Log the fee as an expense', [
    { type: 'row', fields: [
      { k: 'date', label: 'Date paid', type: 'date' },
      { k: 'amount', label: 'Amount', type: 'number', step: '0.01', required: true }] },
    { k: 'source', label: 'How did you pay for it?', type: 'select', options: PAY_SOURCES.map(p => [p.v, p.v]) },
    { k: 'category', label: 'Category', type: 'select', options: cats.map(x => [x, x]) },
    { k: 'essential', label: 'How essential was this?', type: 'select',
      options: [['', '— not rated —'], ...[1, 2, 3, 4, 5].map(n => [n, `${n} · ${ESSENTIAL[n]}`])] },
  ], { date: c.start || today(), amount: c.cost, source: PAY_SOURCES[0].v, category: cat, essential: '4' }, { ok: 'Log it' });
  if (!out) return;
  DB.txns.push({
    id: uid(), type: 'expense', date: out.date, amount: Math.abs(Number(out.amount) || 0),
    category: out.category, source: out.source,
    reason: `${c.name}${c.provider ? ' — ' + c.provider : ''}: ${c.reason || 'course fee'}`.slice(0, 400),
    essential: out.essential === '' ? null : Number(out.essential),
    courseId: c.id,
  });
  c.billed = true;
  Money.jumpTo = monthKey(out.date);
  commit();
  toast(`Logged ${money(out.amount)} to ${out.category}`, 'wallet');
}

    body.append(h('div', { class: 'empty', style: { minHeight: '200px' }, html:
