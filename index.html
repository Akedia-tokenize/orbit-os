<script>
/* ============================================================
   HABITS
   ============================================================ */
function streakOf(hb) {
  let n = 0, d = today();
  if (!hb.log[d]) d = addDays(d, -1);          // today not logged yet doesn't break the streak
  while (hb.log[d]) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak(hb) {
  const days = Object.keys(hb.log).filter(k => hb.log[k]).sort();
  let best = 0, run = 0, prev = null;
  days.forEach(d => { run = (prev && daysBetween(prev, d) === 1) ? run + 1 : 1; prev = d; best = Math.max(best, run); });
  return best;
}

const AppHabits = {
  id: 'habits', name: 'Habits', icon: 'flame', color: '#a8324f', w: 880, h: 560,
  render(root, re, st) {
    st.span = st.span || 30;
    const app = h('div', { class: 'app' });
    const head = h('div', { class: 'app-head' });
    head.append(h('h2', { text: 'Habits' }));
    const doneToday = DB.habits.filter(hb => hb.log[today()]).length;
    head.append(h('span', { class: 'sub', text: `${doneToday}/${DB.habits.length} done today` }), h('div', { class: 'spacer' }));
    const seg = h('div', { class: 'seg' });
    [[14, '2w'], [30, '30d'], [60, '60d']].forEach(([v, l]) =>
      seg.append(h('button', { class: st.span === v ? 'on' : '', text: l, onclick: () => { st.span = v; re(); } })));
    head.append(seg);
    head.append(h('button', { class: 'btn primary sm', html: `${icon('plus', 14)} Habit`, onclick: async () => {
      const o = await formModal('New habit', [
        { k: 'name', label: 'Habit', required: true, placeholder: 'e.g. Read 20 min' },
        { k: 'color', label: 'Colour', type: 'select', options: [1, 3, 7, 4, 5, 2, 8, 6].map(i => [`var(--s${i})`, `Colour ${i}`]) }], {});
      if (o && o.name) { DB.habits.push({ id: uid(), name: o.name, color: o.color, log: {} }); commit(); }
    } }));
    app.append(head);

    const body = h('div', { class: 'app-body' });
    if (!DB.habits.length) {
      body.append(h('div', { class: 'empty', html: `<div class="big">${icon('flame', 34)}</div><div>No habits yet. Add one — start with something<br>so small it feels almost silly.</div>` }));
      app.append(body); root.append(app); return;
    }

    /* today's row of big toggles */
    const quick = h('div', { class: 'card', style: { marginBottom: '16px' } });
    quick.append(h('h3', { text: 'Today' }));
    const qr = h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } });
    DB.habits.forEach(hb => {
      const on = !!hb.log[today()];
      const b = h('button', {
        class: 'chip', style: {
          padding: '7px 13px', fontSize: '13px',
          background: on ? hb.color : 'var(--surface-3)', color: on ? '#fff' : 'var(--text-2)',
          borderColor: on ? 'transparent' : 'var(--border)'
        },
        html: `${on ? icon('check', 13, 3) : icon('plus', 13, 2.4)}<span>${esc(hb.name)}</span>`,
        onclick: () => { if (on) delete hb.log[today()]; else hb.log[today()] = true; commit(); }
      });
      qr.append(b);
    });
    quick.append(qr);
    body.append(quick);

    /* grid */
    const days = [];
    for (let i = st.span - 1; i >= 0; i--) days.push(addDays(today(), -i));
    const card = h('div', { class: 'card' });
    card.append(h('h3', { text: `Last ${st.span} days · click any square to toggle` }));
    DB.habits.forEach(hb => {
      const row = h('div', { class: 'hb-row' });
      const nm = h('div', { class: 'hb-name' });
      nm.innerHTML = `<i style="width:9px;height:9px;border-radius:3px;background:${hb.color};flex:0 0 auto"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(hb.name)}</span>`;
      nm.style.cursor = 'pointer';
      nm.onclick = async () => {
        const o = await formModal('Edit habit', [{ k: 'name', label: 'Habit', required: true }], { name: hb.name }, {
          onDelete: async () => { if (await confirmModal('Delete habit?', `"${hb.name}" and its history will be removed.`)) { DB.habits = DB.habits.filter(x => x.id !== hb.id); commit(); } }
        });
        if (o) { hb.name = o.name; commit(); }
      };
      const cells = h('div', { class: 'hb-cells' });
      days.forEach(d => {
        const on = !!hb.log[d];
        const isT = d === today();
        const c = h('button', {
          class: 'hb-cell' + (isT ? ' today' : ''),
          style: { background: on ? hb.color : 'var(--surface-3)', opacity: on ? 1 : .85, color: on ? 'rgba(255,255,255,.9)' : 'var(--muted)', fontWeight: on ? 700 : 400 },
          title: `${fmtDate(d, { weekday: 'short', month: 'short', day: 'numeric' })} — ${on ? 'done' : 'not done'}`,
          onclick: () => { if (on) delete hb.log[d]; else hb.log[d] = true; commit(); }
        });
        if (fromYmd(d).getDate() === 1) c.textContent = MON[fromYmd(d).getMonth()];
        cells.append(c);
      });
      const done = days.filter(d => hb.log[d]).length;
      const s = streakOf(hb);
      const stk = h('div', { class: 'streak', html: `<div style="color:var(--text);font-weight:700">${s}🔥</div><div>${Math.round(done / days.length * 100)}%</div>` });
      row.append(nm, cells, stk);
      card.append(row);
      setTimeout(() => { cells.scrollLeft = cells.scrollWidth; }, 0);
    });
    body.append(card);

    /* summary */
    const sum = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))', marginTop: '16px' } });
    const allDays = days.length * DB.habits.length;
    const allDone = DB.habits.reduce((a, hb) => a + days.filter(d => hb.log[d]).length, 0);
    const bestHb = DB.habits.slice().sort((a, b) => streakOf(b) - streakOf(a))[0];
    [['Consistency', `${Math.round(allDone / Math.max(1, allDays) * 100)}%`, `over the last ${st.span} days`],
     ['Longest current streak', `${bestHb ? streakOf(bestHb) : 0} days`, bestHb ? bestHb.name : ''],
     ['Best ever streak', `${Math.max(0, ...DB.habits.map(bestStreak))} days`, 'across all habits']
    ].forEach(([k, v, d]) => sum.append(h('div', { class: 'stat', html: `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div>` })));
    body.append(sum);

    app.append(body); root.append(app);
  }
};

/* ============================================================
   FOCUS — pomodoro
   ============================================================ */
const Pomo = {
  mode: 'focus', left: 25 * 60, running: false, tickId: null, cbs: new Set(),
  dur(m) { const p = DB.settings.pomo; return ({ focus: p.focus, short: p.short, long: p.long }[m] || 25) * 60; },
  setMode(m) { this.mode = m; this.left = this.dur(m); this.pause(); this.emit(); },
  start() {
    if (this.running) return;
    this.running = true;
    this.tickId = setInterval(() => {
      this.left--;
      if (this.left <= 0) this.finish();
      this.emit();
    }, 1000);
    this.emit();
  },
  pause() { this.running = false; clearInterval(this.tickId); this.tickId = null; this.emit(); },
  reset() { this.left = this.dur(this.mode); this.pause(); },
  finish() {
    this.pause();
    if (this.mode === 'focus') {
      DB.sessions.push({ id: uid(), date: today(), minutes: DB.settings.pomo.focus, label: '' });
      save(); refresh();
      toast(`Focus session done — ${DB.settings.pomo.focus} minutes`, 'check');
      beep();
    } else { toast('Break over', 'bolt'); beep(); }
    this.left = this.dur(this.mode);
  },
  emit() { this.cbs.forEach(f => { try { f(); } catch (e) {} }); }
};
function beep() {
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = new C(), o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.type = 'sine'; o.frequency.value = 660;
    g.gain.setValueAtTime(.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.14, ctx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .9);
    o.start(); o.stop(ctx.currentTime + 1);
  } catch (e) {}
}

const AppFocus = {
  id: 'focus', name: 'Focus', icon: 'timer', color: '#8b5fbf', w: 640, h: 640,
  onClose(st) { if (st._cb) Pomo.cbs.delete(st._cb); },
  render(root, re, st) {
    const app = h('div', { class: 'app' });
    const head = h('div', { class: 'app-head' });
    head.append(h('h2', { text: 'Focus' }), h('div', { class: 'spacer' }),
      h('button', { class: 'btn ghost sm', html: icon('settings', 14), title: 'Timer lengths', onclick: async () => {
        const p = DB.settings.pomo;
        const o = await formModal('Timer lengths', [{ type: 'row', fields: [
          { k: 'focus', label: 'Focus', type: 'number', min: 1 }, { k: 'short', label: 'Short break', type: 'number', min: 1 }, { k: 'long', label: 'Long break', type: 'number', min: 1 }] }], p);
        if (o) { DB.settings.pomo = { focus: +o.focus || 25, short: +o.short || 5, long: +o.long || 15 }; Pomo.reset(); commit(); }
      } }));
    app.append(head);

    const body = h('div', { class: 'app-body' });
    const wrap = h('div', { class: 'pomo-wrap' });

    const modes = h('div', { class: 'pomo-mode' });
    [['focus', 'Focus'], ['short', 'Short break'], ['long', 'Long break']].forEach(([k, l]) =>
      modes.append(h('button', { class: Pomo.mode === k ? 'on' : '', text: l, onclick: () => { Pomo.setMode(k); } })));

    const R = 100, CIRC = 2 * Math.PI * R;
    const ring = h('div', { class: 'pomo-ring' });
    ring.innerHTML = `<svg width="224" height="224" viewBox="0 0 224 224">
      <circle cx="112" cy="112" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="9"/>
      <circle id="pring" cx="112" cy="112" r="${R}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${CIRC}" stroke-dashoffset="0" style="transition:stroke-dashoffset .35s linear"/>
    </svg><div class="pomo-time" id="ptime">25:00</div>`;

    const ctrls = h('div', { style: { display: 'flex', gap: '10px' } });
    const playBtn = h('button', { class: 'btn primary', style: { padding: '9px 22px' } });
    playBtn.onclick = () => { Pomo.running ? Pomo.pause() : Pomo.start(); };
    const resetBtn = h('button', { class: 'btn', html: `${icon('reset', 15)} Reset`, onclick: () => Pomo.reset() });
    ctrls.append(playBtn, resetBtn);
    wrap.append(modes, ring, ctrls);

    const paint = () => {
      const m = Math.floor(Pomo.left / 60), s = Pomo.left % 60;
      const tEl = $('#ptime', ring); if (tEl) tEl.textContent = `${pad(m)}:${pad(s)}`;
      const total = Pomo.dur(Pomo.mode);
      const rg = $('#pring', ring);
      if (rg) rg.setAttribute('stroke-dashoffset', String(CIRC * (1 - Pomo.left / total)));
      playBtn.innerHTML = Pomo.running ? `${icon('pause', 15)} Pause` : `${icon('play', 15, 0)} Start`;
      $$('.pomo-mode button', wrap).forEach((b, i) => b.classList.toggle('on', ['focus', 'short', 'long'][i] === Pomo.mode));
    };
    paint();
    if (st._cb) Pomo.cbs.delete(st._cb);
    st._cb = paint; Pomo.cbs.add(paint);

    body.append(wrap);

    /* stats */
    const todayS = DB.sessions.filter(s => s.date === today());
    const week = [];
    for (let i = 6; i >= 0; i--) { const d = addDays(today(), -i); week.push([d, DB.sessions.filter(s => s.date === d)]); }
    const maxW = Math.max(1, ...week.map(([, s]) => s.length));
    const stats = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(140px,1fr))' } });
    [['Today', `${todayS.length}`, `${todayS.reduce((a, s) => a + s.minutes, 0)} min focused`],
     ['This week', `${week.reduce((a, [, s]) => a + s.length, 0)}`, 'sessions'],
     ['All time', `${DB.sessions.length}`, `${Math.round(DB.sessions.reduce((a, s) => a + s.minutes, 0) / 60)} hours`]
    ].forEach(([k, v, d]) => stats.append(h('div', { class: 'stat', html: `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div>` })));
    body.append(stats);

    const chart = h('div', { class: 'card', style: { marginTop: '14px' } });
    chart.append(h('h3', { text: 'Sessions per day — last 7 days' }));
    const sp = h('div', { class: 'spark' });
    week.forEach(([d, s]) => {
      const bar = h('div', { class: 'sb', style: { height: Math.max(4, s.length / maxW * 62) + 'px', background: d === today() ? 'var(--accent)' : 'var(--s1)', opacity: d === today() ? 1 : .55 } });
      bindTip(bar, () => `<div class="tk">${fmtDate(d, { weekday: 'short', month: 'short', day: 'numeric' })}</div><div class="tv">${s.length} session${s.length === 1 ? '' : 's'}</div>`);
      sp.append(bar);
    });
    chart.append(sp);
    const lbl = h('div', { style: { display: 'flex', gap: '3px', marginTop: '6px' } });
    week.forEach(([d, s]) => lbl.append(h('div', { class: 'tiny', style: { flex: '1', textAlign: 'center' }, text: DOW[fromYmd(d).getDay()].slice(0, 1) + ' ' + s.length })));
    chart.append(lbl);
    body.append(chart);

    app.append(body); root.append(app);
  }
};
</script>
<script>
/* ============================================================
   MONEY — built around your own expense form

   Same six questions you already answer: date, how you paid for it,
   amount, category, why, and how essential it was. Plus an income
   side, so the two halves can finally sit next to each other.

   Charts follow the data-viz rules: one axis, colour tied to the
   category's identity (never to its rank), a value printed beside
   every bar so colour is never the only channel, hover tooltips,
   and the same numbers available as a table.
   ============================================================ */

const EXPENSE_CATS = [
  'Knowledge & Improving myself',
  'Clothes',
  'Gift',
  'Transportation',
  'Digital Tools',
  'Food & Drink',
  'Healthcare (Skin or Gym)',
  'Internet',
  'Investment',
  'Bill',
];

/* Your form's ten are only the starting point — add, rename or remove
   as many as you like from the Categories button in Budgets. */
function expenseCats() {
  if (!DB.cats || !DB.cats.length) DB.cats = EXPENSE_CATS.slice();
  const used = [...new Set(DB.txns.filter(t => t.type !== 'income').map(t => t.category))].filter(Boolean);
  return [...new Set([...DB.cats, ...used])];
}
const NEW_CAT = '__new_category__';

const PAY_SOURCES = [
  { v: 'my monthly budget', short: 'Monthly budget', ok: true },
  { v: 'my employer (through my professional network)', short: 'Employer / network', ok: true },
  { v: 'Borrowed the money', short: 'Borrowed', ok: false },
  { v: "my savings or investments (which I shouldn't have used)", short: 'Savings I should not have touched', ok: false },
  { v: 'My investment', short: 'My investment', ok: true },
];
const payOf = v => PAY_SOURCES.find(p => p.v === v) || { v, short: v || '—', ok: true };

const INCOME_SOURCES = ['Salary', 'Freelance / client work', 'Business', 'Investment return', 'Gift', 'Refund', 'Other'];

const ESSENTIAL = { 1: 'Optional / luxury', 2: 'Mostly optional', 3: 'Neutral', 4: 'Fairly necessary', 5: 'Necessary / essential' };
const ORD = ['var(--ord1)', 'var(--ord2)', 'var(--ord3)', 'var(--ord4)', 'var(--ord5)'];

const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
const OTHER_C = 'var(--muted)';

/* There are eight validated hues and more than eight categories, so a
   category claims a slot the first time it shows up — biggest spenders
   first — and keeps it for good. Colour therefore follows the category
   itself, never its rank in whatever chart you happen to be looking at.
   Anything left over is folded into a single grey "Other", which is what
   that bar is for. */
function catPalette() {
  const map = DB.catPalette || (DB.catPalette = {});
  const totals = {};
  DB.txns.filter(t => !isIncome(t)).forEach(t => { const c = t.category || 'Uncategorised'; totals[c] = (totals[c] || 0) + t.amount; });
  const fresh = Object.keys(totals).filter(c => !(c in map));
  if (fresh.length) {
    const taken = new Set(Object.values(map).filter(i => i >= 0));
    fresh.sort((a, b) => totals[b] - totals[a]).forEach(c => {
      const free = [0, 1, 2, 3, 4, 5, 6, 7].find(i => !taken.has(i));
      if (free === undefined) { map[c] = -1; return; }
      map[c] = free; taken.add(free);
    });
    save();
  }
  return map;
}
function catColor(name) {
  const i = catPalette()[name];
  return (i != null && i >= 0) ? SERIES[i] : OTHER_C;
}

const monthKey = s => String(s).slice(0, 7);
const monthLabel = k => { const [y, m] = k.split('-'); return `${MONTHS[+m - 1]} ${y}`; };
function monthsBack(n) {
  const out = []; const d = new Date();
  for (let i = 0; i < n; i++) { out.unshift(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); d.setMonth(d.getMonth() - 1); }
  return out;
}
const isIncome = t => t.type === 'income';

/* ---------- entry forms ---------- */
async function editExpense(t) {
  const isNew = !t.id;
  const cats = expenseCats();
  const out = await formModal(isNew ? 'Log an expense' : 'Edit expense', [
    { k: 'date', label: 'Date of expense', type: 'date', required: true },
    { k: 'source', label: 'How did you pay for it?', type: 'select', options: PAY_SOURCES.map(p => [p.v, p.v]) },
    { type: 'row', fields: [
      { k: 'amount', label: 'Amount spent', type: 'number', step: '0.01', required: true },
      { k: 'category', label: 'Category of expense', type: 'select', options: [...cats.map(c => [c, c]), [NEW_CAT, '+ New category…']] }] },
    { k: 'reason', label: 'Reason for expense', type: 'textarea', rows: 3, placeholder: 'What was it for?' },
    { k: 'essential', label: 'How essential was this purchase?', type: 'select',
      options: [['', '— not rated —'], ...[1, 2, 3, 4, 5].map(n => [n, `${n} · ${ESSENTIAL[n]}`])] },
  ], { date: today(), source: PAY_SOURCES[0].v, category: cats[0], essential: '', ...t }, {
    onDelete: isNew ? null : async () => { DB.txns = DB.txns.filter(x => x.id !== t.id); commit(); toast('Deleted', 'trash'); }
  });
  if (!out) return;

  if (out.category === NEW_CAT) {
    const c = await formModal('New category', [{ k: 'name', label: 'Category name', required: true, placeholder: 'e.g. Rent' }], {}, { ok: 'Add' });
    if (!c || !c.name.trim()) return;
    out.category = c.name.trim();
    if (!DB.cats.includes(out.category)) DB.cats.push(out.category);
  }

  out.type = 'expense';
  out.amount = Math.abs(Number(out.amount) || 0);
  out.essential = out.essential === '' ? null : Number(out.essential);
  if (isNew) DB.txns.push({ id: uid(), ...out });
  else Object.assign(DB.txns.find(x => x.id === t.id), out);
  Money.jumpTo = monthKey(out.date);          // show me what I just saved
  commit();
  toast(`${isNew ? 'Logged' : 'Updated'} ${money(out.amount)} · ${out.category}`, 'check');
}

async function editIncome(t) {
  const isNew = !t.id;
  const seen = [...new Set([...INCOME_SOURCES, ...DB.txns.filter(isIncome).map(x => x.source)])].filter(Boolean);
  const out = await formModal(isNew ? 'Log income' : 'Edit income', [
    { k: 'date', label: 'Date received', type: 'date', required: true },
    { type: 'row', fields: [
      { k: 'amount', label: 'Amount', type: 'number', step: '0.01', required: true },
      { k: 'source', label: 'Where did it come from?', suggest: seen, placeholder: 'Salary, client, gift…' }] },
    { k: 'reason', label: 'Note', type: 'textarea', rows: 3, placeholder: 'Optional' },
  ], { date: today(), source: INCOME_SOURCES[0], ...t }, {
    onDelete: isNew ? null : async () => { DB.txns = DB.txns.filter(x => x.id !== t.id); commit(); toast('Deleted', 'trash'); }
  });
  if (!out) return;
  out.type = 'income';
  out.category = out.source || 'Income';
  out.amount = Math.abs(Number(out.amount) || 0);
  if (isNew) DB.txns.push({ id: uid(), ...out });
  else Object.assign(DB.txns.find(x => x.id === t.id), out);
  Money.jumpTo = monthKey(out.date);
  commit();
  toast(`${isNew ? 'Logged' : 'Updated'} income ${money(out.amount)}`, 'check');
}

/* ---------- CSV, including your own Google Form responses ---------- */
async function importCSV() {
  const f = await pickFile('.csv,text/csv');
  if (!f) return;
  const rows = parseCSV(f.text);
  if (rows.length < 2) return toast('That file looks empty', 'x');
  const head = rows[0].map(x => x.trim().toLowerCase());
  const find = (...names) => head.findIndex(hd => names.some(n => hd.includes(n)));
  const iD = find('date of expense', 'date received', 'date', 'timestamp');
  const iA = find('amount spent', 'amount', 'cost', 'price', 'total', 'value');
  const iC = find('category of expense', 'category', 'kind', 'tag');
  const iS = find('how did you pay', 'payment', 'source', 'where did it come');
  const iR = find('reason for expense', 'reason', 'note', 'desc', 'detail');
  const iE = find('essential', 'scale of 1-5');
  const iT = find('income/expense', 'in/out', 'direction', 'type');
  if (iD < 0 || iA < 0) return toast('Need at least a date column and an amount column', 'x');

  let n = 0;
  rows.slice(1).forEach(r => {
    const raw = String(r[iA] || '').replace(/[^0-9.\-]/g, '');
    const amt = Number(raw); if (!raw || isNaN(amt)) return;
    const d = new Date(r[iD]); if (isNaN(d)) return;
    const income = iT >= 0 && /in(come)?|credit/i.test(r[iT] || '');
    const ess = iE >= 0 ? Number(String(r[iE]).replace(/[^0-9]/g, '')) : NaN;
    DB.txns.push({
      id: uid(), date: ymd(d), amount: Math.abs(amt),
      type: income ? 'income' : 'expense',
      category: (iC >= 0 && r[iC]) ? String(r[iC]).trim() : (income ? 'Income' : 'Uncategorised'),
      source: iS >= 0 ? String(r[iS] || '').trim() : '',
      reason: iR >= 0 ? String(r[iR] || '').trim() : '',
      essential: ess >= 1 && ess <= 5 ? ess : null,
    });
    n++;
  });
  commit(); toast(`Imported ${n} row${n === 1 ? '' : 's'}`, 'download');
}
function exportCSV() {
  const rows = [['Date', 'Type', 'How did you pay for it?', 'Amount', 'Category', 'Reason', 'Essential (1-5)'],
    ...DB.txns.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)))
      .map(t => [t.date, t.type || 'expense', t.source || '', t.amount, t.category || '', t.reason || t.note || '', t.essential ?? ''])];
  downloadFile('orbit-money.csv', rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
  toast('Exported orbit-money.csv', 'upload');
}

/* ---------- a labelled bar row, the one chart shape used throughout ---------- */
function barRow(name, amount, max, color, tipExtra) {
  const row = h('div', { class: 'bar-row' });
  const track = h('div', { class: 'bar-track' });
  track.append(h('div', { class: 'bar-fill', style: { width: Math.max(1.5, amount / Math.max(1, max) * 100) + '%', background: color } }));
  bindTip(track, () => `<div class="tk">${esc(name)}</div><div class="tv">${esc(money(amount))}</div>${tipExtra ? `<div class="tk">${esc(tipExtra)}</div>` : ''}`);
  row.append(
    h('div', { class: 'nm', html: `<i style="width:8px;height:8px;border-radius:2px;background:${color};flex:0 0 auto"></i><span title="${esc(name)}">${esc(name)}</span>` }),
    track,
    h('div', { class: 'vl', text: money(amount) }));
  return row;
}

const Money = { jumpTo: null };

const AppFinance = {
  id: 'finance', name: 'Money', icon: 'wallet', color: '#3f7f5f', w: 1000, h: 700,
  render(root, re, st) {
    st.month = st.month || monthKey(today());
    if (Money.jumpTo) { st.month = Money.jumpTo; Money.jumpTo = null; }
    st.tab = st.tab || 'overview';
    const app = h('div', { class: 'app' });

    const head = h('div', { class: 'app-head' });
    const shift = n => { const [y, m] = st.month.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); st.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; re(); };
    head.append(
      h('div', { style: { display: 'flex', gap: '4px' } },
        h('button', { class: 'btn ghost sm', html: icon('left', 15), onclick: () => shift(-1) }),
        h('button', { class: 'btn ghost sm', html: icon('right', 15), onclick: () => shift(1) })),
      h('h2', { text: monthLabel(st.month) }),
      h('div', { class: 'spacer' }));
    const seg = h('div', { class: 'seg' });
    [['overview', 'Overview'], ['income', 'Income'], ['wish', 'Wishlist'], ['budgets', 'Budgets'], ['txns', 'All entries']].forEach(([k, l]) =>
      seg.append(h('button', { class: st.tab === k ? 'on' : '', text: l, onclick: () => { st.tab = k; re(); } })));
    head.append(seg,
      h('button', { class: 'btn sm', html: `${icon('download', 14)} CSV`, title: 'Import a CSV — including your Google Form responses sheet', onclick: importCSV }),
      h('button', { class: 'btn sm', html: `${icon('plus', 14)} Income`, onclick: () => editIncome({ date: st.month === monthKey(today()) ? today() : st.month + '-01' }) }),
      h('button', { class: 'btn primary sm', html: `${icon('plus', 14)} Expense`, onclick: () => editExpense({ date: st.month === monthKey(today()) ? today() : st.month + '-01' }) }));
    app.append(head);

    const body = h('div', { class: 'app-body' });
    const mt = DB.txns.filter(t => monthKey(t.date) === st.month);
    const exp = mt.filter(t => !isIncome(t));
    const inc = mt.filter(isIncome);
    const spent = exp.reduce((a, t) => a + t.amount, 0);
    const earned = inc.reduce((a, t) => a + t.amount, 0);

    if (st.tab === 'overview') overviewTab(body, st, re, { mt, exp, inc, spent, earned });
    if (st.tab === 'income') incomeTab(body, st, re, { inc, earned, spent });
    if (st.tab === 'wish') wishlistTab(body, st, re);
    if (st.tab === 'budgets') budgetsTab(body, st, re, { exp });
    if (st.tab === 'txns') entriesTab(body, st, re, { mt });

    app.append(body); root.append(app);
  }
};

/* ---------- OVERVIEW ---------- */
function overviewTab(body, st, re, d) {
  const { exp, inc, spent, earned } = d;

  const prevKey = (() => { const [y, m] = st.month.split('-').map(Number); const x = new Date(y, m - 2, 1); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}`; })();
  const prevSpent = DB.txns.filter(t => monthKey(t.date) === prevKey && !isIncome(t)).reduce((a, t) => a + t.amount, 0);
  const delta = prevSpent ? Math.round((spent - prevSpent) / prevSpent * 100) : 0;
  const dim = new Date(+st.month.slice(0, 4), +st.month.slice(5, 7), 0).getDate();
  const elapsed = st.month === monthKey(today()) ? new Date().getDate() : dim;

  const tiles = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(158px,1fr))' } });
  [['Spent', money(spent), prevSpent ? `${delta >= 0 ? '↑' : '↓'} ${Math.abs(delta)}% vs ${MON[+prevKey.slice(5, 7) - 1]}` : 'no prior month', delta > 0 ? 'var(--crit)' : 'var(--good)'],
   ['Earned', money(earned), `${inc.length} entr${inc.length === 1 ? 'y' : 'ies'}`, ''],
   ['Net', money(earned - spent), earned - spent >= 0 ? 'you kept some' : 'spent more than you made', earned - spent >= 0 ? 'var(--good)' : 'var(--crit)'],
   ['Average / day', money(spent / Math.max(1, elapsed)), `across ${elapsed} day${elapsed === 1 ? '' : 's'}`, '']
  ].forEach(([k, v, s, c]) => tiles.append(h('div', { class: 'stat', html: `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d" style="${c ? `color:${c}` : ''}">${esc(s)}</div>` })));
  body.append(tiles);

  /* the one number your form was really asking about */
  const risky = exp.filter(t => !payOf(t.source).ok);
  const riskySum = risky.reduce((a, t) => a + t.amount, 0);
  if (riskySum > 0) {
    const share = Math.round(riskySum / Math.max(1, spent) * 100);
    const card = h('div', { class: 'card', style: { marginTop: '14px', borderColor: 'var(--crit)' } });
    card.innerHTML = `<div style="display:flex;align-items:flex-start;gap:11px">
      <span style="color:var(--crit);flex:0 0 auto;margin-top:1px">${icon('bolt', 19)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13.5px;color:var(--crit)">Money that did not come from your budget</div>
        <div class="tiny" style="margin-top:3px">${risky.length} purchase${risky.length === 1 ? '' : 's'} — ${share}% of everything you spent this month — was borrowed or taken from savings.</div>
      </div>
      <div class="mono" style="font-size:21px;font-weight:600;color:var(--crit)">${esc(money(riskySum))}</div></div>`;
    body.append(card);
  }

  /* where it went — by category */
  const byCat = {};
  exp.forEach(t => { const c = t.category || 'Uncategorised'; byCat[c] = (byCat[c] || 0) + t.amount; });
  const pal = catPalette();
  const named = Object.entries(byCat).filter(([c]) => pal[c] >= 0).sort((a, b) => b[1] - a[1]);
  const spare = Object.entries(byCat).filter(([c]) => !(pal[c] >= 0));
  const spareSum = spare.reduce((a, x) => a + x[1], 0);
  const cats = spareSum > 0 ? [...named, ['Other', spareSum]] : named;
  const maxC = Math.max(1, ...cats.map(c => c[1]));
  const c1 = h('div', { class: 'card', style: { marginTop: '14px' } });
  c1.append(h('h3', { text: 'Where the money went' }));
  if (!cats.length) c1.append(h('div', { class: 'tiny', text: 'Nothing logged this month.' }));
  cats.forEach(([name, amt]) => c1.append(barRow(name, amt, maxC,
    name === 'Other' ? OTHER_C : catColor(name),
    name === 'Other' ? spare.sort((a, b) => b[1] - a[1]).map(x => x[0]).join(', ')
                     : `${Math.round(amt / Math.max(1, spent) * 100)}% of spend`)));
  if (spareSum > 0) c1.append(h('div', { class: 'tiny', style: { marginTop: '8px' },
    text: `"Other" holds ${spare.length} categor${spare.length === 1 ? 'y' : 'ies'} beyond the eight colours: ${spare.map(x => x[0]).join(', ')}.` }));
  body.append(c1);

  /* how you paid for it */
  const bySrc = {};
  exp.forEach(t => { const s = t.source || '—'; bySrc[s] = (bySrc[s] || 0) + t.amount; });
  const srcRows = PAY_SOURCES.filter(p => bySrc[p.v]).map(p => [p, bySrc[p.v]])
    .concat(Object.keys(bySrc).filter(k => !PAY_SOURCES.some(p => p.v === k)).map(k => [payOf(k), bySrc[k]]))
    .sort((a, b) => b[1] - a[1]);
  if (srcRows.length) {
    const maxS = Math.max(1, ...srcRows.map(r => r[1]));
    const c2 = h('div', { class: 'card', style: { marginTop: '14px' } });
    c2.append(h('h3', { text: 'How you paid for it' }));
    srcRows.forEach(([p, amt]) => {
      const row = barRow(p.short, amt, maxS, p.ok ? 'var(--s3)' : 'var(--crit)',
        `${Math.round(amt / Math.max(1, spent) * 100)}% of spend`);
      if (!p.ok) row.querySelector('.nm').append(h('span', { class: 'tiny', style: { color: 'var(--crit)', flex: '0 0 auto' }, html: icon('bolt', 11, 2.4) }));
      c2.append(row);
    });
    c2.append(h('div', { class: 'tiny', style: { marginTop: '8px' }, html:
      `${icon('bolt', 11, 2.4)} marks money that came from outside your monthly budget.` }));
    body.append(c2);
  }

  /* how essential it was */
  const rated = exp.filter(t => t.essential >= 1 && t.essential <= 5);
  if (rated.length) {
    const byE = [1, 2, 3, 4, 5].map(n => rated.filter(t => t.essential === n).reduce((a, t) => a + t.amount, 0));
    const maxE = Math.max(1, ...byE);
    const ratedSum = byE.reduce((a, b) => a + b, 0);
    const avg = rated.reduce((a, t) => a + t.essential * t.amount, 0) / Math.max(1, ratedSum);
    const luxury = byE[0] + byE[1];
    const c3 = h('div', { class: 'card', style: { marginTop: '14px' } });
    c3.append(h('h3', { text: 'How essential it was' }));
    [1, 2, 3, 4, 5].forEach(n => c3.append(barRow(`${n} · ${ESSENTIAL[n]}`, byE[n - 1], maxE, ORD[n - 1],
      `${Math.round(byE[n - 1] / Math.max(1, ratedSum) * 100)}% of rated spend`)));
    c3.append(h('div', { class: 'tiny', style: { marginTop: '9px' },
      text: `Weighted average ${avg.toFixed(1)} out of 5. ${money(luxury)} went on things you rated optional. ${exp.length - rated.length} purchase${exp.length - rated.length === 1 ? '' : 's'} unrated.` }));
    body.append(c3);
  }

  /* in and out, six months — two series, one axis, same unit */
  const months = monthsBack(6);
  const outs = months.map(m => DB.txns.filter(t => monthKey(t.date) === m && !isIncome(t)).reduce((a, t) => a + t.amount, 0));
  const ins = months.map(m => DB.txns.filter(t => monthKey(t.date) === m && isIncome(t)).reduce((a, t) => a + t.amount, 0));
  const maxM = Math.max(1, ...outs, ...ins);
  const c4 = h('div', { class: 'card', style: { marginTop: '14px' } });
  const legend = h('div', { style: { display: 'flex', gap: '14px', marginBottom: '10px' } },
    h('span', { class: 'tiny', html: `<i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--s3);margin-right:5px"></i>Money in` }),
    h('span', { class: 'tiny', html: `<i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--s2);margin-right:5px"></i>Money out` }));
  c4.append(h('h3', { text: 'In and out — last 6 months' }), legend);
  const chart = h('div', { style: { display: 'flex', alignItems: 'flex-end', gap: '10px', height: '110px' } });
  months.forEach((m, i) => {
    const col = h('div', { style: { flex: '1', display: 'flex', alignItems: 'flex-end', gap: '2px', height: '100%', cursor: 'pointer' }, onclick: () => { st.month = m; re(); } });
    [[ins[i], 'var(--s3)', 'Money in'], [outs[i], 'var(--s2)', 'Money out']].forEach(([v, c, lbl]) => {
      const bar = h('div', { style: { flex: '1', height: Math.max(3, v / maxM * 100) + '%', background: c, borderRadius: '4px 4px 0 0', opacity: m === st.month ? 1 : .5 } });
      bindTip(bar, () => `<div class="tk">${monthLabel(m)} · ${lbl}</div><div class="tv">${money(v)}</div>`);
      col.append(bar);
    });
    chart.append(col);
  });
  c4.append(chart);
  const lbls = h('div', { style: { display: 'flex', gap: '10px', marginTop: '7px' } });
  months.forEach((m, i) => lbls.append(h('div', { class: 'tiny mono', style: { flex: '1', textAlign: 'center', fontWeight: m === st.month ? 700 : 400, color: m === st.month ? 'var(--text)' : '' },
    text: `${MON[+m.slice(5, 7) - 1]} ${Math.round(ins[i] - outs[i]) >= 0 ? '+' : ''}${Math.round(ins[i] - outs[i])}` })));
  c4.append(lbls, h('div', { class: 'tiny', style: { marginTop: '6px' }, text: 'The number under each month is what you kept.' }));
  body.append(c4);
}

/* ---------- INCOME ---------- */
function incomeTab(body, st, re, d) {
  const { inc, earned, spent } = d;
  const tiles = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(158px,1fr))' } });
  const months = monthsBack(6);
  const avg = months.map(m => DB.txns.filter(t => monthKey(t.date) === m && isIncome(t)).reduce((a, x) => a + x.amount, 0));
  const avg6 = avg.reduce((a, b) => a + b, 0) / 6;
  [['Earned this month', money(earned), `${inc.length} entr${inc.length === 1 ? 'y' : 'ies'}`, ''],
   ['6-month average', money(avg6), 'per month', ''],
   ['Kept', money(earned - spent), earned ? `${Math.round((earned - spent) / earned * 100)}% of what came in` : 'nothing recorded', earned - spent >= 0 ? 'var(--good)' : 'var(--crit)'],
  ].forEach(([k, v, s, c]) => tiles.append(h('div', { class: 'stat', html: `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d" style="${c ? `color:${c}` : ''}">${esc(s)}</div>` })));
  body.append(tiles);

  const bySrc = {};
  inc.forEach(t => { const s = t.source || 'Other'; bySrc[s] = (bySrc[s] || 0) + t.amount; });
  const rows = Object.entries(bySrc).sort((a, b) => b[1] - a[1]);
  const order = [...new Set([...INCOME_SOURCES, ...DB.txns.filter(isIncome).map(t => t.source)])].filter(Boolean);
  const c1 = h('div', { class: 'card', style: { marginTop: '14px' } });
  c1.append(h('h3', { text: 'Where it came from' }));
  if (!rows.length) c1.append(h('div', { class: 'empty', style: { minHeight: '120px' }, html:
    `<div class="big">${icon('wallet', 30)}</div><div>No income logged for ${esc(monthLabel(st.month))}.<br>Use the <strong>+ Income</strong> button up top.</div>` }));
  const maxI = Math.max(1, ...rows.map(r => r[1]));
  rows.forEach(([name, amt]) => {
    const i = order.indexOf(name);
    c1.append(barRow(name, amt, maxI, i >= 0 && i < 8 ? SERIES[i] : OTHER_C, `${Math.round(amt / Math.max(1, earned) * 100)}% of income`));
  });
  body.append(c1);

  const c2 = h('div', { class: 'card pad0', style: { marginTop: '14px' } });
  const tbl = h('table', { class: 'tbl' });
  tbl.innerHTML = '<thead><tr><th>Date</th><th>Source</th><th>Note</th><th class="num">Amount</th><th></th></tr></thead>';
  const tb = h('tbody');
  inc.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).forEach(t => {
    const tr = h('tr');
    tr.innerHTML = `<td class="mono tiny" style="color:var(--text-2)">${esc(fmtDate(t.date, { month: 'short', day: 'numeric' }))}</td>
      <td><span class="chip"><i class="dot" style="background:var(--good)"></i>${esc(t.source || '—')}</span></td>
      <td class="tiny">${esc(t.reason || t.note || '')}</td>
      <td class="num" style="font-weight:600;color:var(--good)">+${esc(money(t.amount))}</td>`;
    const td = h('td', { style: { width: '34px' } });
    td.append(h('button', { class: 'btn ghost sm', html: icon('edit', 13), onclick: () => editIncome(t) }));
    tr.append(td); tb.append(tr);
  });
  if (!inc.length) tb.innerHTML = '<tr><td colspan="5" style="padding:28px;text-align:center;color:var(--muted)">Nothing yet.</td></tr>';
  tbl.append(tb); c2.append(tbl);
  body.append(c2);
}

/* ---------- WISHLIST ----------
   Things you want but have not bought. The number that matters here is
   how long it has been sitting on the list: wanting something for six
   weeks is a different fact from wanting it for six minutes. */
const WANT = { 1: 'Passing thought', 2: 'Would be nice', 3: 'Keep thinking about it', 4: 'Really want it', 5: 'Been wanting it for ages' };

async function editWish(w) {
  const isNew = !w.id;
  const out = await formModal(isNew ? 'Something you want' : 'Edit', [
    { k: 'title', label: 'What is it?', required: true, placeholder: 'Be specific — the exact thing' },
    { type: 'row', fields: [
      { k: 'price', label: 'Roughly what it costs', type: 'number', step: '0.01' },
      { k: 'want', label: 'How much do you want it?', type: 'select', options: [1, 2, 3, 4, 5].map(n => [n, `${n} · ${WANT[n]}`]) }] },
    { k: 'why', label: 'Why do you want it?', type: 'textarea', rows: 3, required: true,
      placeholder: 'The honest reason. You will read this back before you buy.' },
    { type: 'row', fields: [
      { k: 'decideBy', label: 'Decide by', type: 'date', hint: 'Optional — a date to stop thinking about it.' },
      { k: 'link', label: 'Link', placeholder: 'Optional' }] },
  ], { want: 3, ...w }, {
    onDelete: isNew ? null : async () => { DB.wishlist = DB.wishlist.filter(x => x.id !== w.id); commit(); toast('Removed', 'trash'); }
  });
  if (!out) return;
  out.price = Number(out.price) || 0;
  out.want = Number(out.want) || 3;
  if (isNew) { DB.wishlist ||= []; DB.wishlist.push({ id: uid(), added: today(), ...out }); }
  else Object.assign(DB.wishlist.find(x => x.id === w.id), out);
  commit();
}

async function buyWish(w) {
  const cats = expenseCats();
  const out = await formModal(`Buying: ${w.title}`, [
    { type: 'row', fields: [
      { k: 'date', label: 'Date', type: 'date' },
      { k: 'amount', label: 'What you actually paid', type: 'number', step: '0.01', required: true }] },
    { k: 'source', label: 'How did you pay for it?', type: 'select', options: PAY_SOURCES.map(p => [p.v, p.v]) },
    { k: 'category', label: 'Category', type: 'select', options: cats.map(c => [c, c]) },
    { k: 'essential', label: 'How essential was it, now that you have it?', type: 'select',
      options: [['', '— not rated —'], ...[1, 2, 3, 4, 5].map(n => [n, `${n} · ${ESSENTIAL[n]}`])] },
  ], { date: today(), amount: w.price, source: PAY_SOURCES[0].v, category: cats[0], essential: '' },
     { ok: 'I bought it' });
  if (!out) return;
  const waited = daysBetween(w.added, today());
  DB.txns.push({
    id: uid(), type: 'expense', date: out.date, amount: Math.abs(Number(out.amount) || 0),
    category: out.category, source: out.source,
    reason: `${w.title} — ${w.why}`.slice(0, 400),
    essential: out.essential === '' ? null : Number(out.essential),
    waitedDays: waited,
  });
  DB.wishlist = DB.wishlist.filter(x => x.id !== w.id);
  Money.jumpTo = monthKey(out.date);
  commit();
  toast(`Bought after ${waited} day${waited === 1 ? '' : 's'} of wanting it`, 'check');
}

function wishlistTab(body, st, re) {
  DB.wishlist ||= [];
  const list = DB.wishlist.slice().sort((a, b) => (b.want || 0) - (a.want || 0) || String(a.added).localeCompare(String(b.added)));
  const total = list.reduce((a, w) => a + (Number(w.price) || 0), 0);
  const oldest = list.length ? Math.max(...list.map(w => daysBetween(w.added, today()))) : 0;

  const bar = h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '14px', flexWrap: 'wrap' } },
    h('span', { class: 'tiny', text: list.length ? `${list.length} thing${list.length === 1 ? '' : 's'} · ${money(total)} if you bought them all · oldest has waited ${oldest} day${oldest === 1 ? '' : 's'}` : '' }),
    h('div', { class: 'spacer' }),
    h('button', { class: 'btn primary sm', html: `${icon('plus', 14)} Add something`, onclick: () => editWish({}) }));
  body.append(bar);

  if (!list.length) {
    body.append(h('div', { class: 'empty', style: { minHeight: '220px' }, html:
      `<div class="big">${icon('heart', 32)}</div><div>Nothing on the list.<br>Put things here instead of in a basket, and see<br>how many of them you still want in a month.</div>` }));
    return;
  }

  const grid = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fill,minmax(290px,1fr))' } });
  list.forEach(w => {
    const waited = daysBetween(w.added, today());
    const due = w.decideBy ? daysBetween(today(), w.decideBy) : null;
    const card = h('div', { class: 'card', style: { display: 'flex', flexDirection: 'column', gap: '9px' } });
    card.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:9px">
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:700;line-height:1.3">${esc(w.title)}</div>
          <div class="tiny" style="margin-top:2px">on the list for ${waited} day${waited === 1 ? '' : 's'}${due != null ? (due >= 0 ? ` · decide within ${due}` : ' · past your decide-by date') : ''}</div>
        </div>
        ${w.price ? `<div class="mono" style="font-size:16px;font-weight:600;flex:0 0 auto">${esc(money(w.price))}</div>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <i style="width:8px;height:8px;border-radius:2px;background:${ORD[(w.want || 3) - 1]}"></i>
        <span class="tiny">${esc(WANT[w.want || 3])}</span>
      </div>
      <div class="tiny" style="color:var(--text-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(w.why || '')}</div>`;
    const acts = h('div', { style: { display: 'flex', gap: '7px', marginTop: '4px', flexWrap: 'wrap' } },
      h('button', { class: 'btn primary sm', html: `${icon('check', 13)} I bought it`, onclick: () => buyWish(w) }),
      h('button', { class: 'btn ghost sm', html: icon('edit', 13), title: 'Edit', onclick: () => editWish(w) }),
      w.link ? h('a', { class: 'btn ghost sm', href: w.link, target: '_blank', rel: 'noopener', html: icon('link', 13), title: 'Open link' }) : null,
      h('div', { class: 'spacer' }),
      h('button', { class: 'btn ghost sm danger', html: `${icon('x', 13)} Let it go`, onclick: async () => {
        if (await confirmModal('Let it go?', `"${w.title}" comes off the list. No expense is recorded.`, 'Let it go')) {
          DB.wishlist = DB.wishlist.filter(x => x.id !== w.id); commit(); toast('Off the list', 'x');
        }
      } }));
    card.append(acts);
    grid.append(card);
  });
  body.append(grid);

  const patient = DB.txns.filter(t => t.waitedDays != null);
  if (patient.length) {
    const avg = patient.reduce((a, t) => a + t.waitedDays, 0) / patient.length;
    body.append(h('div', { class: 'card', style: { marginTop: '14px' } },
      h('h3', { text: 'What waiting has done for you' }),
      h('div', { class: 'tiny', text: `${patient.length} thing${patient.length === 1 ? '' : 's'} moved from this list into a real purchase, after an average of ${Math.round(avg)} days of wanting.` })));
  }
}

/* ---------- BUDGETS ---------- */
function budgetsTab(body, st, re, d) {
  const { exp } = d;
  const byCat = {};
  exp.forEach(t => { const c = t.category || 'Uncategorised'; byCat[c] = (byCat[c] || 0) + t.amount; });
  const card = h('div', { class: 'card' });
  card.append(h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '10px' } },
    h('h3', { text: 'Monthly budgets', style: { margin: 0 } }), h('div', { class: 'spacer' }),
    h('button', { class: 'btn sm', html: `${icon('grid', 13)} Categories`, onclick: manageCats }),
    h('button', { class: 'btn sm', html: `${icon('plus', 13)} Budget`, onclick: async () => {
      const cats = expenseCats();
      const o = await formModal('Set a budget', [
        { k: 'category', label: 'Category', type: 'select', options: cats.map(c => [c, c]) },
        { k: 'amount', label: 'Monthly limit', type: 'number', step: '1', required: true }], {});
      if (o) { DB.budgets[o.category] = Number(o.amount); commit(); }
    } })));
  const keys = Object.keys(DB.budgets);
  if (!keys.length) card.append(h('div', { class: 'empty', style: { minHeight: '120px' }, html:
    '<div>No budgets set. Add one and you will see<br>how close you are as the month goes.</div>' }));
  keys.sort().forEach(cat => {
    const lim = DB.budgets[cat], used = byCat[cat] || 0, pct = used / Math.max(1, lim) * 100;
    const state = pct > 100 ? ['var(--crit)', 'Over budget', 'bolt'] : pct > 80 ? ['var(--warn)', 'Getting close', 'clock'] : ['var(--good)', 'On track', 'check'];
    const row = h('div', { style: { padding: '10px 0', borderBottom: '1px solid var(--border)' } });
    row.innerHTML = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <i style="width:8px;height:8px;border-radius:2px;background:${catColor(cat)}"></i>
        <strong style="font-size:13.5px">${esc(cat)}</strong>
        <span class="chip" style="border-color:transparent;background:transparent;color:${state[0]};padding-left:0">${icon(state[2], 12, 2.4)}${state[1]}</span>
        <span style="flex:1"></span>
        <span class="mono" style="font-size:13px"><strong>${esc(money(used))}</strong> <span class="tiny">of ${esc(money(lim))}</span></span></div>
      <div class="budget-bar"><i style="width:${Math.min(100, pct)}%;background:${state[0]}"></i></div>`;
    row.append(h('button', { class: 'btn ghost sm', html: icon('trash', 12), style: { marginTop: '6px' }, onclick: () => { delete DB.budgets[cat]; commit(); } }));
    card.append(row);
  });
  body.append(card);

  const un = Object.keys(byCat).filter(c => !DB.budgets[c]).sort();
  if (un.length) {
    const c2 = h('div', { class: 'card', style: { marginTop: '14px' } });
    c2.append(h('h3', { text: 'Spending with no budget' }));
    un.forEach(c => c2.append(h('div', { style: { display: 'flex', padding: '5px 0', fontSize: '13px' } },
      h('span', { text: c }), h('span', { class: 'spacer' }), h('span', { class: 'mono', text: money(byCat[c]) }))));
    body.append(c2);
  }
}
