    return;
  }

  
    const courseNotesPanel = (c) => {
      const wrap = h('div',{class:'course-notes-panel'});
      const titleRow = h('div',{class:'course-notes-head'},
        h('div',{class:'course-notes-title'},h('span',{text:'📝'}),h('strong',{text:'Course notes'})),
        h('button',{class:'btn ghost sm',text:'Edit notes',onclick:async(e)=>{
          e.stopPropagation();
          const out = await formModal('Course notes',[
            {k:'notes',label:'Notes',type:'textarea',rows:14,placeholder:'Write notes, reflections, questions, links, ideas…'}
          ],{notes:c.notes||''});
          if(out){c.notes=out.notes||'';commit();}
        }})
      );
      const body = h('div',{class:'course-notes-body'});
      body.innerHTML = c.notes ? sanitizeNoteHTML(c.notes) : 'Add notes for this course…';
      if(!c.notes) body.classList.add('is-empty');
      body.dir = richDir(c.notes||''); body.classList.toggle('persian-text',body.dir==='rtl');
      wrap.append(titleRow,body);
      return wrap;
    };

const grid = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fill,minmax(280px,1fr))', marginTop: '14px' } });
  list.forEach(c => {
    const s = stateOf(c.status);
    const courseColor = c.color || 'var(--c4)';
    const card = h('div', { class: 'course-card', onclick: () => { st.sel = c.id; re(); } });
    const days = c.start ? daysBetween(today(), c.start) : null;
    const progress = Math.max(0, Math.min(100, Number(c.progress) || 0));
    const dateLabel = c.start ? (days > 0 ? `Starts in ${days}d` : (days === 0 ? 'Starts today' : fmtDate(c.start))) : 'No start date';
    card.innerHTML = `
      <div class="course-accent" style="background:${courseColor}"></div>
      <div class="course-cover" style="background:linear-gradient(135deg,${courseColor},color-mix(in srgb, ${courseColor} 48%, #160d1b))">
        <span class="course-icon">${icon('cap', 19, 2.2)}</span>
        ${c.cost ? `<span class="course-cost">${esc(money(c.cost))}</span>` : '<span class="course-cost">Free</span>'}
        <div class="course-title">${esc(c.name)}</div>
      </div>
      <div class="course-body">
        <div class="course-meta">
          <span class="course-status" style="color:${s.c}">${icon(s.ic, 11, 2.4)}${s.label}</span>
          <span style="flex:1"></span>
          <span class="tiny">${esc(dateLabel)}</span>
        </div>
        ${c.provider ? `<div class="course-provider" style="margin-top:8px">${esc(c.provider)}</div>` : ''}
        <div class="course-reason">${esc(c.reason || 'No reason added yet.')}</div>
        <div class="course-progress">
          <div class="course-progress-row"><span>Progress</span><strong>${progress}%</strong></div>
          <div class="course-progress-bar"><i style="width:${progress}%;background:${courseColor}"></i></div>
        </div>
      </div>`;
    grid.append(card);
  });
  body.append(grid);
}

function courseDetail(body, c, re, st) {
  const s = stateOf(c.status);
  const nights = c.start && c.end ? daysBetween(c.start, c.end) : null;
  const paid = DB.txns.some(t => t.courseId === c.id);

  const tiles = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' } });
  [['Status', s.label, c.provider || '', s.c],
   ['Cost', c.cost ? money(c.cost) : '—', paid ? 'logged in Money' : (c.cost ? 'not logged yet' : 'free'), ''],
   ['Starts', c.start ? fmtDate(c.start) : '—', c.start && daysBetween(today(), c.start) > 0 ? `in ${daysBetween(today(), c.start)} days` : '', ''],
   ['Length', nights != null ? `${nights}d` : '—', c.end ? `ends ${fmtDate(c.end)}` : 'no end date', ''],
  ].forEach(([k, v, d, col]) => tiles.append(h('div', { class: 'stat', html: `<div class="k">${esc(k)}</div><div class="v" style="${col ? `color:${col}` : ''}">${esc(v)}</div><div class="d">${esc(d)}</div>` })));
  body.append(tiles);

  /* status switcher */
  const sw = h('div', { class: 'card', style: { marginTop: '14px', display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap' } });
  const seg = h('div', { class: 'seg' });
  COURSE_STATES.forEach(x => seg.append(h('button', { class: c.status === x.v ? 'on' : '', text: x.label, onclick: () => { c.status = x.v; commit(); } })));
  sw.append(seg, h('div', { class: 'spacer' }));
  if (c.cost && !paid) sw.append(h('button', { class: 'btn sm', html: `${icon('wallet', 13)} Log the ${money(c.cost)} fee`, onclick: () => billCourse(c) }));
  if (c.link) sw.append(h('a', { href: c.link, target: '_blank', rel: 'noopener', class: 'btn sm', html: `${icon('link', 13)} Open` }));
  body.append(sw);

  /* progress */
  const pc = h('div', { class: 'card', style: { marginTop: '14px' } });
  pc.append(h('div', { style: { display: 'flex', alignItems: 'baseline', gap: '8px' } },
    h('h3', { text: 'Progress', style: { margin: 0 } }), h('div', { class: 'spacer' }),
    h('span', { class: 'mono', style: { fontSize: '15px', fontWeight: 600 }, text: `${c.progress || 0}%` })));
  const range = h('input', { type: 'range', min: 0, max: 100, step: 5, style: { width: '100%', accentColor: 'var(--accent-fill)', marginTop: '10px' } });
  range.value = c.progress || 0;
  range.oninput = () => { c.progress = Number(range.value); save(); pc.querySelector('.mono').textContent = c.progress + '%'; pc.querySelector('.budget-bar i').style.width = c.progress + '%'; };
  range.onchange = () => { if (c.progress >= 100 && c.status !== 'done') { c.status = 'done'; toast('Marked as finished', 'check'); } commit(); };
  pc.append(h('div', { class: 'budget-bar', style: { height: '10px', marginTop: '10px' }, html: `<i style="width:${c.progress || 0}%;background:var(--s4)"></i>` }), range);
  body.append(pc);

  /* the reason — the whole point of this app */
  const rc = h('div', { class: 'card', style: { marginTop: '14px', borderColor: 'var(--border-strong)' } });
  rc.append(h('h3', { text: 'Why you enrolled' }));
  rc.append(h('div', { style: { whiteSpace: 'pre-wrap', lineHeight: '1.75', color: 'var(--text-2)' },
    text: c.reason || 'You did not write one down. Add it while you can still remember.' }));
  if (c.status === 'done') rc.append(h('div', { class: 'tiny', style: { marginTop: '12px' }, text: 'Finished — did it actually deliver that? Worth a line in Notes.' }));
  body.append(rc);




  /* General notes + structured session notes */
  c.sessions ||= [];

  const general = h('div', { class: 'card', style: { marginTop: '14px' } });
  const generalHead = h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
    h('h3',{text:'General notes',style:{margin:0}}),
    h('div',{class:'spacer'}),
    h('span',{class:'tiny',text:'Free-form notes'})
  );
  general.append(generalHead);
  let generalSaveTimer=null;
  const generalEditor = createRichNoteEditor(c.notes || '', v => {
    c.notes = v;
    clearTimeout(generalSaveTimer);
    generalSaveTimer=setTimeout(()=>{ c.notes=sanitizeNoteHTML(c.notes||''); save(); },700);
  });
  general.append(generalEditor);
  body.append(general);

  const sessionsCard = h('div',{class:'card course-sessions-card',style:{marginTop:'14px'}});
  const sessionsHead = h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
    h('div',{},
      h('h3',{text:'Session notes',style:{margin:0}}),
      h('div',{class:'tiny',text:'Keep each lesson / session in its own note.'})
    ),
    h('div',{class:'spacer'}),
    h('button',{class:'btn primary sm',html:`${icon('plus',13)} Add session`,onclick:async()=>{
      const num=c.sessions.length+1;
      const meta=await formModal('New session',[
        {k:'title',label:'Session title',required:true,placeholder:`Session ${num}`},
        {k:'date',label:'Date',type:'date'},
        {k:'link',label:'Session link',placeholder:'Google Drive, website, video, PDF…'}
      ],{title:`Session ${num}`,date:today(),link:''});
      if(meta){
        const body = await richNoteModal('Session notes', '');
        c.sessions.push({id:uid(),title:meta.title,date:meta.date||today(),link:meta.link||'',createdAt:new Date().toISOString(),body:body||''});
        commit();
      }
    }})
  );
  sessionsCard.append(sessionsHead);

  if(!c.sessions.length){
    sessionsCard.append(h('div',{class:'course-session-empty',html:`<div class="big">${icon('notes',30)}</div><div><strong>No sessions yet</strong><div class="tiny" style="margin-top:4px">Add Session 1 and keep every lesson separate.</div></div>`}));
  }else{
    const list=h('div',{class:'course-session-list'});
    const orderedSessions = [...c.sessions].sort((a,b)=>{
      const da = String(a.date || '').localeCompare(String(b.date || ''));
      if (da !== 0) return -da;
      return String(b.createdAt || b.id || '').localeCompare(String(a.createdAt || a.id || ''));
    });
    orderedSessions.forEach((ss,i)=>{
      const row=h('div',{class:'course-session'});
      const head=h('div',{class:'course-session-head'});
      const title=ss.title||`Session ${i+1}`;
      const initials=title.trim().slice(0,2).toUpperCase();
      const orb=h('div',{class:'session-orb',title:'Open and edit notes',onclick:async()=>{
        const body=await richNoteModal(`${title} — Rich Notes`,ss.body||'');
        if(body!==null){ss.body=body;commit();}
      }});
      orb.append(
        h('span',{class:'orb-dot'}),
        h('span',{class:'orb-title',text:initials.length<3?title:initials,dir:orbitDirection(title)})
      );
      head.append(
        orb,
        h('div',{class:'session-orb-date',text:ss.date?fmtDate(ss.date,{month:'short',day:'numeric',year:'numeric'}):`Session ${i+1}`}),
        h('div',{class:'session-orb-actions'},
          ss.link ? h('a',{class:'btn ghost sm course-session-actions-link',href:ss.link,target:'_blank',rel:'noopener noreferrer',html:`${icon('link',12)} Link`,onclick:e=>e.stopPropagation()}) : null,
          h('button',{class:'btn ghost sm',text:'Edit session',onclick:async()=>{
            const o=await formModal('Edit session',[
              {k:'title',label:'Session title',required:true},
              {k:'date',label:'Date',type:'date'},
              {k:'link',label:'Session link',placeholder:'Google Drive, website, video, PDF…'}
            ],{title:ss.title||`Session ${i+1}`,date:ss.date||today(),link:ss.link||''},{
              onDelete:async()=>{
                if(await confirmModal('Delete session?',`"${ss.title||`Session ${i+1}`}" will be removed.`)){
                  c.sessions=c.sessions.filter(x=>x.id!==ss.id); commit();
                }
              }
            });
            if(o){Object.assign(ss,{title:o.title,date:o.date||'',link:o.link||''});commit();}
          }}),
          h('button',{class:'btn primary sm',html:`${icon('edit',13)} Notes`,onclick:async()=>{
            const body=await richNoteModal(`${title} — Rich Notes`,ss.body||'');
            if(body!==null){ss.body=body;commit();}
          }})
        )
      );
      row.append(head);
      list.append(row);
    });
    sessionsCard.append(list);
  }
  body.append(sessionsCard);
}
</script>
<script>
/* ============================================================
   GOALS — this week, this month, this year

   Three horizons side by side, so the week can be checked against
   the year it is supposed to be serving.
   ============================================================ */

const SCOPES = [
  { k: 'week', label: 'This week', c: 'var(--accent)' },
  { k: 'month', label: 'This month', c: 'var(--plum)' },
  { k: 'year', label: 'This year', c: 'var(--s3)' },
];

function weekStartOf(d) {
  const dt = fromYmd(d), ws = DB.settings.weekStart || 0;
  return addDays(d, -(((dt.getDay() - ws) + 7) % 7));
}
function periodKey(scope, off) {
  const t = today();
  if (scope === 'week') return weekStartOf(addDays(t, (off || 0) * 7));
  if (scope === 'month') { const d = fromYmd(t); d.setDate(1); d.setMonth(d.getMonth() + (off || 0)); return ymd(d).slice(0, 7); }
  return String(fromYmd(t).getFullYear() + (off || 0));
}
function periodLabel(scope, key) {
  if (scope === 'week') {
    const end = addDays(key, 6), a = fromYmd(key), b = fromYmd(end);
    return `${MON[a.getMonth()]} ${a.getDate()} – ${MON[b.getMonth()]} ${b.getDate()}`;
  }
  if (scope === 'month') return `${MONTHS[+key.slice(5, 7) - 1]} ${key.slice(0, 4)}`;
  return key;
}
const goalsIn = (scope, key) => DB.goals.filter(g => g.scope === scope && g.period === key);

const GOAL_MEASURES = [
  ['time','Time / hours'], ['milestone','Milestones'], ['output','Output / deliverables'],
  ['numeric','Numeric result'], ['kpi','KPI / percentage'], ['binary','Binary outcome'], ['consistency','Consistency / frequency']
];
function goalKpiPct(g){
  const a=Number(g.kpiCurrent), b=Number(g.kpiTarget);
  if(!Number.isFinite(a)||!Number.isFinite(b)||b<=0) return null;
  return clamp(Math.round(a/b*100),0,100);
}
function goalMilestones(g){ return String(g.milestones||'').split('\n').map(x=>x.trim()).filter(Boolean); }

async function editGoal(g, scope, key) {
  const isNew = !g.id;
  ensureTaskCategories();
  const chosenScope = scope || g.scope || 'week';
  const chosenKey = key || g.period || periodKey(chosenScope, 0);
  const out = await formModal(isNew ? 'New goal' : 'Edit goal', [
    { k: 'title', label: 'Goal', required: true, placeholder: 'What must be true by the deadline?' },
    { k: 'categoryId', label: 'Category', type: 'select', options: [['', '— uncategorised —'], ...DB.projects.map(p => [p.id, p.name])] },
    { type: 'row', fields: [
      { k: 'startDate', label: 'Start date', type: 'date' },
      { k: 'deadline', label: 'Exact deadline', type: 'date', required: true }] },
    { type: 'row', fields: [
      { k: 'scope', label: 'Horizon', type: 'select', options: SCOPES.map(s => [s.k, s.label]) },
      { k: 'period', label: 'Planning period', hint: 'Used for weekly/monthly/yearly views.' }] },
    { k: 'measurement', label: 'How is success measured?', type: 'select', options: GOAL_MEASURES },
    { type: 'row', fields: [
      { k: 'kpiName', label: 'KPI name', placeholder: 'e.g. Focus hours, qualified leads, pages shipped' },
      { k: 'kpiUnit', label: 'Unit', placeholder: 'hours, %, leads, outputs…' }] },
    { type: 'row', fields: [
      { k: 'kpiCurrent', label: 'Current value', type: 'number', min: 0, step: 'any' },
      { k: 'kpiTarget', label: 'Target value', type: 'number', min: 0, step: 'any' }] },
    { type: 'row', fields: [
      { k: 'priority', label: 'Priority', type: 'select', options: PRI.map(p => [p.v, p.name]) },
      { k: 'reviewDate', label: 'Review date', type: 'date' }] },
    { k: 'milestones', label: 'Milestones', type: 'textarea', rows: 4, placeholder: 'One milestone per line. Example:\nResearch complete\nPrototype complete\nFirst user test' },
    { k: 'successCriteria', label: 'Definition of done', type: 'textarea', rows: 3, placeholder: 'What evidence would convince you this goal is actually achieved?' },
    { k: 'nextAction', label: 'Next action', placeholder: 'The smallest concrete action that moves this forward' },
    { k: 'blocker', label: 'Current blocker / risk', placeholder: 'Optional. Name the constraint, not a vague feeling.' },
    { k: 'why', label: 'Why this one', type: 'textarea', rows: 2, placeholder: 'Why does this matter?' },
  ], {
    scope: chosenScope, period: chosenKey, startDate: g.startDate || today(),
    deadline: g.deadline || goalDefaultDeadline(chosenScope, chosenKey),
    priority: g.priority ?? 0, categoryId: g.categoryId || '', measurement: g.measurement || 'output',
    kpiName: g.kpiName || '', kpiUnit: g.kpiUnit || '', kpiCurrent: g.kpiCurrent ?? '', kpiTarget: g.kpiTarget ?? '',
    reviewDate: g.reviewDate || '', milestones: g.milestones || '', successCriteria: g.successCriteria || '',
    nextAction: g.nextAction || '', blocker: g.blocker || '', ...g
  }, {
    onDelete: isNew ? null : async () => { DB.goals = DB.goals.filter(x => x.id !== g.id); commit(); toast('Goal deleted', 'trash'); }
  });
  if (!out) return;
  out.priority = Number(out.priority) || 0;
  if (isNew) DB.goals.push({ id: uid(), done: false, createdAt: today(), ...out });
  else Object.assign(DB.goals.find(x => x.id === g.id), out);
  commit();
}

function goalColumn(scope, st, re) {
  const s = SCOPES.find(x => x.k === scope);
  st.off ||= { week: 0, month: 0, year: 0 };
  const key = periodKey(scope, st.off[scope]);
  const list = goalsIn(scope, key);
  const done = list.filter(g => g.done).length;
  const pct = list.length ? Math.round(done / list.length * 100) : 0;

  const card = h('div', { class: 'card glass', style: { display: 'flex', flexDirection: 'column', gap: '10px', minHeight: '260px' } });
  const head = h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } });
  head.append(h('h3', { text: s.label, style: { margin: 0, fontSize: '14px', fontWeight: 700, color: s.c } }), h('div', { class: 'spacer' }),
    h('button', { class: 'btn ghost sm', html: icon('left', 13), onclick: () => { st.off[scope]--; re(); }, title: 'Earlier' }),
    h('button', { class: 'btn ghost sm', html: icon('right', 13), onclick: () => { st.off[scope]++; re(); }, title: 'Later' }));
  card.append(head);
  card.append(h('div', { class: 'tiny', text: periodLabel(scope, key) + (st.off[scope] ? '' : ' · now') }));

  const track = h('div', { style: { height: '7px', borderRadius: '99px', background: 'var(--line)', overflow: 'hidden' } });
  track.append(h('div', { style: { height: '100%', width: pct + '%', background: s.c, transition: 'width .3s' } }));
  card.append(track);
  card.append(h('div', { class: 'tiny', text: list.length ? `${done} of ${list.length} done · ${pct}%` : 'Nothing set yet' }));

  const box = h('div', { style: { flex: '1', display: 'flex', flexDirection: 'column', gap: '2px' } });
  list.slice().sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0)).forEach(g => {
    const row = h('div', { class: 'task' + (g.done ? ' done' : '') });
    const cb = h('button', { class: 'cbox' + (g.done ? ' on' : ''), html: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg>`, 'aria-label': 'Toggle' });
    cb.onclick = () => { g.done = !g.done; if (g.done) toast('One goal down', 'check'); commit(); };
    const mid = h('div', { style: { flex: '1', minWidth: 0, cursor: 'pointer' }, onclick: () => editGoal(g) });
    mid.append(h('div', { class: 'ttl', text: g.title }));
    const gm = h('div', { class: 'meta' });
    const gc = goalCategoryName(g);
    if (gc) {
      const gp = DB.projects.find(x => x.id === g.categoryId);
      gm.append(h('span', { class: 'chip', html: `<i class="dot" style="background:${gp?.color || 'var(--accent)'}"></i>${esc(gc)}` }));
    }
    gm.append(h('span', { class: 'due ' + (g.done ? '' : (goalDeadline(g) < today() ? 'over' : '')), text: goalDeadlineText(g) }));
    if (g.measurement) gm.append(h('span', { class: 'chip', text: GOAL_MEASURES.find(x=>x[0]===g.measurement)?.[1] || g.measurement }));
    const kp = goalKpiPct(g);
    if (kp != null) gm.append(h('span', { class: 'tiny', text: `${g.kpiName || 'KPI'} ${kp}%` }));
    else if (g.kpiTarget != null && g.kpiTarget !== '') gm.append(h('span', { class: 'tiny', text: `Target: ${g.kpiTarget}${g.kpiUnit ? ' '+g.kpiUnit : ''}` }));
    if (g.priority) gm.append(h('i', { class: 'pri', style: { background: PRI[g.priority].c }, title: PRI[g.priority].name }));
    if (g.why) gm.append(h('span', { class: 'tiny', text: g.why }));
    if (gm.children.length) mid.append(gm);
    row.append(cb, mid);
    box.append(row);
  });
  card.append(box);

  const qa = h('div', { class: 'quickadd', style: { padding: '0' } });
  const inp = h('input', { class: 'inp', placeholder: 'Add a goal…' });
  const add = () => {
    const v = inp.value.trim(); if (!v) return;
    DB.goals.push({ id: uid(), scope, period: key, title: v, why: '', categoryId: '', startDate: today(), deadline: goalDefaultDeadline(scope,key), priority: 0, measurement: 'output', kpiName: '', kpiUnit: '', kpiCurrent: '', kpiTarget: '', reviewDate: '', milestones: '', successCriteria: '', nextAction: '', blocker: '', done: false, createdAt: today() });
    inp.value = ''; commit(); toast('Goal added', 'check');
  };
  inp.onkeydown = e => { if (e.key === 'Enter') add(); };
  qa.append(inp, h('button', { class: 'btn primary', html: icon('plus', 15), onclick: add, title: 'Add' }));
  card.append(qa);
  return card;
}

const AppGoals = {
  id: 'goals', name: 'Goals', icon: 'pin', color: '#6b4ea8', w: 1000, h: 660,
  render(root, re, st) {
    DB.goals ||= [];
    const app = h('div', { class: 'app' });
    const head = h('div', { class: 'app-head' });
    head.append(h('h2', { text: 'Goals' }), h('div', { class: 'spacer' }),
      h('button', { class: 'btn primary sm', html: `${icon('plus', 14)} Goal`, onclick: () => editGoal({}, 'week') }));
    app.append(head);

    const body = h('div', { class: 'app-body' });
    const allOpen = DB.goals.filter(g => !g.done);
    const overdue = allOpen.filter(g => goalDeadline(g) && goalDeadline(g) < today()).length;
    const dated = allOpen.filter(g => goalDeadline(g)).sort((a,b) => goalDeadline(a).localeCompare(goalDeadline(b)));
    const nearest = dated[0];
    const summary = h('div', { class: 'goal-summary' });
    summary.innerHTML = `<div><span class="k">OPEN</span><strong>${allOpen.length}</strong><small>goals</small></div>
      <div><span class="k">OVERDUE</span><strong style="color:${overdue ? 'var(--crit)' : 'var(--good)'}">${overdue}</strong><small>${overdue ? 'need attention' : 'nothing late'}</small></div>
      <div><span class="k">NEXT DEADLINE</span><strong>${nearest ? esc(goalDeadlineText(nearest).split(' · ')[0]) : '—'}</strong><small>${nearest ? esc(nearest.title) : 'Set a goal with a date'}</small></div>`;
    body.append(summary);

    const openW = goalsIn('week', periodKey('week', 0)).filter(g => !g.done).length;
    const openY = goalsIn('year', periodKey('year', 0)).filter(g => !g.done).length;
    body.append(h('div', { class: 'tiny', style: { marginBottom: '12px' },
      text: openW ? `${openW} thing${openW === 1 ? '' : 's'} left this week${openY ? ` · ${openY} still open for the year` : ''}` : 'The week is clear. Set the next one.' }));
    const kpiGoals = allOpen.filter(g => goalKpiPct(g) != null);
    if (kpiGoals.length) {
      const kpiStrip = h('div', { class: 'goal-kpi-strip' });
      kpiGoals.slice(0,4).forEach(g => { const pct=goalKpiPct(g); kpiStrip.append(h('div',{class:'goal-kpi-mini',html:`<div class="goal-kpi-top"><span>${esc(g.kpiName||g.title)}</span><strong>${pct}%</strong></div><div class="goal-kpi-bar"><i style="width:${pct}%"></i></div>`})); });
      body.append(kpiStrip);
    }

function ensureBodyTracker(){
  DB.bodyTracker ||= { proteinTarget:'', weightTarget:'', entries:[] };
  DB.bodyTracker.entries ||= [];
  return DB.bodyTracker;
}
function bodyLatest(){
  const b=ensureBodyTracker();
  return b.entries.slice().sort((a,z)=>String(z.date).localeCompare(String(a.date)))[0] || null;
}
function bodyPrev(){
  const b=ensureBodyTracker();
  return b.entries.slice().sort((a,z)=>String(z.date).localeCompare(String(a.date)))[1] || null;
}
function bodyNum(v){ return v==='' || v==null ? null : Number(v); }
function bodyDelta(a,b){
  if(a==null||b==null||!Number.isFinite(a)||!Number.isFinite(b)) return '—';
  const d=a-b; return `${d>0?'+':''}${d.toFixed(1)}`;
}
async function editBodyEntry(e={}){

    {type:'row',fields:[{k:'date',label:'Date',type:'date'},{k:'weight',label:'Weight (kg)',type:'number',min:0,step:'0.1'}]},

    {k:'notes',label:'Notes',type:'textarea',rows:2,placeholder:'Training, food, cycle, sleep, travel, or anything that explains the numbers.'}
  ],{date:today(),...e},{onDelete:e.id?async()=>{DB.bodyTracker.entries=DB.bodyTracker.entries.filter(x=>x.id!==e.id);commit();toast('Check-in deleted','trash')}:null});
  if(!out)return;
  Object.keys(out).forEach(k=>{if(['weight','protein','waist','stomach','hip','arm','thigh'].includes(k))out[k]=bodyNum(out[k]);});
  if(e.id) Object.assign(DB.bodyTracker.entries.find(x=>x.id===e.id),out);
  else DB.bodyTracker.entries.push({id:uid(),createdAt:today(),...out});

    [['dark', 'Dark'], ['light', 'Light']].forEach(([k, l]) => themeSeg.append(h('button', { class: s.theme === k ? 'on' : '', text: l, onclick: () => { s.theme = k; applySettings(); commit(); } })));
    const accRow = h('div', { class: 'color-grid' });
    ACCENTS.forEach(([c, nm]) => accRow.append(h('button', {
      class: 'color-opt' + (s.accent === c ? ' active' : ''), title: nm,
      html: `<i class="swatch" style="background:${c}"></i><span class="cname">${esc(nm)}</span>`,
      onclick: () => { s.accent = c; applySettings(); commit(); }
    })));
    const wallSeg = h('div', { class: 'seg' });
    WALLS.forEach(([k, l]) => wallSeg.append(h('button', { class: s.wall === k ? 'on' : '', text: l, onclick: () => { s.wall = k; applySettings(); commit(); } })));
    body.append(sec('Look', setField('Theme', themeSeg), setField('Accent', accRow), setField('Desktop', wallSeg)));

    const curI = h('input', { class: 'inp', value: s.currency, placeholder: '$', maxlength: 4 });

    const wsSel = h('select', { class: 'inp' });
    DOW.forEach((d, i) => wsSel.append(h('option', { value: i, text: d })));
    wsSel.value = s.weekStart;
    wsSel.onchange = () => { s.weekStart = +wsSel.value; commit(); };
    body.append(sec('Regional', setField('Currency symbol', curI), setField('Week starts on', wsSel)));


    /* ---------- Google ---------- */
    const gcard = h('div', { class: 'card', style: { marginBottom: '14px' } });
    gcard.append(h('h3', { html: `${icon('cloud', 14)} Google Calendar &amp; Drive` }));
    if (!G.originOk) {
      gcard.append(h('div', { class: 'tiny', style: { lineHeight: '1.65' }, html:
        `Google will only talk to a page served over <strong>https</strong>, and this file is open straight from your disk (<code>${esc(location.protocol)}</code>).
         That is Google's rule, not a limitation of Orbit.<br><br>
         <strong>To turn it on:</strong> put this one file on any free static host — GitHub Pages, Netlify Drop, Cloudflare Pages — then open it from that https link
         on your laptop <em>and</em> your phone. Come back to this panel there and the fields below will work.<br><br>
         Until then, everything still works offline, and <strong>Import .ics</strong> / <strong>Import CSV</strong> bring your Google data in by hand.` }));
    } else {
      const cid = h('input', { class: 'inp', value: s.googleClientId || '', placeholder: '1234567890-abcdef.apps.googleusercontent.com', spellcheck: 'false' });
      cid.oninput = () => { s.googleClientId = cid.value.trim(); save(); };
      gcard.append(h('label', { class: 'fld' }, h('span', { class: 'lb', text: 'OAuth Client ID' }), cid,
        h('div', { class: 'tiny', style: { marginTop: '4px' }, html: `Create one free at <strong>console.cloud.google.com</strong> → APIs &amp; Services → Credentials → OAuth client ID → Web application, and add <code>${esc(location.origin)}</code> as an authorised JavaScript origin.` })));

      const status = h('div', { class: 'tiny', style: { marginBottom: '10px' } });
      status.innerHTML = s.googleOn
        ? `<span style="color:${gNeedsSignin ? 'var(--warn)' : 'var(--good)'}">●</span> ${gNeedsSignin ? 'Signed out — click Sync now to sign in again' : 'Connected'}${G.email ? ' as ' + esc(G.email) : ''}${s.gLast ? ' · last synced ' + esc(new Date(s.gLast).toLocaleString()) : ''}`
        : 'Not connected.';
      gcard.append(status);

      const toggles = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px', marginBottom: '12px' } });
      [['gCal', 'Sync my Google Calendar (both ways)'], ['gDrive', 'Keep all Orbit data in sync via Google Drive']].forEach(([k, label]) => {
        const id = 'tg-' + k;

      });
      gcard.append(toggles);

      /* which of your Google calendars belong in Orbit */
      if (s.googleOn && (DB.gcals || []).length) {
        const cw = h('div', { style: { marginBottom: '12px', border: '1px solid var(--border)', borderRadius: 'var(--r-sm)', overflow: 'hidden' } });
        cw.append(h('div', { style: { padding: '8px 11px', background: 'var(--surface-3)', fontSize: '11.5px', fontWeight: 700, letterSpacing: '.04em', textTransform: 'uppercase', color: 'var(--muted)' },
          text: `Your Google calendars — ${DB.gcals.filter(c => c.sync !== false).length} of ${DB.gcals.length} syncing` }));
        const list = h('div', { style: { maxHeight: '210px', overflow: 'auto', padding: '5px' } });
        DB.gcals.forEach(c => {
          const row = h('label', { style: { display: 'flex', alignItems: 'center', gap: '9px', padding: '5px 7px', borderRadius: '6px', cursor: 'pointer', fontSize: '13px' } });
          const cb = h('input', { type: 'checkbox' });
          cb.checked = c.sync !== false;
          cb.onchange = () => { c.sync = cb.checked; commit(); };
          row.append(cb,
            h('i', { style: { width: '11px', height: '11px', borderRadius: '3px', background: c.color, flex: '0 0 auto' } }),
            h('span', { text: c.name, style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: '1' } }),
            c.readOnly ? h('span', { class: 'tiny', text: 'read-only' }) : null,
            c.primary ? h('span', { class: 'tiny', text: 'main' }) : null);
          list.append(row);
        });
        cw.append(list);
        gcard.append(cw);

        const writable = DB.gcals.filter(c => !c.readOnly);
        if (writable.length) {
          const sel = h('select', { class: 'inp' });
          writable.forEach(c => sel.append(h('option', { value: c.id, text: c.name })));
          sel.value = s.gWriteCal || writable[0].id;
          sel.onchange = () => { s.gWriteCal = sel.value; commit(); };
          gcard.append(h('label', { class: 'fld' }, h('span', { class: 'lb', text: 'New events go to' }), sel));
        }
      }

      const acts = h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } });
      if (!s.googleOn) acts.append(h('button', { class: 'btn primary', html: `${icon('link', 14)} Connect Google`, onclick: googleConnect }));
      else {
        acts.append(h('button', { class: 'btn primary', html: `${icon('reset', 14)} Sync now`, onclick: () => googleSync({ fromClick: true }) }));
        acts.append(h('button', { class: 'btn', html: `${icon('x', 14)} Disconnect`, onclick: () => { G.disconnect(); toast('Disconnected from Google', 'x'); } }));
      }
      gcard.append(acts);
      if (G.lastError) {
        const ex = gExplain(G.lastError);
        const box = h('div', { style: { marginTop: '10px', padding: '10px 12px', borderRadius: 'var(--r-sm)', background: 'var(--surface-3)', border: '1px solid var(--border)' } });
        box.append(h('div', { style: { fontSize: '12.5px', fontWeight: 600, color: 'var(--crit)' }, text: ex.short }));
        if (ex.fix) box.append(h('div', { class: 'tiny', style: { marginTop: '4px' }, text: ex.fix }));
        (ex.links || []).forEach(l => box.append(h('div', { style: { marginTop: '6px' } },
          h('a', { href: l, target: '_blank', rel: 'noopener', class: 'tiny', style: { color: 'var(--accent)', wordBreak: 'break-all' }, text: l }))));
        gcard.append(box);
      }
      gcard.append(h('div', { class: 'tiny', style: { marginTop: '10px' }, html:
        'Orbit reads <strong>every</strong> calendar you tick above, not just the main one, and keeps each event in its own colour. Drive sync uses the app-private folder, so Orbit can only ever see the one file it created — not the rest of your Drive. Whichever device saved most recently wins.' }));
    }
    body.append(gcard);

    const dataRow = h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } });
    dataRow.append(
      h('button', { class: 'btn', html: `${icon('upload', 14)} Export backup`, onclick: () => { downloadFile(`orbit-backup-${today()}.json`, JSON.stringify(DB, null, 2)); toast('Backup downloaded', 'upload'); } }),
      h('button', { class: 'btn', html: `${icon('download', 14)} Restore backup`, onclick: async () => {
        const f = await pickFile('.json,application/json'); if (!f) return;
        try {
          const p = JSON.parse(f.text);
          if (!p || typeof p !== 'object' || !('tasks' in p || 'events' in p)) throw 0;
          DB = Object.assign(DEFAULTS(), p);
          migrate();
          DB.settings = Object.assign(DEFAULTS().settings, p.settings || {});
          save(); applySettings(); refresh(); toast('Backup restored', 'download');
        } catch (e) { toast('That file is not an Orbit backup', 'x'); }
      } }),
      h('button', { class: 'btn', html: `${icon('reset', 14)} Restore the copy inside this file`,
        title: 'Every build of Orbit carries a snapshot of your data. Use this if a fresh browser starts blank.',
        onclick: async () => {
          if (!embeddedSnapshot()) return toast('This build has no snapshot inside it', 'x');
          if (await confirmModal('Restore the built-in copy?', 'Everything currently in this browser is replaced by the snapshot baked into this file. Export a backup first if you are unsure.', 'Restore')) {
            restoreSnapshot(); applySettings(); refresh();
          }
        } }),
      h('button', { class: 'btn danger', html: `${icon('trash', 14)} Remove sample data only`, title: 'Deletes the invented starter content and nothing else', onclick: async () => {
        const f = sampleFound();
        if (!f.total) return toast('No sample data found — you are clean', 'check');
        if (await confirmModal('Remove the sample data?', `${f.total} invented entries will go. Everything you wrote yourself, and everything synced from Google, stays.`, 'Remove it')) {
          removeSample(); toast(`Removed ${f.total} entries`, 'trash');
          if (DB.settings.googleOn) googleSync({ silent: true });
        }
      } }),
      h('button', { class: 'btn', html: `${icon('bolt', 14)} Load sample data`, title: 'Fills Orbit with example content so you can see how it works', onclick: async () => {
        if (await confirmModal('Load sample data?', 'This replaces everything currently in Orbit with example content. Your theme and Google connection stay as they are.', 'Load it')) {
          seed(); DB.settings.sampleDismissed = false; applySettings(); refresh(); toast('Sample data loaded', 'bolt');
        }
      } }),
      h('button', { class: 'btn danger', html: `${icon('trash', 14)} Clear all content`, onclick: async () => {
        if (await confirmModal('Clear everything you have written?',
          'Every event, task, note, habit, entry and trip goes. Your theme, currency and Google connection stay. Anything that lives in your Google Calendar will come back on the next sync.', 'Clear it')) {
          clearContent(); toast('Cleared. Blank slate.', 'reset');
        }
      } }),
      h('button', { class: 'btn danger', html: `${icon('x', 14)} Reset Orbit completely`, title: 'Also forgets your Google Client ID and disconnects', onclick: async () => {
        if (await confirmModal('Reset Orbit completely?', 'This also forgets your Google Client ID and disconnects your account. You would have to set that up again. Export a backup first if you are not sure.', 'Reset everything')) {
          Vault.wipe(); G.forget(); DB = DEFAULTS(); save(); applySettings(); refresh(); toast('Reset. Fresh start.', 'reset');
        }
      } }));
    const storeNote = h('div', { class: 'tiny', style: { marginTop: '10px' } , text: Vault.persistent
      ? 'Your data is stored in this browser only — nothing is sent anywhere. Keep the .html file and use the same browser, and it stays. Export a backup now and then.'
      : 'Heads up: this browser is blocking local storage, so data will only last until you close the tab. Download the file and open it directly, or export a backup before you leave.' });
    body.append(sec('Your data', dataRow, storeNote));

    const counts = h('div', { class: 'tiny', html:
      `${DB.events.length} events · ${DB.tasks.length} tasks · ${DB.notes.length} notes · ${DB.journal.length} journal entries · ${DB.habits.length} habits · ${DB.txns.length} transactions · ${DB.trips.length} trips · ${DB.courses.length} courses · ${DB.goals.length} goals · ${DB.sessions.length} focus sessions<br><span style="opacity:.7">Build ${esc(BUILD)}</span>` });
    body.append(sec('In here right now', counts));

    body.append(h('div', { class: 'tiny', style: { textAlign: 'center', padding: '10px' }, html: 'Orbit · one HTML file · works offline · <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>K</kbd> to search' }));
    app.append(body); root.append(app);
  }
};
</script>
<script>
/* ============================================================
   GOOGLE — Calendar (all of them, two-way) + Drive (data sync)

   Everything runs in the browser. Google Identity Services hands us an
   access token and we call the REST APIs directly. No server, no secret.
   Google only allows this from an https origin (or localhost).

   The token is cached in this browser for its ~1 hour life, so a reload
   or a background sync never needs to open a window. Popups are only
   ever opened straight out of a real click.
   ============================================================ */
const TOKEN_KEY = 'orbit.gtoken';

const G = {
  SCOPES: 'https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/drive.appdata openid email',
  token: null, expiry: 0, client: null, email: '', lastError: '',

  get clientId() { return (DB.settings.googleClientId || '').trim(); },
  get originOk() { return location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname); },
  get connected() { return !!this.token && Date.now() < this.expiry; },

  restore() {
    try {
      const t = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null');
      if (t && t.exp > Date.now() + 60000) { this.token = t.tok; this.expiry = t.exp; this.email = t.email || ''; }
    } catch (e) {}
  },
  remember() { try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ tok: this.token, exp: this.expiry, email: this.email })); } catch (e) {} },
  forget() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} },

  loadSdk() {
    if (window.google?.accounts?.oauth2) return Promise.resolve();
    if (this._sdk) return this._sdk;
    this._sdk = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true; s.defer = true;
      s.onload = res;
      s.onerror = () => rej(new Error('Could not reach Google — check your connection.'));
      document.head.append(s);
    });
    return this._sdk;
  },

  /* Only ever called straight out of a click. */
  async auth() {
    if (this.connected) return this.token;
    if (!this.originOk) throw new Error('Google needs an https address. See Settings → Google.');
    if (!this.clientId) throw new Error('Paste your Google Client ID in Settings → Google first.');
    await this.loadSdk();
    return new Promise((resolve, reject) => {
      this.client = google.accounts.oauth2.initTokenClient({
        client_id: this.clientId,
        scope: this.SCOPES,
        callback: r => {
          if (r.error) { this.lastError = r.error_description || r.error; return reject(new Error(this.lastError)); }
          this.token = r.access_token;
          this.expiry = Date.now() + (Number(r.expires_in || 3500) - 180) * 1000;
          this.remember();
          resolve(this.token);
        },
        error_callback: e => {
          const t = e?.type || '';
          if (t === 'popup_failed_to_open') return reject(new Error('POPUP_BLOCKED'));
          if (t === 'popup_closed') return reject(new Error('Sign-in window was closed before you finished.'));
          reject(new Error(e?.message || 'Sign-in failed.'));
        }
      });
      this.client.requestAccessToken();
    });
  },

  disconnect() {
    try { if (this.token) google.accounts.oauth2.revoke(this.token, () => {}); } catch (e) {}
    this.token = null; this.expiry = 0; this.email = '';
    this.forget();
    DB.settings.googleOn = false; commit();
  },

  /* Never opens a popup — throws NEEDS_SIGNIN and lets the UI ask for a click. */
  async api(url, opts = {}) {
    if (!this.connected) throw new Error('NEEDS_SIGNIN');
    const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + this.token, ...(opts.headers || {}) } });
    if (r.status === 401) { this.token = null; this.expiry = 0; this.forget(); throw new Error('NEEDS_SIGNIN'); }
    if (!r.ok) {
      let msg = r.status + ' ' + r.statusText;
      try { const j = await r.json(); msg = j.error?.message || msg; } catch (e) {}
      if (r.status === 403 && /has not been used in project|is disabled/i.test(msg)) throw new Error('API_OFF:' + msg);
      if (r.status === 403 && /insufficient|scope/i.test(msg)) throw new Error('SCOPE_MISSING');
      throw new Error(msg);
    }
    return r.status === 204 ? null : r.json();
  },

  async whoami() {
    try { const j = await this.api('https://www.googleapis.com/oauth2/v3/userinfo'); this.email = j.email || ''; this.remember(); } catch (e) {}
  },

  /* ---------- the calendar list ----------
     A Google account usually has many calendars, not one. We read them all
     and let you tick which ones belong in Orbit. */
  async fetchCalendars() {
    const r = await this.api('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=250&showHidden=false');
    const prev = new Map((DB.gcals || []).map(c => [c.id, c]));
    DB.gcals = (r.items || []).map(c => ({
      id: c.id,
      name: c.summaryOverride || c.summary || c.id,
      color: c.backgroundColor || '#7b3f92',
      readOnly: !['owner', 'writer'].includes(c.accessRole),
      primary: !!c.primary,
      /* first time we see a calendar: sync it, unless it is a holiday feed */
      sync: prev.has(c.id) ? prev.get(c.id).sync : !/holiday|#contacts|birthday/i.test(c.id),
    })).sort((a, b) => (b.primary ? 1 : 0) - (a.primary ? 1 : 0) || a.name.localeCompare(b.name));
    if (!DB.settings.gWriteCal || !DB.gcals.some(c => c.id === DB.settings.gWriteCal && !c.readOnly)) {
      DB.settings.gWriteCal = (DB.gcals.find(c => c.primary && !c.readOnly) || DB.gcals.find(c => !c.readOnly) || {}).id || 'primary';
    }
    return DB.gcals;
  },

  /* ---------- event mapping ---------- */
  toLocal(ev, calId) {
    const allDay = !!ev.start?.date;
    const startISO = ev.start?.dateTime || ev.start?.date;
    const endISO = ev.end?.dateTime || ev.end?.date;
    const hhmm = x => { const t = new Date(x); return pad(t.getHours()) + ':' + pad(t.getMinutes()); };
    return {
      gid: ev.id, gcal: calId, gUpdated: ev.updated,
      title: ev.summary || '(no title)',
      date: allDay ? String(ev.start.date) : ymd(new Date(startISO)),
      start: allDay ? '' : hhmm(startISO),
      end: allDay || !ev.end?.dateTime ? '' : hhmm(endISO),
      allDay, loc: ev.location || '', notes: (ev.description || '').slice(0, 1500),
      cal: 'gcal', dirty: false,
    };
  },
  toGoogle(e) {
    const body = { summary: e.title, location: e.loc || '', description: e.notes || '' };
    if (e.allDay || !e.start) {
      body.start = { date: e.date };
      body.end = { date: addDays(e.date, 1) };
    } else {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const end = e.end && e.end > e.start ? e.end : e.start;
      body.start = { dateTime: `${e.date}T${e.start}:00`, timeZone: tz };
      body.end = { dateTime: `${e.date}T${end}:00`, timeZone: tz };
    }
    return body;
  },

  /* ---------- the calendar sync ---------- */
  async syncCalendar(onProgress = () => {}) {
    if (!DB.gcals || !DB.gcals.length) await this.fetchCalendars();
    const cals = (DB.gcals || []).filter(c => c.sync !== false);
    const writable = new Set(DB.gcals.filter(c => !c.readOnly).map(c => c.id));
    let pushed = 0, pulled = 0, removed = 0;
    const failures = [];
    const justPushed = new Set();   // never sweep away what we only just created

    /* 1 — local deletions go up first */
    for (const t of (DB.gTrash || []).slice()) {
      const cal = t.cal || DB.settings.gWriteCal || 'primary';
      try { await this.api(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal)}/events/${encodeURIComponent(t.gid)}`, { method: 'DELETE' }); } catch (e) { if (e.message === 'NEEDS_SIGNIN') throw e; }
      DB.gTrash = DB.gTrash.filter(x => x.gid !== t.gid);
    }

    /* 2 — local creates and edits */
    for (const e of DB.events.filter(x => x.dirty)) {
      const cal = (e.gcal && writable.has(e.gcal)) ? e.gcal : (DB.settings.gWriteCal || 'primary');
      const body = this.toGoogle(e);
      try {
        if (e.gid) {
          const r = await this.api(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal)}/events/${encodeURIComponent(e.gid)}`,
            { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          e.gUpdated = r.updated;
        } else {
          const r = await this.api(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal)}/events`,
            { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          e.gid = r.id; e.gcal = cal; e.gUpdated = r.updated; e.cal = 'gcal';
        }
        justPushed.add(e.gid);
        e.dirty = false; pushed++;
      } catch (err) { if (err.message === 'NEEDS_SIGNIN') throw err; failures.push(err.message); }
    }

    /* 3 — pull every calendar you ticked */
    const lo = addDays(today(), -180), hi = addDays(today(), 365);
    const timeMin = new Date(fromYmd(lo)).toISOString();
    const timeMax = new Date(fromYmd(hi)).toISOString();
    const seen = new Set();
    const byGid = new Map(DB.events.filter(e => e.gid).map(e => [e.gid, e]));

    for (let i = 0; i < cals.length; i++) {
      const cal = cals[i];
      onProgress(`${i + 1}/${cals.length} · ${cal.name}`);
      let pageToken = '';
      try {
        do {
          const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events`
            + `?singleEvents=true&orderBy=startTime&maxResults=250`
            + `&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}`
            + (pageToken ? `&pageToken=${pageToken}` : '');
          const r = await this.api(url);
          (r.items || []).forEach(ev => {
            if (ev.status === 'cancelled') return;
            seen.add(ev.id);
            const inc = this.toLocal(ev, cal.id);
            const local = byGid.get(ev.id);
            if (!local) { const n = { id: uid(), ...inc }; DB.events.push(n); byGid.set(ev.id, n); pulled++; }
            else if (local.gUpdated !== inc.gUpdated || local.gcal !== cal.id) { Object.assign(local, inc); pulled++; }
          });
          pageToken = r.nextPageToken || '';
        } while (pageToken);
      } catch (err) {
        if (err.message === 'NEEDS_SIGNIN' || String(err.message).startsWith('API_OFF')) throw err;
        failures.push(`${cal.name}: ${err.message}`);
      }
    }

    /* 4 — anything that came from a synced calendar, sits in the window,
           and is no longer there was deleted on Google's side */
    const syncedIds = new Set(cals.map(c => c.id));
    const before = DB.events.length;
    DB.events = DB.events.filter(e =>
      !(e.gid && syncedIds.has(e.gcal) && !seen.has(e.gid) && !justPushed.has(e.gid)
        && e.date >= lo && e.date <= hi && !e.dirty));
    removed = before - DB.events.length;

    return { pushed, pulled, removed, calendars: cals.length, failures };
  },

  /* ---------- Drive (appDataFolder) ---------- */
  FILE: 'orbit-data.json',
  async findFile() {
    const r = await this.api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)&q=${encodeURIComponent("name='" + this.FILE + "'")}`);
    return (r.files || [])[0] || null;
  },
  async readFile(id) {
    if (!this.connected) throw new Error('NEEDS_SIGNIN');
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers: { Authorization: 'Bearer ' + this.token } });
    if (r.status === 401) { this.token = null; this.forget(); throw new Error('NEEDS_SIGNIN'); }
    if (!r.ok) throw new Error('Could not read the backup in Drive.');
    return r.json();
  },
  async writeFile(id) {
    if (!this.connected) throw new Error('NEEDS_SIGNIN');
    const tok = this.token;
    const payload = JSON.stringify(DB);
    if (id) {
      const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
        method: 'PATCH', headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' }, body: payload });
      if (!r.ok) throw new Error(r.status === 401 ? 'NEEDS_SIGNIN' : 'Could not save to Drive.');
      return id;
    }
    const boundary = 'orbit' + uid();
    const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`
      + JSON.stringify({ name: this.FILE, parents: ['appDataFolder'] })
      + `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n--${boundary}--`;
    const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST', headers: { Authorization: 'Bearer ' + tok, 'Content-Type': `multipart/related; boundary=${boundary}` }, body });
    if (!r.ok) throw new Error(r.status === 401 ? 'NEEDS_SIGNIN' : 'Could not create the file in Drive.');
    return (await r.json()).id;
  },

  async syncDrive(force) {
    const f = await this.findFile();
    if (!f) { DB.driveId = await this.writeFile(null); return { dir: 'up', first: true }; }
    DB.driveId = f.id;
    let remote = null;
    try { remote = await this.readFile(f.id); } catch (e) { if (e.message === 'NEEDS_SIGNIN') throw e; remote = null; }

    /* ---- guards, so a blank or half-loaded copy can never wipe Drive ---- */
    const mine = dbSize(DB), theirs = dbSize(remote);
    const newer = remote && (remote.savedAt || '') > (DB.savedAt || '');
    /* this browser has (almost) nothing and Drive has plenty: always take Drive */
    const takeTheirs = remote && theirs > 0 && (mine === 0 || newer);
    /* this browser lost a lot compared with Drive: hold, do not upload over it */
    const suspicious = remote && theirs >= 8 && mine < theirs * 0.5;

    if (!takeTheirs && suspicious && !force) return { dir: 'hold', mine, theirs };

    if (takeTheirs) {
      const keepId = DB.settings.googleClientId;
      try { localStorage.setItem('orbit.os.v1.prev', JSON.stringify(DB)); } catch (e) {}
      DB = Object.assign(DEFAULTS(), remote);
      migrate();
      restoreCourseNotesLocal();
      DB.settings = Object.assign(DEFAULTS().settings, remote.settings || {});
      DB.settings.googleClientId = keepId || DB.settings.googleClientId;
      DB.driveId = f.id;
      Vault.save(JSON.stringify(DB));
      return { dir: 'down' };
    }
    await this.writeFile(f.id);
    return { dir: 'up' };
  },
};

/* how much is actually in a database — used to refuse dangerous overwrites */
function dbSize(p) {
  if (!p || typeof p !== 'object') return 0;
  return ['events', 'tasks', 'notes', 'habits', 'txns', 'trips', 'courses', 'wishlist', 'goals', 'projects', 'journal', 'bodyTracker']
    .reduce((a, k) => a + ((p[k] || []).length), 0) + (((p.vision || {}).pillars || []).length);
}

/* Drive holds more than this browser: never silently push the smaller one */
async function driveHoldWarning(r) {
  toast('Drive has more data than this browser — nothing was overwritten', 'bolt');
  const ok = await confirmModal('Drive has more than this copy',
    `Google Drive holds ${r.theirs} items, this browser has ${r.mine}. Orbit did not upload, so nothing in Drive was lost.\n\nPull the Drive copy down into this browser?`,
    'Pull from Drive');
  if (!ok) {
    DB.settings.forceUp = true; save();
    toast('Fine — press Sync now once more and this browser will overwrite Drive', 'cloud');
    return;
  }
  try {
    const f = await G.findFile();
    const remote = await G.readFile(f.id);
    const keepId = DB.settings.googleClientId;
    try { localStorage.setItem('orbit.os.v1.prev', JSON.stringify(DB)); } catch (e) {}
    DB = Object.assign(DEFAULTS(), remote);
    migrate();
    restoreCourseNotesLocal();
    DB.settings = Object.assign(DEFAULTS().settings, remote.settings || {});
    DB.settings.googleClientId = keepId || DB.settings.googleClientId;
    DB.driveId = f.id;
    Vault.save(JSON.stringify(DB));
    applySettings(); refresh();
    toast('Pulled your data down from Drive', 'download');
  } catch (e) { showSyncError(e.message); }
}

/* ============================================================
   The one entry point the UI calls
   ============================================================ */
let gSyncing = false, gNeedsSignin = false, gProgress = '';

function gExplain(msg) {
  const m = String(msg || '');
  if (m === 'NEEDS_SIGNIN') return { short: 'Your Google session expired', fix: 'Sessions last about an hour. Click Sync now and approve once — after that it stays quiet for another hour.' };
  if (m === 'POPUP_BLOCKED') return { short: 'Your browser blocked the Google window', fix: 'Click the blocked-popup icon in the address bar, choose "Always allow pop-ups from this site", then try again.' };
  if (m === 'SCOPE_MISSING') return { short: 'Calendar or Drive permission was not granted', fix: 'Disconnect, then Connect again and tick EVERY checkbox on the Google permission screen.' };
  if (m.startsWith('API_OFF:')) {
    const pid = (m.match(/project (\d+)/) || [])[1] || '';
    return {
      short: 'A Google API is switched off for this project',
      fix: 'Open these two links, press ENABLE on each, wait a minute, then sync again:',
      links: pid ? [
        `https://console.cloud.google.com/apis/library/calendar-json.googleapis.com?project=${pid}`,
        `https://console.cloud.google.com/apis/library/drive.googleapis.com?project=${pid}`
      ] : []
    };
  }
  if (/redirect_uri_mismatch|origin/i.test(m)) return { short: 'This address is not registered on your Client ID', fix: `Add ${location.origin} under "Authorised JavaScript origins", then reload.` };
  if (/access_denied/i.test(m)) return { short: 'Google refused access', fix: 'Add your own email under OAuth consent screen → Audience → Test users.' };
  return { short: m, fix: '' };
}

async function googleSync({ silent = false, fromClick = false } = {}) {
  if (gSyncing || !DB.settings.googleOn) return;

  /* A popup may only open from a real click — never from a timer. */
  if (!G.connected) {
    if (!fromClick) { gNeedsSignin = true; paintSyncBadge(); return; }
    try { await G.auth(); } catch (e) { showSyncError(e.message); return; }
  }
  gNeedsSignin = false;
  gSyncing = true; gProgress = ''; paintSyncBadge();

  const notes = [];
  let warn = [];
  try {
    if (!G.email) await G.whoami();
    await G.fetchCalendars();

    if (DB.settings.gCal !== false) {
      const r = await G.syncCalendar(p => { gProgress = p; paintSyncBadge(); });
      notes.push(`${r.pulled} event${r.pulled === 1 ? '' : 's'} in from ${r.calendars} calendar${r.calendars === 1 ? '' : 's'}`
        + (r.pushed ? `, ${r.pushed} out` : '') + (r.removed ? `, ${r.removed} removed` : ''));
      warn = r.failures || [];
    }

    /* the pull changed local data — stamp it BEFORE Drive decides who wins,
       otherwise Drive would overwrite what we just fetched */
    save();

    if (DB.settings.gDrive !== false) {
      const r = await G.syncDrive(fromClick && DB.settings.forceUp);
      if (r.dir === 'hold') {
        notes.push('Drive left untouched');
        driveHoldWarning(r);
      } else {
        if (DB.settings.forceUp) { DB.settings.forceUp = false; }
        notes.push(r.dir === 'down' ? 'pulled newer data from Drive' : (r.first ? 'Drive backup created' : 'saved to Drive'));
      }
    }

    G.lastError = '';
    DB.settings.gLast = new Date().toISOString();
    save(); refresh();
    if (!silent) {
      toast('Synced — ' + notes.join(' · '), 'cloud');
      if (warn.length) setTimeout(() => toast(`${warn.length} calendar(s) could not be read`, 'bolt'), 2400);
    }
  } catch (e) {
    if (e.message === 'NEEDS_SIGNIN') gNeedsSignin = true;
    G.lastError = e.message;
    if (!silent) showSyncError(e.message);
  } finally { gSyncing = false; gProgress = ''; paintSyncBadge(); refresh(); }
}

function showSyncError(msg) {
  const ex = gExplain(msg);
  toast('Sync failed: ' + ex.short, 'x');
  if (!ex.fix) return;
  const body = h('div', {}, h('div', { text: ex.fix, style: { color: 'var(--text-2)', lineHeight: '1.7' } }));
  (ex.links || []).forEach(u => body.append(h('div', { style: { marginTop: '10px' } },
    h('a', { href: u, target: '_blank', rel: 'noopener', style: { color: 'var(--accent)', fontSize: '12.5px', wordBreak: 'break-all' }, text: u }))));
  body.append(h('div', { class: 'tiny', style: { marginTop: '14px' }, html: 'Google said:<br>' + esc(String(msg).replace(/^API_OFF:/, '')) }));
  modal({
    title: ex.short, bodyNode: body,
    footNode: h('div', { style: { display: 'flex', gap: '8px' } },
      h('button', { class: 'btn', text: 'Close', onclick: closeModal }),
      h('button', { class: 'btn primary', text: 'Try again', onclick: () => { closeModal(); googleSync({ fromClick: true }); } }))
  });
}

function paintSyncBadge() {
  const b = $('#mb-sync'); if (!b) return;
  const on = DB.settings.googleOn;
  b.style.display = on ? 'flex' : 'none';
  if (!on) return;
  b.innerHTML = icon(gSyncing ? 'reset' : 'cloud', 15) + (gSyncing && gProgress ? `<span class="tiny" style="margin-left:4px">${esc(gProgress)}</span>` : '');
  b.style.color = gSyncing ? 'var(--accent)' : (gNeedsSignin || G.lastError ? 'var(--warn)' : '');
  b.title = gSyncing ? 'Syncing… ' + gProgress
    : gNeedsSignin ? 'Signed out of Google — click to sign in again'
    : G.lastError ? 'Last sync failed — click for details'
    : (DB.settings.gLast ? 'Synced ' + new Date(DB.settings.gLast).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' — click to sync now' : 'Click to sync now');
}

async function googleConnect() {
  try {
    await G.auth();
    await G.whoami();
    DB.settings.googleOn = true;
    if (DB.settings.gCal === undefined) DB.settings.gCal = true;
    if (DB.settings.gDrive === undefined) DB.settings.gDrive = true;
    G.lastError = ''; gNeedsSignin = false;
    commit();
    toast('Connected as ' + (G.email || 'your Google account'), 'cloud');
    await googleSync({ fromClick: true });
  } catch (e) { showSyncError(e.message); }
}

function startGoogleLoop() {
  G.restore();
  if (!DB.settings.googleOn || !G.originOk || !G.clientId) { paintSyncBadge(); return; }
  if (G.connected) googleSync({ silent: true }); else gNeedsSignin = true;
  paintSyncBadge();
  setInterval(() => { if (!document.hidden && G.connected) googleSync({ silent: true }); }, 180000);
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.connected) googleSync({ silent: true }); });
}

const APPS = [AppHome, AppVision, AppCalendar, AppTasks, AppGoals, AppChallenges, AppBody, AppNotes, AppHabits, AppFocus,

/* ---------- spotlight ---------- */
let spotSel = 0, spotItems = [];
function openSpot() {
  $('#spot').classList.add('open');
  const i = $('#spot-input'); i.value = ''; i.focus();
  runSpot('');
}
function closeSpot() { $('#spot').classList.remove('open'); }
$('#spot').addEventListener('click', e => { if (e.target.dataset.close) closeSpot(); });

function spotText(v, depth=0) {
  if (v == null || depth > 5) return '';
  if (typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') return String(v);
  if (Array.isArray(v)) return v.map(x => spotText(x, depth + 1)).join(' ');
  if (typeof v === 'object') return Object.entries(v)
    .filter(([k]) => !['id','createdAt','updatedAt','token','accessToken','refreshToken','clientId'].includes(k))
    .map(([k,val]) => spotText(val, depth + 1)).join(' ');
  return '';
}
function spotMatch(v, q) {
  return spotText(v).toLocaleLowerCase().includes(q);
}
function spotPreview(v, q, fallback='') {
  const all = spotText(v).replace(/\s+/g,' ').trim();
  if (!q || !all) return fallback || all.slice(0,70);
  const low = all.toLocaleLowerCase(), at = low.indexOf(q);
  if (at < 0) return all.slice(0,90);
  return (at > 34 ? '…' : '') + all.slice(Math.max(0,at-34), Math.min(all.length,at+90));
}
function spotAddRecord(res, item, q, cfg) {
  if (!item || !spotMatch(item, q)) return;
  const title = cfg.title(item);
  const sub = cfg.sub ? cfg.sub(item, q) : spotPreview(item, q, cfg.kind || '');
  res.push({ ic: cfg.ic, color: cfg.color, t: title, sub, act: cfg.act(item) });
}

document.addEventListener('keydown', e => {

    if (e.target?.isContentEditable || e.target?.closest?.('[contenteditable="true"]')) return;
    e.preventDefault(); $('#spot').classList.contains('open') ? closeSpot() : openSpot(); return;
  }
  if (e.key === 'Escape') {
    if ($('#spot').classList.contains('open')) return closeSpot();
    if ($('#modal-root').classList.contains('open')) return closeModal();
  }
  const activeEl=document.activeElement;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(activeEl?.tagName || '') ||
    !!activeEl?.isContentEditable ||
    !!activeEl?.closest?.('[contenteditable="true"]');
  if (mod && e.key.toLowerCase() === 'w') { const t = topWin(); if (t) { e.preventDefault(); closeApp(t); } return; }
  if (!typing && !mod && e.key >= '1' && e.key <= '9') { const a = APPS[+e.key - 1]; if (a) openApp(a.id); }
});

<script>
/* Item pinning + compact goal checklists */
(function(){
  const pin = (item, re) => {
    item.pinned = !item.pinned;
    commit();
    if (re) re();
  };
  window.toggleOrbitItemPin = pin;

  // Tasks: add a pin button to every task row without changing existing task logic.
  const baseTaskRow = taskRow;
  taskRow = function(t, re){
    const row = baseTaskRow(t, re);
    const actions = row.lastElementChild;
    if (actions && !actions.querySelector('.task-pin-btn')) {
      const b=document.createElement('button');
      b.className='item-pin-btn task-pin-btn'+(t.pinned?' on':'');
      b.type='button'; b.title=t.pinned?'Unpin task':'Pin task';
      b.textContent=t.pinned?'📌':'📍';
      b.onclick=(e)=>{e.stopPropagation();toggleOrbitItemPin(t,re);};
      actions.insertBefore(b, actions.firstChild);
    }
    return row;
  };

  // Courses: add a pin button to each course card.
  const baseCourseList = courseList;
  courseList = function(body,re,st){
    baseCourseList(body,re,st);
    const cards = body.querySelectorAll('.course-card');
    cards.forEach(card=>{
      if(card.querySelector('.course-pin-btn')) return;
      const titleEl=card.querySelector('.course-title');
      const name=titleEl ? titleEl.textContent.trim() : '';
      const c=(DB.courses||[]).find(x=>String(x.name||'').trim()===name);
      if(!c) return;
      card.style.position='relative';
      const b=document.createElement('button');
      b.className='item-pin-btn course-pin-btn'+(c.pinned?' on':'');
      b.type='button'; b.title=c.pinned?'Unpin course':'Pin course';
      b.textContent=c.pinned?'📌':'📍';
      b.style.position='absolute'; b.style.right='12px'; b.style.top='12px'; b.style.zIndex='8';
      b.onclick=(e)=>{e.stopPropagation();toggleOrbitItemPin(c,re);};
      card.appendChild(b);
    });
  };

  // Challenges: pin the current monthly challenge.
  const baseChallengesRender = AppChallenges.render;
  AppChallenges.render = function(root,re,st){
    baseChallengesRender.call(this,root,re,st);
    const key=gregorianMonthKey(), c=(DB.challenges||{})[key];
    const hero=root.querySelector('.challenge-hero');
    if(c && hero && !hero.querySelector('.challenge-pin-btn')){
      hero.style.position='relative';
      const b=h('button',{class:'item-pin-btn challenge-pin-btn '+(c.pinned?'on':''),title:c.pinned?'Unpin challenge':'Pin challenge',text:c.pinned?'📌':'📍',ariaLabel:c.pinned?'Unpin challenge':'Pin challenge',style:{position:'absolute',right:'14px',top:'14px',zIndex:5},onclick:e=>{e.stopPropagation();toggleOrbitItemPin(c,re);}});
      hero.append(b);
    }
  };

  // Pinned normalization for supported collections.
  DB.tasks=(DB.tasks||[]); DB.courses=(DB.courses||[]); DB.habits=(DB.habits||[]);
  DB.tasks.forEach(x=>x.pinned=!!x.pinned);
  DB.courses.forEach(x=>x.pinned=!!x.pinned);
  DB.courses.forEach(x=>x.sessions ||= []);
  DB.habits.forEach(x=>x.pinned=!!x.pinned);
  Object.values(DB.challenges||{}).forEach(x=>x.pinned=!!x.pinned);
})();
</script>

<script>
/* ============================================================
   FINAL TASK STATE CLEANUP
   - Not done never appears in open/Home lists.
   - Not done is displayed as an archive record, not a checkable task.
   - Home task cards stay compact instead of wrapping titles vertically.
   ============================================================ */
(function(){
  const baseTaskRowClean = taskRow;
  function notDoneArchiveRow(t,re){
    const p=projOf(t.projectId);
    const row=document.createElement('div'); row.className='task-archive-row';
    const mark=document.createElement('div'); mark.className='task-archive-mark'; mark.textContent='×';
    const mid=document.createElement('div'); mid.style.cssText='flex:1;min-width:0;cursor:pointer';
    const title=document.createElement('div'); title.className='task-archive-title'; title.textContent=t.title||'';
    const meta=document.createElement('div'); meta.className='meta'; meta.style.marginTop='4px';
    if(t.due) meta.append(Object.assign(document.createElement('span'),{className:'due '+dueClass(t),textContent:relDay(t.due)}));
    if(p){const chip=document.createElement('span');chip.className='chip';chip.innerHTML=`<i class="dot" style="background:${p.color}"></i>${esc(p.name)}`;meta.append(chip);}
    const badge=document.createElement('span'); badge.className='chip'; badge.style.color='var(--crit)'; badge.style.borderColor='color-mix(in srgb,var(--crit) 35%,var(--border))'; badge.textContent='Not done'; meta.append(badge);
    const reason=document.createElement('div'); reason.className='task-archive-reason'; reason.textContent=t.notDoneReason ? `Why: ${t.notDoneReason}` : 'No reason recorded';
    mid.append(title,meta,reason);
    mid.onclick=()=>editTask(t);
    const actions=document.createElement('div'); actions.style.cssText='display:flex;gap:6px;align-items:center;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end';
    const pin=document.createElement('button'); pin.className='item-pin-btn task-pin-btn'+(t.pinned?' on':''); pin.type='button'; pin.title=t.pinned?'Unpin task':'Pin task'; pin.textContent=t.pinned?'📌':'📍'; pin.onclick=e=>{e.stopPropagation();toggleOrbitItemPin(t,re);}; actions.append(pin);
    const reopen=document.createElement('button'); reopen.className='btn ghost sm'; reopen.textContent='Reopen'; reopen.onclick=e=>{e.stopPropagation();t.notDone=false;t.notDoneReason='';t.notDoneAt='';commit();};
    const done=document.createElement('button'); done.className='btn sm'; done.textContent='Done'; done.onclick=e=>{e.stopPropagation();t.done=true;t.notDone=false;t.notDoneReason='';t.notDoneAt='';t.completedAt=today();syncTaskEvent(t);commit();};
    const why=document.createElement('button'); why.className='btn ghost sm'; why.textContent='Why?'; why.title=t.notDoneReason||''; why.onclick=e=>{e.stopPropagation();toast(t.notDoneReason||'No reason recorded','info');};
    actions.append(reopen,done,why);
    row.append(mark,mid,actions); return row;
  }
  taskRow=function(t,re){
    if(window.__orbitHomeRendering && t && t.notDone) return document.createDocumentFragment();
    if(t && t.notDone) return notDoneArchiveRow(t,re);
    return baseTaskRowClean(t,re);
  };

  // Home: suppress not-done items from the open "On your plate" list and counts.
  const baseHomeRenderClean = AppHome.render;
  AppHome.render=function(root,re,st){
    window.__orbitHomeRendering=true;
    try { baseHomeRenderClean(root,re,st); }
    finally { window.__orbitHomeRendering=false; }
    // Correct the due-today stat so archived/not-done items don't count as open work.
    root.querySelectorAll('.home-stat').forEach(card=>{

    if(onPlate){ const area=onPlate.closest('.card'); if(area) area.classList.add('home-task-area'); }
  };

      if(/\\bNot done\\b/i.test(txt) || /\\bWhy\\?\\b/i.test(txt) && row.querySelector('.chip[style*="var(--crit)"]')){
        row.remove();
      }
    });
  };
})();
</script>

function orbitDirection(text){
  const v=String(text||'');
  return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(v)?'rtl':'ltr';
}
</script>

<script id="orbit-persian-direction">
(function(){
  function applyPersianDirection(el){
    if(!el) return;
    const value=String(el.value||el.textContent||'');
    const isFa=/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(value);
    el.dir=isFa?'rtl':'ltr';
    el.style.direction=isFa?'rtl':'ltr';
    el.style.textAlign=isFa?'right':'left';
    if(isFa) el.classList.add('persian-text'); else el.classList.remove('persian-text');
  }
  function scan(){
    document.querySelectorAll('textarea,input[type="text"],input:not([type]),.course-notes-body').forEach(el=>{
      if(!el.dataset.persianBound){
        el.dataset.persianBound='1';
        el.addEventListener('input',()=>applyPersianDirection(el));
        el.addEventListener('change',()=>applyPersianDirection(el));
      }
      applyPersianDirection(el);
    });
  }
  const mo=new MutationObserver(scan);
  mo.observe(document.body,{subtree:true,childList:true});
  setTimeout(scan,50);
})();
</script>
