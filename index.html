/* ---------- category manager ---------- */
function manageCats() {
  const body = h('div', {});
  const list = h('div', { style: { marginBottom: '14px' } });
  const draw = () => {
    list.innerHTML = '';
    expenseCats().forEach(c => {
      const inUse = DB.txns.some(t => !isIncome(t) && t.category === c);
      const row = h('div', { style: { display: 'flex', alignItems: 'center', gap: '9px', padding: '7px 0', borderBottom: '1px solid var(--border)' } });
      row.append(
        h('i', { style: { width: '10px', height: '10px', borderRadius: '3px', background: catColor(c), flex: '0 0 auto' } }),
        h('span', { text: c, style: { flex: '1', fontSize: '13px' } }),
        inUse ? h('span', { class: 'tiny', text: 'in use' }) : null,
        h('button', {
          class: 'btn ghost sm', html: icon('trash', 12), title: inUse ? 'Still used by some entries' : 'Remove',
          style: { opacity: inUse ? .35 : 1, pointerEvents: inUse ? 'none' : 'auto' },
          onclick: () => { DB.cats = expenseCats().filter(x => x !== c); save(); draw(); refresh(); }
        }));
      list.append(row);
    });
  };
  draw();
  const inp = h('input', { class: 'inp', placeholder: 'Add a category and press Enter' });
  inp.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const v = inp.value.trim(); if (!v) return;
    if (!DB.cats) DB.cats = EXPENSE_CATS.slice();
    if (!DB.cats.includes(v)) DB.cats.push(v);
    inp.value = ''; save(); draw(); refresh();
  };
  body.append(list, inp,
    h('div', { class: 'tiny', style: { marginTop: '8px' }, text: 'A category that still has entries cannot be removed — change those entries first.' }));
  modal({ title: 'Spending categories', bodyNode: body,
    footNode: h('button', { class: 'btn primary', text: 'Done', onclick: closeModal }) });
}

/* kept so older callers (Spotlight) still work */
const editTxn = t => (t && isIncome(t)) ? editIncome(t) : editExpense(t);
</script>
<script>
/* ============================================================
   TRIPS
   ============================================================ */
const TRIP_COLORS = [1, 3, 7, 2, 5, 4].map(i => `var(--s${i})`);

async function editTrip(t) {
  const isNew = !t.id;
  const out = await formModal(isNew ? 'New trip' : 'Edit trip', [
    { k: 'name', label: 'Trip', required: true, placeholder: 'e.g. Lisbon' },
    { k: 'dest', label: 'Destination', placeholder: 'City, country' },
    { type: 'row', fields: [{ k: 'start', label: 'Leaves', type: 'date' }, { k: 'end', label: 'Returns', type: 'date' }] },
    { type: 'row', fields: [
      { k: 'budget', label: 'Budget', type: 'number', step: '1' },
      { k: 'color', label: 'Colour', type: 'select', options: TRIP_COLORS.map((c, i) => [c, `Colour ${i + 1}`]) }] },
    { k: 'notes', label: 'Notes', type: 'textarea', rows: 3 },
  ], { start: today(), end: addDays(today(), 5), color: TRIP_COLORS[0], ...t }, {
    onDelete: isNew ? null : async () => {
      if (await confirmModal('Delete trip?', `"${t.name}" and its checklist will be removed.`)) { DB.trips = DB.trips.filter(x => x.id !== t.id); commit(); }
    }
  });
  if (!out) return;
  out.budget = Number(out.budget) || 0;
  if (isNew) DB.trips.push({ id: uid(), checklist: [], bookings: [], ...out });
  else Object.assign(DB.trips.find(x => x.id === t.id), out);
  commit();
}

const AppTrips = {
  id: 'trips', name: 'Trips', icon: 'plane', color: '#4a6fa5', w: 900, h: 640,
  onArg(arg, re) { if (arg && arg.id) this._sel = arg.id; re && re(); },
  render(root, re, st) {
    if (this._sel) { st.sel = this._sel; this._sel = null; }
    const app = h('div', { class: 'app' });
    const trip = DB.trips.find(t => t.id === st.sel);

    const head = h('div', { class: 'app-head' });
    if (trip) head.append(h('button', { class: 'btn ghost sm', html: icon('left', 15), onclick: () => { st.sel = null; re(); }, title: 'All trips' }));
    head.append(h('h2', { text: trip ? trip.name : 'Trips' }), h('div', { class: 'spacer' }));
    if (trip) head.append(h('button', { class: 'btn sm', html: `${icon('edit', 14)} Edit`, onclick: () => editTrip(trip) }));
    head.append(h('button', { class: 'btn primary sm', html: `${icon('plus', 14)} Trip`, onclick: () => editTrip({}) }));
    app.append(head);

    const body = h('div', { class: 'app-body' });

    if (!trip) {
      if (!DB.trips.length) body.append(h('div', { class: 'empty', html: `<div class="big">${icon('plane', 34)}</div><div>No trips planned yet.<br>Add one and the countdown starts.</div>` }));
      const grid = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fill,minmax(258px,1fr))' } });
      DB.trips.slice().sort((a, b) => String(a.start).localeCompare(String(b.start))).forEach(t => {
        const days = daysBetween(today(), t.start);
        const done = (t.checklist || []).filter(c => c.done).length, all = (t.checklist || []).length;
        const spent = (t.bookings || []).reduce((a, b) => a + (Number(b.cost) || 0), 0);
        const card = h('div', { class: 'trip-card', onclick: () => { st.sel = t.id; re(); } });
        card.innerHTML = `
          <div class="trip-hero" style="background:linear-gradient(135deg,${t.color},color-mix(in srgb, ${t.color} 55%, #000))">
            <span class="cd">${days > 0 ? `in ${days} day${days === 1 ? '' : 's'}` : days === 0 ? 'today' : (daysBetween(today(), t.end) >= 0 ? 'happening now' : 'past')}</span>
            <h4>${esc(t.name)}</h4></div>
          <div style="padding:12px 14px">
            <div class="tiny">${esc(t.dest || '')}</div>
            <div style="font-size:12.5px;margin:6px 0">${esc(fmtDate(t.start))} → ${esc(fmtDate(t.end))} · ${Math.max(1, daysBetween(t.start, t.end))} nights</div>
            <div class="prog"><i style="width:${all ? done / all * 100 : 0}%;background:${t.color}"></i></div>
            <div style="display:flex;margin-top:6px"><span class="tiny">${done}/${all} packed & booked</span><span style="flex:1"></span><span class="tiny mono">${esc(money(spent))}${t.budget ? ' / ' + esc(money(t.budget)) : ''}</span></div>
          </div>`;
        grid.append(card);
      });
      body.append(grid);
      app.append(body); root.append(app); return;
    }

    /* --- trip detail --- */
    const days = daysBetween(today(), trip.start);
    const nights = Math.max(1, daysBetween(trip.start, trip.end));
    const spent = (trip.bookings || []).reduce((a, b) => a + (Number(b.cost) || 0), 0);
    const tiles = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' } });
    [['Countdown', days > 0 ? `${days}d` : (daysBetween(today(), trip.end) >= 0 ? 'Now' : 'Done'), days > 0 ? `leaves ${fmtDate(trip.start)}` : `${fmtDate(trip.start)} → ${fmtDate(trip.end)}`],
     ['Length', `${nights}`, nights === 1 ? 'night' : 'nights'],
     ['Booked', money(spent), trip.budget ? `of ${money(trip.budget)} budget` : 'no budget set'],
     ['Left to plan', `${(trip.checklist || []).filter(c => !c.done).length}`, 'open items']
    ].forEach(([k, v, d]) => tiles.append(h('div', { class: 'stat', html: `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div>` })));
    body.append(tiles);

    if (trip.budget) {
      const pct = Math.min(100, spent / trip.budget * 100);
      const over = spent > trip.budget;
      const bcard = h('div', { class: 'card', style: { marginTop: '14px' } });
      bcard.innerHTML = `<h3>Budget</h3>
        <div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:20px;font-weight:600" class="mono">${esc(money(spent))}</span>
        <span class="tiny">committed of ${esc(money(trip.budget))}</span><span style="flex:1"></span>
        <span class="chip" style="color:${over ? 'var(--crit)' : 'var(--good)'};background:transparent;border-color:transparent">
          ${icon(over ? 'bolt' : 'check', 12, 2.4)}${over ? 'Over budget' : money(trip.budget - spent) + ' left'}</span></div>
        <div class="budget-bar" style="height:10px"><i style="width:${pct}%;background:${over ? 'var(--crit)' : trip.color}"></i></div>`;
      body.append(bcard);
    }

    const cols = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(290px,1fr))', marginTop: '14px' } });

    /* checklist */
    const ck = h('div', { class: 'card' });
    ck.append(h('h3', { text: 'Checklist' }));
    (trip.checklist || []).forEach(c => {
      const row = h('div', { class: 'ck' + (c.done ? ' on' : '') });
      const cb = h('button', { class: 'cbox' + (c.done ? ' on' : ''), html: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg>`, onclick: () => { c.done = !c.done; commit(); } });
      row.append(cb, h('span', { class: 'cktext', text: c.text, style: { flex: '1', fontSize: '13px' } }),
        h('button', { class: 'btn ghost sm', html: icon('x', 12), onclick: () => { trip.checklist = trip.checklist.filter(x => x.id !== c.id); commit(); } }));
      ck.append(row);
    });
    const ci = h('input', { class: 'inp', placeholder: 'Add an item…', style: { marginTop: '8px' } });
    ci.onkeydown = e => { if (e.key === 'Enter' && ci.value.trim()) { (trip.checklist ||= []).push({ id: uid(), text: ci.value.trim(), done: false }); ci.value = ''; commit(); } };
    ck.append(ci);
    cols.append(ck);

    /* bookings */
    const bk = h('div', { class: 'card' });
    const bh = h('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '10px' } },
      h('h3', { text: 'Bookings', style: { margin: 0 } }), h('div', { class: 'spacer' }),
      h('button', { class: 'btn sm', html: icon('plus', 13), onclick: async () => {
        const o = await formModal('Add booking', [
          { k: 'type', label: 'Type', type: 'select', options: ['Flight', 'Train', 'Stay', 'Car', 'Tour', 'Other'].map(x => [x, x]) },
          { k: 'title', label: 'Detail', required: true, placeholder: 'e.g. Outbound 06:40' },
          { type: 'row', fields: [{ k: 'date', label: 'Date', type: 'date' }, { k: 'cost', label: 'Cost', type: 'number', step: '1' }] },
          { k: 'ref', label: 'Reference', placeholder: 'Booking code' }], { date: trip.start });
        if (o) { (trip.bookings ||= []).push({ id: uid(), ...o, cost: Number(o.cost) || 0 }); commit(); }
      } }));
    bk.append(bh);
    if (!(trip.bookings || []).length) bk.append(h('div', { class: 'tiny', text: 'Nothing booked yet.' }));
    (trip.bookings || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).forEach(b => {
      const row = h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', padding: '7px 0', borderBottom: '1px solid var(--border)' } });
      row.innerHTML = `<span class="chip">${esc(b.type)}</span>
        <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.title)}</div>
        <div class="tiny">${esc(fmtDate(b.date))}${b.ref ? ' · ' + esc(b.ref) : ''}</div></div>
        <span class="mono" style="font-size:13px;font-weight:600">${esc(money(b.cost || 0))}</span>`;
      row.append(h('button', { class: 'btn ghost sm', html: icon('trash', 12), onclick: () => { trip.bookings = trip.bookings.filter(x => x.id !== b.id); commit(); } }));
      bk.append(row);
    });
    cols.append(bk);
    body.append(cols);

    /* notes */
    const nc = h('div', { class: 'card', style: { marginTop: '14px' } });
    nc.append(h('h3', { text: 'Notes' }));
    const ta = h('textarea', { class: 'inp', rows: 4, placeholder: 'Ideas, addresses, things not to forget…' });
    ta.value = trip.notes || '';
    ta.oninput = () => { trip.notes = ta.value; save(); };
    nc.append(ta);
    body.append(nc);

    app.append(body); root.append(app);
  }
};
</script>
<script>
/* ============================================================
   AKEDIA AT 25 — the long view

   A motto, the person you are becoming written down, the traits you
   want to be known for, and the pillars you are actually putting hours
   into. Progress is logged by hand, on purpose: the point is to notice
   you did the work, not to have a timer notice for you.
   ============================================================ */

const PILLAR_COLORS = [1, 3, 7, 2, 5, 4, 6, 8].map(i => `var(--s${i})`);

function vision() {
  if (!DB.vision) DB.vision = { motto: '', statement: '', birthday: '', traits: [], pillars: [] };
  const v = DB.vision;
  v.traits ||= []; v.pillars ||= [];
  return v;
}

/* days until the 25th birthday, if a birthday is set */
function turns25() {
  const v = vision();
  if (!v.birthday) return null;
  const b = fromYmd(v.birthday);
  const target = new Date(b.getFullYear() + 25, b.getMonth(), b.getDate());
  const days = daysBetween(today(), ymd(target));
  const age = (new Date() - b) / (365.2425 * DAY);
  return { date: ymd(target), days, age };
}

const pillarLogged = p => (p.log || []).reduce((a, x) => a + (Number(x.amount) || 0), 0);
const pillarUnit = p => p.goalType === 'hours' ? 'h' : (p.unit || '');

/* how fast you are actually moving, from the last 60 days of entries */
function pillarPace(p) {
  const since = addDays(today(), -60);
  const recent = (p.log || []).filter(x => x.date >= since);
  if (recent.length < 2 || !p.target) return null;
  const total = recent.reduce((a, x) => a + (Number(x.amount) || 0), 0);
  const perWeek = total / (60 / 7);
  if (perWeek <= 0) return null;
  const left = Math.max(0, p.target - pillarLogged(p));
  const weeks = left / perWeek;
  const eta = addDays(today(), Math.round(weeks * 7));
  return { perWeek, weeks, eta };
}

async function editVisionMeta() {
  const v = vision();
  const out = await formModal('The long view', [
    { k: 'motto', label: 'Your motto', placeholder: 'The line you want to live by' },
    { k: 'birthday', label: 'Your date of birth', type: 'date', hint: 'Used only for the countdown to 25.' },
    { k: 'statement', label: 'Who is Akedia at 25?', type: 'textarea', rows: 6,
      placeholder: 'Write it in the present tense, as if you already are that person.' },
  ], { motto: v.motto, birthday: v.birthday, statement: v.statement });
  if (!out) return;
  Object.assign(v, out); commit();
}

async function editPillar(p) {
  const v = vision();
  const isNew = !p.id;
  const out = await formModal(isNew ? 'New pillar' : 'Edit pillar', [
    { k: 'name', label: 'Pillar', required: true, placeholder: 'e.g. Personal brand, English, Strength' },
    { k: 'why', label: 'Why this matters', type: 'textarea', rows: 3, placeholder: 'What does the 25-year-old you have because of this?' },
    { k: 'goalType', label: 'Kind of goal', type: 'select', options: [
      ['hours', 'Hours of practice — the 10,000-hour kind'],
      ['number', 'A number to reach — weight, savings, followers…'],
      ['none', 'No number, just milestones']] },
    { type: 'row', fields: [
      { k: 'target', label: 'Target', type: 'number', step: 'any', placeholder: '10000' },
      { k: 'unit', label: 'Unit', placeholder: 'kg, €, books…', hint: 'Ignored for hour goals.' }] },
    { k: 'color', label: 'Colour', type: 'select', options: PILLAR_COLORS.map((c, i) => [c, `Colour ${i + 1}`]) },
  ], { goalType: 'hours', target: 10000, color: PILLAR_COLORS[v.pillars.length % PILLAR_COLORS.length], ...p }, {
    onDelete: isNew ? null : async () => {
      if (await confirmModal('Delete pillar?', `"${p.name}", its milestones and every hour you logged against it will be removed.`)) {
        v.pillars = v.pillars.filter(x => x.id !== p.id); commit();
      }
    }
  });
  if (!out) return;
  out.target = out.goalType === 'none' ? 0 : (Number(out.target) || 0);
  if (isNew) v.pillars.push({ id: uid(), log: [], milestones: [], notes: '', ...out });
  else Object.assign(v.pillars.find(x => x.id === p.id), out);
  commit();
}

async function logPillar(p) {
  const isHours = p.goalType === 'hours';
  const out = await formModal(`Log progress · ${p.name}`, [
    { type: 'row', fields: [
      { k: 'date', label: 'Date', type: 'date' },
      { k: 'amount', label: isHours ? 'Hours' : `Amount${p.unit ? ' (' + p.unit + ')' : ''}`, type: 'number', step: 'any', required: true }] },
    { k: 'note', label: 'What did you actually do?', placeholder: 'Optional, but it is the part you reread later' },
  ], { date: today() }, { ok: 'Log it' });
  if (!out) return;
  (p.log ||= []).push({ id: uid(), date: out.date, amount: Number(out.amount) || 0, note: out.note || '' });
  commit();
  toast(`+${out.amount}${isHours ? 'h' : ''} · ${p.name}`, 'check');
}

const AppVision = {
  id: 'vision', name: 'Akedia 25', icon: 'compass', color: '#8b5fbf', w: 1000, h: 700,
  onArg(arg, re) { if (arg && arg.id) this._sel = arg.id; re && re(); },
  render(root, re, st) {
    if (this._sel) { st.sel = this._sel; this._sel = null; }
    const v = vision();
    const p = v.pillars.find(x => x.id === st.sel);
    const app = h('div', { class: 'app' });

    const head = h('div', { class: 'app-head' });
    if (p) head.append(h('button', { class: 'btn ghost sm', html: icon('left', 15), onclick: () => { st.sel = null; re(); }, title: 'Back' }));
    head.append(h('h2', { text: p ? p.name : (DB.settings.osName === 'Orbit' ? 'Akedia at 25' : 'The long view') }), h('div', { class: 'spacer' }));
    if (p) head.append(h('button', { class: 'btn sm', html: `${icon('edit', 14)} Edit`, onclick: () => editPillar(p) }),
      h('button', { class: 'btn primary sm', html: `${icon('plus', 14)} Log progress`, onclick: () => logPillar(p) }));
    else head.append(h('button', { class: 'btn sm', html: `${icon('edit', 14)} Motto & vision`, onclick: editVisionMeta }),
      h('button', { class: 'btn primary sm', html: `${icon('plus', 14)} Pillar`, onclick: () => editPillar({}) }));
    app.append(head);

    const body = h('div', { class: 'app-body' });
    p ? pillarDetail(body, p, re, st) : visionOverview(body, v, re, st);
    app.append(body); root.append(app);
  }
};

function visionOverview(body, v, re, st) {
  const t25 = turns25();

  /* the hero — motto, countdown, who you are becoming */
  const hero = h('div', { class: 'card', style: {
    background: 'linear-gradient(135deg, color-mix(in srgb, var(--plum) 26%, transparent), transparent 70%)',
    borderColor: 'var(--plum)', padding: '20px 22px' } });
  if (v.motto) hero.append(h('div', { style: { fontSize: '22px', fontWeight: 700, letterSpacing: '-.01em', lineHeight: '1.35' }, text: '“' + v.motto + '”' }));
  else hero.append(h('div', { style: { fontSize: '18px', color: 'var(--muted)' }, text: 'No motto yet — the line you want to live by goes here.' }));

  if (t25) {
    const row = h('div', { style: { display: 'flex', gap: '26px', marginTop: '16px', flexWrap: 'wrap', alignItems: 'baseline' } });
    row.append(
      h('div', {}, h('div', { class: 'mono', style: { fontSize: '30px', fontWeight: 600 }, text: t25.days > 0 ? t25.days.toLocaleString('en-US') : '0' }),
        h('div', { class: 'tiny', text: t25.days > 0 ? `days until you turn 25 · ${fmtDate(t25.date, { month: 'long', day: 'numeric', year: 'numeric' })}` : 'you are 25' })),
      h('div', {}, h('div', { class: 'mono', style: { fontSize: '30px', fontWeight: 600 }, text: t25.age.toFixed(1) }),
        h('div', { class: 'tiny', text: 'years old today' })),
      h('div', {}, h('div', { class: 'mono', style: { fontSize: '30px', fontWeight: 600 }, text: Math.max(0, Math.round(t25.days / 7)).toLocaleString('en-US') }),
        h('div', { class: 'tiny', text: 'weeks left to become him' })));
    hero.append(row);
  } else {
    hero.append(h('button', { class: 'btn sm', style: { marginTop: '14px' }, html: `${icon('calendar', 13)} Add your birthday for the countdown`, onclick: editVisionMeta }));
  }
  if (v.statement) hero.append(h('hr', { class: 'hr' }), h('div', { style: { whiteSpace: 'pre-wrap', lineHeight: '1.75', color: 'var(--text-2)' }, text: v.statement }));
  body.append(hero);

  /* traits — who he is, not what he does */
  const tc = h('div', { class: 'card', style: { marginTop: '14px' } });
  tc.append(h('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '10px' } },
    h('h3', { text: 'The traits he is known for', style: { margin: 0 } }), h('div', { class: 'spacer' })));
  const chips = h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } });
  if (!v.traits.length) chips.append(h('div', { class: 'tiny', text: 'Nothing yet. Add the handful of words you want people to use about you.' }));
  v.traits.forEach(tr => {
    const c = h('button', { class: 'chip', style: { padding: '6px 12px', fontSize: '13px' }, title: tr.note || 'Click to remove' });
    c.innerHTML = `<i class="dot" style="background:var(--plum)"></i>${esc(tr.text)}`;
    c.onclick = async () => {
      if (await confirmModal('Remove trait?', `"${tr.text}" will be removed.`, 'Remove')) {
        v.traits = v.traits.filter(x => x.id !== tr.id); commit();
      }
    };
    chips.append(c);
  });
  const ti = h('input', { class: 'inp', placeholder: 'Add a trait and press Enter — patient, relentless, calm under pressure…', style: { marginTop: '12px' } });
  ti.onkeydown = e => {
    if (e.key === 'Enter' && ti.value.trim()) { v.traits.push({ id: uid(), text: ti.value.trim() }); ti.value = ''; commit(); }
  };
  tc.append(chips, ti);
  body.append(tc);

  /* the pillars */
  const hd = h('div', { style: { display: 'flex', alignItems: 'center', margin: '20px 0 10px' } },
    h('h3', { text: `Pillars${v.pillars.length ? ' · ' + v.pillars.length : ''}`, style: { margin: 0, fontSize: '13px' } }), h('div', { class: 'spacer' }));
  body.append(hd);

  if (!v.pillars.length) {
    body.append(h('div', { class: 'empty', style: { minHeight: '180px' }, html:
      `<div class="big">${icon('compass', 32)}</div><div>No pillars yet.<br>A pillar is one thing you are willing to put a decade into.</div>` }));
    return;
  }

  const grid = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fill,minmax(280px,1fr))' } });
  v.pillars.forEach(p => {
    const done = pillarLogged(p);
    const pct = p.target ? Math.min(100, done / p.target * 100) : 0;
    const ms = p.milestones || [];
    const nextMs = ms.filter(m => !m.done).sort((a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999')))[0];
    const card = h('div', { class: 'trip-card', onclick: () => { st.sel = p.id; re(); } });
    card.innerHTML = `
      <div class="trip-hero" style="height:66px;background:linear-gradient(135deg,${p.color},color-mix(in srgb, ${p.color} 50%, #000))">
        ${p.goalType !== 'none' && p.target ? `<span class="cd">${pct > 0 && pct < 1 ? pct.toFixed(1) : Math.round(pct)}%</span>` : ''}
        <h4>${esc(p.name)}</h4></div>
      <div style="padding:12px 14px">
        ${p.goalType === 'none'
          ? `<div class="tiny">${ms.filter(m => m.done).length}/${ms.length} milestones reached</div>`
          : `<div class="mono" style="font-size:15px;font-weight:600">${done.toLocaleString('en-US', { maximumFractionDigits: 1 })}<span class="tiny" style="font-weight:400"> of ${(p.target || 0).toLocaleString('en-US')} ${esc(pillarUnit(p))}</span></div>`}
        <div class="prog" style="margin-top:8px"><i style="width:${pct}%;background:${p.color}"></i></div>
        <div class="tiny" style="margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${nextMs ? 'Next: ' + esc(nextMs.text) : (p.why ? esc(p.why.split('\\n')[0]) : '&nbsp;')}</div>
      </div>`;
    grid.append(card);
  });
  body.append(grid);
}

function pillarDetail(body, p, re, st) {
  const done = pillarLogged(p);
  const pct = p.target ? Math.min(100, done / p.target * 100) : 0;
  const pace = pillarPace(p);
  const unit = pillarUnit(p);

  const tiles = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' } });
  const stats = [];
  if (p.goalType !== 'none') {
    stats.push(['Logged', done.toLocaleString('en-US', { maximumFractionDigits: 1 }) + (unit ? ' ' + unit : ''), `of ${(p.target || 0).toLocaleString('en-US')}`]);
    stats.push(['Left', Math.max(0, (p.target || 0) - done).toLocaleString('en-US', { maximumFractionDigits: 1 }) + (unit ? ' ' + unit : ''), `${pct > 0 && pct < 1 ? pct.toFixed(1) : Math.round(pct)}% done`]);
  }
  stats.push(['Milestones', `${(p.milestones || []).filter(m => m.done).length}/${(p.milestones || []).length}`, 'reached']);
  stats.push(['Pace', pace ? pace.perWeek.toFixed(1) + (unit ? ' ' + unit : '') : '—', pace ? 'per week, last 60 days' : 'log a few entries first']);
  stats.forEach(([k, v2, d]) => tiles.append(h('div', { class: 'stat', html: `<div class="k">${esc(k)}</div><div class="v">${esc(v2)}</div><div class="d">${esc(d)}</div>` })));
  body.append(tiles);

  if (p.goalType !== 'none' && p.target) {
    const bar = h('div', { class: 'card', style: { marginTop: '14px' } });
    bar.innerHTML = `<div class="budget-bar" style="height:12px"><i style="width:${pct}%;background:${p.color}"></i></div>`;
    if (pace) bar.append(h('div', { class: 'tiny', style: { marginTop: '9px' },
      text: pace.weeks > 520
        ? `At this pace it is more than ten years away. Either the target is the wrong size, or the week is.`
        : `Keep this pace and you get there around ${fmtDate(pace.eta, { month: 'long', year: 'numeric' })} — about ${Math.round(pace.weeks)} weeks.` }));
    body.append(bar);
  }

  if (p.why) {
    const w = h('div', { class: 'card', style: { marginTop: '14px' } });
    w.append(h('h3', { text: 'Why this matters' }), h('div', { style: { whiteSpace: 'pre-wrap', lineHeight: '1.75', color: 'var(--text-2)' }, text: p.why }));
    body.append(w);
  }

  const cols = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(290px,1fr))', marginTop: '14px' } });

  /* milestones */
  const mc = h('div', { class: 'card' });
  mc.append(h('h3', { text: 'Milestones' }));
  (p.milestones || []).slice().sort((a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999'))).forEach(m => {
    const row = h('div', { class: 'ck' + (m.done ? ' on' : '') });
    const cb = h('button', { class: 'cbox' + (m.done ? ' on' : ''), style: m.done ? { background: p.color, borderColor: p.color } : {},
      html: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg>`,
      onclick: () => { m.done = !m.done; m.doneOn = m.done ? today() : null; commit(); } });
    row.append(cb, h('div', { style: { flex: '1', minWidth: 0 } },
      h('div', { class: 'cktext', text: m.text, style: { fontSize: '13px' } }),
      m.date ? h('div', { class: 'tiny', text: m.done ? `reached ${fmtDate(m.doneOn || m.date)}` : `by ${fmtDate(m.date)}` }) : null),
      h('button', { class: 'btn ghost sm', html: icon('x', 12), onclick: () => { p.milestones = p.milestones.filter(x => x.id !== m.id); commit(); } }));
    mc.append(row);
  });
  const mAdd = h('button', { class: 'btn sm', style: { marginTop: '10px' }, html: `${icon('plus', 13)} Milestone`, onclick: async () => {
    const o = await formModal('New milestone', [
      { k: 'text', label: 'What counts as reached?', required: true, placeholder: 'Something you could show someone' },
      { k: 'date', label: 'By when', type: 'date' }], {}, { ok: 'Add' });
    if (o) { (p.milestones ||= []).push({ id: uid(), text: o.text, date: o.date, done: false }); commit(); }
  } });
  mc.append(mAdd);
  cols.append(mc);

  /* the log */
  const lc = h('div', { class: 'card' });
  lc.append(h('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '10px' } },
    h('h3', { text: 'What you actually did', style: { margin: 0 } }), h('div', { class: 'spacer' }),
    h('button', { class: 'btn sm', html: icon('plus', 13), onclick: () => logPillar(p) })));
  const entries = (p.log || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  if (!entries.length) lc.append(h('div', { class: 'tiny', text: 'Nothing logged yet.' }));
  entries.slice(0, 40).forEach(x => {
    const row = h('div', { style: { display: 'flex', gap: '10px', alignItems: 'baseline', padding: '6px 0', borderBottom: '1px solid var(--border)' } });
    row.innerHTML = `<span class="tiny mono" style="flex:0 0 62px">${esc(fmtDate(x.date, { month: 'short', day: 'numeric' }))}</span>
      <span class="mono" style="font-weight:600;flex:0 0 auto">${esc(String(x.amount))}${esc(unit ? ' ' + unit : '')}</span>
      <span class="tiny" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.note || '')}</span>`;
    row.append(h('button', { class: 'btn ghost sm', html: icon('x', 11), onclick: () => { p.log = p.log.filter(y => y.id !== x.id); commit(); } }));
    lc.append(row);
  });
  if (entries.length > 40) lc.append(h('div', { class: 'tiny', style: { marginTop: '8px' }, text: `showing the last 40 of ${entries.length}` }));
  cols.append(lc);
  body.append(cols);

  /* twelve weeks of effort, so a gap is visible */
  if (entries.length) {
    const weeks = [];
    for (let i = 11; i >= 0; i--) {
      const end = addDays(today(), -i * 7), start = addDays(end, -6);
      weeks.push([start, end, (p.log || []).filter(x => x.date >= start && x.date <= end).reduce((a, x) => a + (Number(x.amount) || 0), 0)]);
    }
    const maxW = Math.max(1, ...weeks.map(w => w[2]));
    const c = h('div', { class: 'card', style: { marginTop: '14px' } });
    c.append(h('h3', { text: 'The last twelve weeks' }));
    const sp = h('div', { class: 'spark', style: { height: '78px' } });
    weeks.forEach(([s, e, val]) => {
      const bar = h('div', { class: 'sb', style: { height: Math.max(3, val / maxW * 70) + 'px', background: p.color, opacity: val ? 1 : .25 } });
      bindTip(bar, () => `<div class="tk">${fmtDate(s)} – ${fmtDate(e)}</div><div class="tv">${val.toLocaleString('en-US', { maximumFractionDigits: 1 })}${unit ? ' ' + unit : ''}</div>`);
      sp.append(bar);
    });
    c.append(sp);
    const empties = weeks.filter(w => !w[2]).length;
    c.append(h('div', { class: 'tiny', style: { marginTop: '8px' },
      text: empties ? `${empties} of the last 12 weeks had nothing logged.` : 'Twelve weeks without a gap.' }));
    body.append(c);
  }

  /* notes */
  const nc = h('div', { class: 'card', style: { marginTop: '14px' } });
  nc.append(h('h3', { text: 'Notes' }));
  const ta = h('textarea', { class: 'inp', rows: 4, placeholder: 'Anything you want to remember about this pillar.' });
  ta.value = p.notes || '';
  ta.oninput = () => { p.notes = ta.value; save(); };
  nc.append(ta);
  body.append(nc);
}
</script>
<script>
/* ============================================================
   COURSES — what you signed up for, why, and what it cost

   The "why" field is the point. Money spent on learning is easy to
   justify in the moment and hard to account for later; writing the
   reason down at signup is what makes the answer honest six months on.
   ============================================================ */

const COURSE_STATES = [
  { v: 'planned', label: 'Planned', c: 'var(--muted)', ic: 'clock' },
  { v: 'active', label: 'In progress', c: 'var(--warn)', ic: 'bolt' },
  { v: 'done', label: 'Finished', c: 'var(--good)', ic: 'check' },
  { v: 'dropped', label: 'Dropped', c: 'var(--crit)', ic: 'x' },
];
const stateOf = v => COURSE_STATES.find(s => s.v === v) || COURSE_STATES[0];

async function editCourse(c) {
  const isNew = !c.id;
  const out = await formModal(isNew ? 'New course' : 'Edit course', [
    { k: 'name', label: 'Course', required: true, placeholder: 'What is it called?' },
    { k: 'provider', label: 'Where / who from', placeholder: 'Platform, school, teacher' },
    { type: 'row', fields: [
      { k: 'start', label: 'Starts', type: 'date' },
      { k: 'end', label: 'Ends', type: 'date' }] },
    { k: 'reason', label: 'Why are you enrolling?', type: 'textarea', rows: 3, required: true,
      placeholder: 'What will you be able to do afterwards that you cannot do now?' },
    { type: 'row', fields: [
      { k: 'cost', label: 'Enrolment cost', type: 'number', step: '0.01' },
      { k: 'status', label: 'Status', type: 'select', options: COURSE_STATES.map(s => [s.v, s.label]) }] },
    { k: 'link', label: 'Link', placeholder: 'Optional' },
  ], { start: today(), status: 'planned', ...c }, {
    onDelete: isNew ? null : async () => {
      if (await confirmModal('Delete course?', `"${c.name}" will be removed. Any expense you already logged for it stays in Money.`)) {
        DB.courses = DB.courses.filter(x => x.id !== c.id); commit();
      }
    }
  });
  if (!out) return;
  out.cost = Number(out.cost) || 0;
  if (isNew) { DB.courses ||= []; DB.courses.push({ id: uid(), progress: 0, notes: '', ...out }); }
  else Object.assign(DB.courses.find(x => x.id === c.id), out);
  commit();
  toast(isNew ? 'Course added' : 'Course updated');
}

/* the fee is a real expense — offer to put it where it belongs */
async function billCourse(c) {
  const cats = expenseCats();
  const cat = cats.find(x => /knowledge/i.test(x)) || cats[0];
  const out = await formModal('Log the fee as an expense', [
    { type: 'row', fields: [
      { k: 'date', label: 'Date paid', type: 'date' },
      { k: 'amount', label: 'Amount', type: 'number', step: '0.01', required: true }] },
    { k: 'source', label: 'How did you pay for it?', type: 'select', options: PAY_SOURCES.map(p => [p.v, p.v]) },
    { k: 'category', label: 'Category', type: 'select', options: cats.map(x => [x, x]) },
    { k: 'essential', label: 'How essential was this?', type: 'select',
      options: [['', '— not rated —'], ...[1, 2, 3, 4, 5].map(n => [n, `${n} · ${ESSENTIAL[n]}`])] },
  ], { date: c.start || today(), amount: c.cost, source: PAY_SOURCES[0].v, category: cat, essential: '4' }, { ok: 'Log it' });
  if (!out) return;
  DB.txns.push({
    id: uid(), type: 'expense', date: out.date, amount: Math.abs(Number(out.amount) || 0),
    category: out.category, source: out.source,
    reason: `${c.name}${c.provider ? ' — ' + c.provider : ''}: ${c.reason || 'course fee'}`.slice(0, 400),
    essential: out.essential === '' ? null : Number(out.essential),
    courseId: c.id,
  });
  c.billed = true;
  Money.jumpTo = monthKey(out.date);
  commit();
  toast(`Logged ${money(out.amount)} to ${out.category}`, 'wallet');
}

const AppCourses = {
  id: 'courses', name: 'Courses', icon: 'cap', color: '#b5731c', w: 940, h: 680,
  onArg(arg, re) { if (arg && arg.id) this._sel = arg.id; re && re(); },
  render(root, re, st) {
    DB.courses ||= [];
    if (this._sel) { st.sel = this._sel; this._sel = null; }
    st.filter = st.filter || 'all';
    const c = DB.courses.find(x => x.id === st.sel);
    const app = h('div', { class: 'app' });

    const head = h('div', { class: 'app-head' });
    if (c) head.append(h('button', { class: 'btn ghost sm', html: icon('left', 15), onclick: () => { st.sel = null; re(); }, title: 'All courses' }));
    head.append(h('h2', { text: c ? c.name : 'Courses' }), h('div', { class: 'spacer' }));
    if (!c) {
      const seg = h('div', { class: 'seg' });
      [['all', 'All'], ['active', 'In progress'], ['planned', 'Planned'], ['done', 'Finished']].forEach(([k, l]) =>
        seg.append(h('button', { class: st.filter === k ? 'on' : '', text: l, onclick: () => { st.filter = k; re(); } })));
      head.append(seg);
    }
    if (c) head.append(h('button', { class: 'btn sm', html: `${icon('edit', 14)} Edit`, onclick: () => editCourse(c) }));
    head.append(h('button', { class: 'btn primary sm', html: `${icon('plus', 14)} Course`, onclick: () => editCourse({}) }));
    app.append(head);

    const body = h('div', { class: 'app-body' });
    c ? courseDetail(body, c, re, st) : courseList(body, re, st);
    app.append(body); root.append(app);
  }
};

function courseList(body, re, st) {
  const all = DB.courses;
  const spent = all.reduce((a, c) => a + (Number(c.cost) || 0), 0);
  const doneN = all.filter(c => c.status === 'done').length;
  const activeN = all.filter(c => c.status === 'active').length;
  const droppedSpend = all.filter(c => c.status === 'dropped').reduce((a, c) => a + (Number(c.cost) || 0), 0);

  if (all.length) {
    const tiles = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' } });
    [['Invested', money(spent), `across ${all.length} course${all.length === 1 ? '' : 's'}`, ''],
     ['In progress', String(activeN), 'right now', ''],
     ['Finished', `${doneN}/${all.length}`, all.length ? `${Math.round(doneN / all.length * 100)}% completion` : '', ''],
     ['Dropped', money(droppedSpend), droppedSpend ? 'paid for, not finished' : 'nothing wasted', droppedSpend ? 'var(--crit)' : 'var(--good)'],
    ].forEach(([k, v, d, c]) => tiles.append(h('div', { class: 'stat', html: `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d" style="${c ? `color:${c}` : ''}">${esc(d)}</div>` })));
    body.append(tiles);
  }

  const list = all.filter(c => st.filter === 'all' || c.status === st.filter)
    .sort((a, b) => String(b.start || '').localeCompare(String(a.start || '')));

  if (!list.length) {
    body.append(h('div', { class: 'empty', style: { minHeight: '200px' }, html:
      `<div class="big">${icon('cap', 32)}</div><div>${all.length ? 'Nothing in this list.' : 'No courses yet.<br>Add one when you sign up — while the reason is still fresh.'}</div>` }));
    return;
  }

  const grid = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fill,minmax(280px,1fr))', marginTop: '14px' } });
  list.forEach(c => {
    const s = stateOf(c.status);
    const card = h('div', { class: 'trip-card', onclick: () => { st.sel = c.id; re(); } });
    const days = c.start ? daysBetween(today(), c.start) : null;
    card.innerHTML = `
      <div class="trip-hero" style="height:64px;background:linear-gradient(135deg,var(--s4),color-mix(in srgb, var(--s4) 50%, #000))">
        ${c.cost ? `<span class="cd">${esc(money(c.cost))}</span>` : ''}
        <h4 style="font-size:15px">${esc(c.name)}</h4></div>
      <div style="padding:12px 14px">
        <div class="tiny">${esc(c.provider || '')}</div>
        <div style="display:flex;align-items:center;gap:7px;margin:7px 0">
          <span class="chip" style="color:${s.c};background:transparent;border-color:transparent;padding-left:0">${icon(s.ic, 12, 2.4)}${s.label}</span>
          <span style="flex:1"></span>
          <span class="tiny">${c.start ? (days > 0 ? `starts in ${days}d` : esc(fmtDate(c.start))) : ''}</span>
        </div>
        <div class="tiny" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(c.reason || '')}</div>
      </div>`;
    grid.append(card);
  });
  body.append(grid);
}

function courseDetail(body, c, re, st) {
  const s = stateOf(c.status);
  const nights = c.start && c.end ? daysBetween(c.start, c.end) : null;
  const paid = DB.txns.some(t => t.courseId === c.id);

  const tiles = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' } });
  [['Status', s.label, c.provider || '', s.c],
   ['Cost', c.cost ? money(c.cost) : '—', paid ? 'logged in Money' : (c.cost ? 'not logged yet' : 'free'), ''],
   ['Starts', c.start ? fmtDate(c.start) : '—', c.start && daysBetween(today(), c.start) > 0 ? `in ${daysBetween(today(), c.start)} days` : '', ''],
   ['Length', nights != null ? `${nights}d` : '—', c.end ? `ends ${fmtDate(c.end)}` : 'no end date', ''],
  ].forEach(([k, v, d, col]) => tiles.append(h('div', { class: 'stat', html: `<div class="k">${esc(k)}</div><div class="v" style="${col ? `color:${col}` : ''}">${esc(v)}</div><div class="d">${esc(d)}</div>` })));
  body.append(tiles);

  /* status switcher */
  const sw = h('div', { class: 'card', style: { marginTop: '14px', display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap' } });
  const seg = h('div', { class: 'seg' });
  COURSE_STATES.forEach(x => seg.append(h('button', { class: c.status === x.v ? 'on' : '', text: x.label, onclick: () => { c.status = x.v; commit(); } })));
  sw.append(seg, h('div', { class: 'spacer' }));
  if (c.cost && !paid) sw.append(h('button', { class: 'btn sm', html: `${icon('wallet', 13)} Log the ${money(c.cost)} fee`, onclick: () => billCourse(c) }));
  if (c.link) sw.append(h('a', { href: c.link, target: '_blank', rel: 'noopener', class: 'btn sm', html: `${icon('link', 13)} Open` }));
  body.append(sw);

  /* progress */
  const pc = h('div', { class: 'card', style: { marginTop: '14px' } });
  pc.append(h('div', { style: { display: 'flex', alignItems: 'baseline', gap: '8px' } },
    h('h3', { text: 'Progress', style: { margin: 0 } }), h('div', { class: 'spacer' }),
    h('span', { class: 'mono', style: { fontSize: '15px', fontWeight: 600 }, text: `${c.progress || 0}%` })));
  const range = h('input', { type: 'range', min: 0, max: 100, step: 5, style: { width: '100%', accentColor: 'var(--accent-fill)', marginTop: '10px' } });
  range.value = c.progress || 0;
  range.oninput = () => { c.progress = Number(range.value); save(); pc.querySelector('.mono').textContent = c.progress + '%'; pc.querySelector('.budget-bar i').style.width = c.progress + '%'; };
  range.onchange = () => { if (c.progress >= 100 && c.status !== 'done') { c.status = 'done'; toast('Marked as finished', 'check'); } commit(); };
  pc.append(h('div', { class: 'budget-bar', style: { height: '10px', marginTop: '10px' }, html: `<i style="width:${c.progress || 0}%;background:var(--s4)"></i>` }), range);
  body.append(pc);

  /* the reason — the whole point of this app */
  const rc = h('div', { class: 'card', style: { marginTop: '14px', borderColor: 'var(--border-strong)' } });
  rc.append(h('h3', { text: 'Why you enrolled' }));
  rc.append(h('div', { style: { whiteSpace: 'pre-wrap', lineHeight: '1.75', color: 'var(--text-2)' },
    text: c.reason || 'You did not write one down. Add it while you can still remember.' }));
  if (c.status === 'done') rc.append(h('div', { class: 'tiny', style: { marginTop: '12px' }, text: 'Finished — did it actually deliver that? Worth a line in Notes.' }));
  body.append(rc);

  const nc = h('div', { class: 'card', style: { marginTop: '14px' } });
  nc.append(h('h3', { text: 'Notes' }));
  const ta = h('textarea', { class: 'inp', rows: 5, placeholder: 'What you are learning, what you are stuck on, what you would tell someone considering it.' });
  ta.value = c.notes || '';
  ta.oninput = () => { c.notes = ta.value; save(); };
  nc.append(ta);
  body.append(nc);
}
</script>
<script>
/* ============================================================
   HOME — one screen that ties the others together
   ============================================================ */
function greeting() {
  const h24 = new Date().getHours();
  return h24 < 5 ? 'Still up' : h24 < 12 ? 'Good morning' : h24 < 18 ? 'Good afternoon' : 'Good evening';
}

const AppHome = {
  id: 'home', name: 'Home', icon: 'home', color: '#7b3f92', w: 980, h: 660,
  render(root, re, st) {
    const app = h('div', { class: 'app' });
    const T = today();
    const name = (DB.settings.user || '').trim();

    const head = h('div', { class: 'app-head' });
    head.append(h('div', {}, h('h2', { text: `${greeting()}${name ? ', ' + name : ''}` }),
      h('div', { class: 'sub', text: fmtDate(T, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) })),
      h('div', { class: 'spacer' }),
      h('button', { class: 'btn sm', html: `${icon('search', 14)} Search everything`, onclick: openSpot }));
    app.append(head);

    const body = h('div', { class: 'app-body' });

    const warn = sampleBanner();
    if (warn) body.append(warn);

    /* first run — empty on purpose */
    if (!DB.settings.welcomed && !warn) {
      const w = h('div', { class: 'card', style: { marginBottom: '14px', borderColor: 'var(--accent)', background: 'var(--accent-soft)' } });
      const row = h('div', { style: { display: 'flex', alignItems: 'flex-start', gap: '12px' } });
      row.innerHTML = `<span style="color:var(--accent);flex:0 0 auto;margin-top:2px">${icon('bolt', 20)}</span>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">This is yours, and it is empty</div>
          <div class="tiny" style="margin-top:3px">Nothing here is made up — start typing and it fills with your own life. Connect Google in <strong>Settings</strong> to pull your calendars in, or bring a spending sheet across as <strong>.csv</strong>.</div>
        </div>`;
      const acts = h('div', { style: { display: 'flex', gap: '8px', marginTop: '12px', flexWrap: 'wrap' } },
        h('button', { class: 'btn sm', html: `${icon('cloud', 13)} Connect Google`, onclick: () => openApp('settings') }),
        h('button', { class: 'btn sm', html: `${icon('calendar', 13)} Import .ics`, onclick: importICS }),
        h('button', { class: 'btn sm', html: `${icon('wallet', 13)} Import spending .csv`, onclick: importCSV }),
        h('div', { class: 'spacer' }),
        h('button', { class: 'btn ghost sm', text: 'Got it', onclick: () => { DB.settings.welcomed = true; commit(); } }));
      w.append(row, acts);
      body.append(w);
    }

    /* quick numbers */
    const openTasks = DB.tasks.filter(t => !t.done);
    const dueToday = openTasks.filter(t => t.due && t.due <= T);
    const evToday = eventsOn(T);
    const habitsDone = DB.habits.filter(hb => hb.log[T]).length;
    const mSpent = DB.txns.filter(t => monthKey(t.date) === monthKey(T) && t.type !== 'income').reduce((a, t) => a + t.amount, 0);
    const nextTrip = DB.trips.filter(t => daysBetween(T, t.end) >= 0).sort((a, b) => String(a.start).localeCompare(String(b.start)))[0];

    const tiles = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(160px,1fr))' } });
    const tile = (k, v, d, appId) => {
      const n = h('div', { class: 'stat', style: { cursor: 'pointer' }, html: `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div>` });
      n.onclick = () => openApp(appId);
      return n;
    };
    tiles.append(
      tile('Due today', String(dueToday.length), dueToday.length ? 'tasks waiting' : 'all clear', 'tasks'),
      tile('Events', String(evToday.length), evToday.length ? 'on the calendar' : 'nothing scheduled', 'calendar'),
      tile('Habits', `${habitsDone}/${DB.habits.length}`, 'done today', 'habits'),
      tile('Spent', money(mSpent), `in ${MON[new Date().getMonth()]}`, 'finance'));
    body.append(tiles);

    const cols = h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fit,minmax(300px,1fr))', marginTop: '14px' } });

    /* today's schedule */
    const sch = h('div', { class: 'card' });
    sch.append(h('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '10px' } },
      h('h3', { text: 'Today', style: { margin: 0 } }), h('div', { class: 'spacer' }),
      h('button', { class: 'btn ghost sm', text: 'Calendar →', onclick: () => openApp('calendar') })));
    if (!evToday.length) sch.append(h('div', { class: 'tiny', text: 'Nothing scheduled. A rare and beautiful thing.' }));
    evToday.forEach(e => {
      const row = h('div', { class: 'agenda-ev', style: { cursor: 'pointer', padding: '6px 0' }, onclick: () => editEvent(e) });
      row.innerHTML = `<i class="bar" style="background:${evColor(e)}"></i><div class="tm">${e.allDay || !e.start ? 'all day' : fmtTime(e.start)}</div>
        <div style="min-width:0"><div style="font-size:13px;font-weight:600">${esc(e.title)}</div><div class="tiny">${esc(evCalName(e))}</div></div>`;
      sch.append(row);
    });
    const up = DB.events.filter(e => e.date > T && !calHidden(e)).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
    if (up.length) {
      sch.append(h('hr', { class: 'hr' }), h('div', { class: 'tiny', style: { marginBottom: '6px', fontWeight: 700, letterSpacing: '.05em', textTransform: 'uppercase' }, text: 'Coming up' }));
      up.forEach(e => sch.append(h('div', { style: { display: 'flex', gap: '8px', fontSize: '12.5px', padding: '3px 0', cursor: 'pointer' }, onclick: () => editEvent(e) },
        h('span', { class: 'tiny', style: { flex: '0 0 84px' }, text: relDay(e.date) }), h('span', { text: e.title }))));
    }
    cols.append(sch);

    /* tasks */
    const tk = h('div', { class: 'card' });
    tk.append(h('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '10px' } },
      h('h3', { text: 'On your plate', style: { margin: 0 } }), h('div', { class: 'spacer' }),
      h('button', { class: 'btn ghost sm', text: 'Tasks →', onclick: () => openApp('tasks') })));
    const show = [...dueToday, ...openTasks.filter(t => !dueToday.includes(t))].sort(taskSort).slice(0, 6);
    if (!show.length) tk.append(h('div', { class: 'tiny', text: 'Nothing open. Go outside.' }));
    show.forEach(t => tk.append(taskRow(t, re)));
    cols.append(tk);

    /* habits today */
    const hbc = h('div', { class: 'card' });
    hbc.append(h('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '10px' } },
      h('h3', { text: 'Habits', style: { margin: 0 } }), h('div', { class: 'spacer' }),
      h('button', { class: 'btn ghost sm', text: 'Habits →', onclick: () => openApp('habits') })));
    if (!DB.habits.length) hbc.append(h('div', { class: 'tiny', text: 'No habits tracked yet.' }));
    DB.habits.forEach(hb => {
      const on = !!hb.log[T];
      const row = h('div', { style: { display: 'flex', alignItems: 'center', gap: '9px', padding: '5px 0' } });
      const cb = h('button', { class: 'cbox' + (on ? ' on' : ''), style: on ? { background: hb.color, borderColor: hb.color } : {}, html: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg>`, onclick: () => { if (on) delete hb.log[T]; else hb.log[T] = true; commit(); } });
      row.append(cb, h('span', { text: hb.name, style: { fontSize: '13px', flex: '1', opacity: on ? .55 : 1, textDecoration: on ? 'line-through' : '' } }),
        h('span', { class: 'tiny mono', text: `${streakOf(hb)}🔥` }));
      hbc.append(row);
    });
    cols.append(hbc);

    /* trip + journal prompt */
    const side = h('div', { class: 'card' });
    if (nextTrip) {
      const d = daysBetween(T, nextTrip.start);
      side.append(h('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '10px' } },
        h('h3', { text: 'Next trip', style: { margin: 0 } }), h('div', { class: 'spacer' }),
        h('button', { class: 'btn ghost sm', text: 'Trips →', onclick: () => openApp('trips', { id: nextTrip.id }) })));
      const done = (nextTrip.checklist || []).filter(c => c.done).length, all = (nextTrip.checklist || []).length;
      side.append(h('div', { style: { cursor: 'pointer' }, onclick: () => openApp('trips', { id: nextTrip.id }), html: `
        <div style="font-size:19px;font-weight:700">${esc(nextTrip.name)}</div>
        <div class="tiny">${esc(nextTrip.dest || '')}</div>
        <div style="font-size:26px;font-weight:400;margin:8px 0 2px" class="mono">${d > 0 ? d + ' days' : d === 0 ? 'today' : 'in progress'}</div>
        <div class="prog" style="margin-top:8px"><i style="width:${all ? done / all * 100 : 0}%;background:${nextTrip.color}"></i></div>
        <div class="tiny" style="margin-top:5px">${done}/${all} sorted</div>` }));
      side.append(h('hr', { class: 'hr' }));
    }
    const jToday = DB.journal.find(j => j.date === T);
    side.append(h('h3', { text: jToday ? "Today's journal" : 'Journal' }));
    side.append(h('div', { class: 'tiny', style: { marginBottom: '8px' }, text: jToday ? (jToday.body || '').slice(0, 120) || 'Started but empty.' : 'Nothing written today.' }));
    side.append(h('button', { class: 'btn sm', html: `${icon('edit', 13)} ${jToday ? 'Continue' : 'Write today'}`, onclick: () => openApp('notes') }));
    cols.append(side);

    body.append(cols);
    app.append(body); root.append(app);
  }
};

/* ============================================================
   SETTINGS
   ============================================================ */
const WALLS = [['aurora', 'Aurora'], ['mesh', 'Mesh'], ['plain', 'Plain']];
const ACCENTS = [
  ['#c9265a', 'Raspberry'], ['#7b3f92', 'Aubergine'], ['#8e2f4f', 'Wine'],
  ['#b5561c', 'Terracotta'], ['#2e7d63', 'Fern'], ['#4a5fa5', 'Indigo'],
];

function applySettings() {
  const s = DB.settings, r = document.documentElement;
  r.dataset.theme = s.theme;
  document.body.dataset.wall = s.wall;
  const fill = s.accent || '#c9265a';
  const ink = s.theme === 'dark' ? shade(fill, 22) : fill;
  r.style.setProperty('--accent-fill', fill);
  r.style.setProperty('--accent', ink);
  r.style.setProperty('--accent-soft', ink + (s.theme === 'dark' ? '2b' : '1c'));
  $('#mb-os').textContent = s.osName || 'Orbit';
  document.title = `${s.osName || 'Orbit'} — Personal OS`;
  $('#mb-theme').innerHTML = icon(s.theme === 'dark' ? 'sun' : 'moon', 15);
  if (typeof paintSyncBadge === 'function') paintSyncBadge();
}

const AppSettings = {
  id: 'settings', name: 'Settings', icon: 'settings', color: '#7a6472', w: 620, h: 620, noDesktop: true,
  render(root, re, st) {
    const s = DB.settings;
    const app = h('div', { class: 'app' });
    app.append(h('div', { class: 'app-head' }, h('h2', { text: 'Settings' })));
    const body = h('div', { class: 'app-body' });

    const sec = (title, ...kids) => { const c = h('div', { class: 'card', style: { marginBottom: '14px' } }); c.append(h('h3', { text: title }), ...kids); return c; };
    const setField = (label, node) => h('label', { class: 'fld' }, h('span', { class: 'lb', text: label }), node);

    const nameI = h('input', { class: 'inp', value: s.user, placeholder: 'Your name' });
    nameI.oninput = () => { s.user = nameI.value; save(); };
    const osI = h('input', { class: 'inp', value: s.osName, placeholder: 'Orbit' });
    osI.oninput = () => { s.osName = osI.value || 'Orbit'; save(); applySettings(); };
    body.append(sec('You', setField('Name — used in the greeting', nameI), setField('Name of this OS', osI)));

    const themeSeg = h('div', { class: 'seg' });
    [['dark', 'Dark'], ['light', 'Light']].forEach(([k, l]) => themeSeg.append(h('button', { class: s.theme === k ? 'on' : '', text: l, onclick: () => { s.theme = k; applySettings(); commit(); } })));
    const accRow = h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } });
    ACCENTS.forEach(([c, nm]) => accRow.append(h('button', {
      style: { width: '30px', height: '30px', borderRadius: '99px', background: c, border: s.accent === c ? '2.5px solid var(--text)' : '1px solid var(--border)' },
      title: nm, onclick: () => { s.accent = c; applySettings(); commit(); }
    })));
    const wallSeg = h('div', { class: 'seg' });
    WALLS.forEach(([k, l]) => wallSeg.append(h('button', { class: s.wall === k ? 'on' : '', text: l, onclick: () => { s.wall = k; applySettings(); commit(); } })));
    body.append(sec('Look', setField('Theme', themeSeg), setField('Accent', accRow), setField('Desktop', wallSeg)));

    const curI = h('input', { class: 'inp', value: s.currency, placeholder: '$', maxlength: 4 });
    curI.oninput = () => { s.currency = curI.value; save(); };
    const wsSel = h('select', { class: 'inp' });
    DOW.forEach((d, i) => wsSel.append(h('option', { value: i, text: d })));
    wsSel.value = s.weekStart;
    wsSel.onchange = () => { s.weekStart = +wsSel.value; commit(); };
    body.append(sec('Regional', setField('Currency symbol', curI), setField('Week starts on', wsSel)));


    /* ---------- Google ---------- */
    const gcard = h('div', { class: 'card', style: { marginBottom: '14px' } });
    gcard.append(h('h3', { html: `${icon('cloud', 14)} Google Calendar &amp; Drive` }));
    if (!G.originOk) {
      gcard.append(h('div', { class: 'tiny', style: { lineHeight: '1.65' }, html:
        `Google will only talk to a page served over <strong>https</strong>, and this file is open straight from your disk (<code>${esc(location.protocol)}</code>).
         That is Google's rule, not a limitation of Orbit.<br><br>
         <strong>To turn it on:</strong> put this one file on any free static host — GitHub Pages, Netlify Drop, Cloudflare Pages — then open it from that https link
         on your laptop <em>and</em> your phone. Come back to this panel there and the fields below will work.<br><br>
         Until then, everything still works offline, and <strong>Import .ics</strong> / <strong>Import CSV</strong> bring your Google data in by hand.` }));
    } else {
      const cid = h('input', { class: 'inp', value: s.googleClientId || '', placeholder: '1234567890-abcdef.apps.googleusercontent.com', spellcheck: 'false' });
      cid.oninput = () => { s.googleClientId = cid.value.trim(); save(); };
      gcard.append(h('label', { class: 'fld' }, h('span', { class: 'lb', text: 'OAuth Client ID' }), cid,
        h('div', { class: 'tiny', style: { marginTop: '4px' }, html: `Create one free at <strong>console.cloud.google.com</strong> → APIs &amp; Services → Credentials → OAuth client ID → Web application, and add <code>${esc(location.origin)}</code> as an authorised JavaScript origin.` })));

      const status = h('div', { class: 'tiny', style: { marginBottom: '10px' } });
      status.innerHTML = s.googleOn
        ? `<span style="color:${gNeedsSignin ? 'var(--warn)' : 'var(--good)'}">●</span> ${gNeedsSignin ? 'Signed out — click Sync now to sign in again' : 'Connected'}${G.email ? ' as ' + esc(G.email) : ''}${s.gLast ? ' · last synced ' + esc(new Date(s.gLast).toLocaleString()) : ''}`
        : 'Not connected.';
      gcard.append(status);

      const toggles = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px', marginBottom: '12px' } });
      [['gCal', 'Sync my Google Calendar (both ways)'], ['gDrive', 'Keep all Orbit data in sync via Google Drive']].forEach(([k, label]) => {
        const id = 'tg-' + k;
        const wrap = h('label', { style: { display: 'flex', alignItems: 'center', gap: '9px', fontSize: '13px', cursor: 'pointer' } });
        const cb = h('input', { type: 'checkbox', id });
        cb.checked = s[k] !== false;
        cb.onchange = () => { s[k] = cb.checked; commit(); };
        wrap.append(cb, h('span', { text: label }));
        toggles.append(wrap);
      });
      gcard.append(toggles);

      /* which of your Google calendars belong in Orbit */
      if (s.googleOn && (DB.gcals || []).length) {
        const cw = h('div', { style: { marginBottom: '12px', border: '1px solid var(--border)', borderRadius: 'var(--r-sm)', overflow: 'hidden' } });
        cw.append(h('div', { style: { padding: '8px 11px', background: 'var(--surface-3)', fontSize: '11.5px', fontWeight: 700, letterSpacing: '.04em', textTransform: 'uppercase', color: 'var(--muted)' },
          text: `Your Google calendars — ${DB.gcals.filter(c => c.sync !== false).length} of ${DB.gcals.length} syncing` }));
        const list = h('div', { style: { maxHeight: '210px', overflow: 'auto', padding: '5px' } });
        DB.gcals.forEach(c => {
          const row = h('label', { style: { display: 'flex', alignItems: 'center', gap: '9px', padding: '5px 7px', borderRadius: '6px', cursor: 'pointer', fontSize: '13px' } });
          const cb = h('input', { type: 'checkbox' });
          cb.checked = c.sync !== false;
          cb.onchange = () => { c.sync = cb.checked; commit(); };
          row.append(cb,
            h('i', { style: { width: '11px', height: '11px', borderRadius: '3px', background: c.color, flex: '0 0 auto' } }),
            h('span', { text: c.name, style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: '1' } }),
            c.readOnly ? h('span', { class: 'tiny', text: 'read-only' }) : null,
            c.primary ? h('span', { class: 'tiny', text: 'main' }) : null);
          list.append(row);
        });
        cw.append(list);
        gcard.append(cw);

        const writable = DB.gcals.filter(c => !c.readOnly);
        if (writable.length) {
          const sel = h('select', { class: 'inp' });
          writable.forEach(c => sel.append(h('option', { value: c.id, text: c.name })));
          sel.value = s.gWriteCal || writable[0].id;
          sel.onchange = () => { s.gWriteCal = sel.value; commit(); };
          gcard.append(h('label', { class: 'fld' }, h('span', { class: 'lb', text: 'New events go to' }), sel));
        }
      }

      const acts = h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } });
      if (!s.googleOn) acts.append(h('button', { class: 'btn primary', html: `${icon('link', 14)} Connect Google`, onclick: googleConnect }));
      else {
        acts.append(h('button', { class: 'btn primary', html: `${icon('reset', 14)} Sync now`, onclick: () => googleSync({ fromClick: true }) }));
        acts.append(h('button', { class: 'btn', html: `${icon('x', 14)} Disconnect`, onclick: () => { G.disconnect(); toast('Disconnected from Google', 'x'); } }));
      }
      gcard.append(acts);
      if (G.lastError) {
        const ex = gExplain(G.lastError);
        const box = h('div', { style: { marginTop: '10px', padding: '10px 12px', borderRadius: 'var(--r-sm)', background: 'var(--surface-3)', border: '1px solid var(--border)' } });
        box.append(h('div', { style: { fontSize: '12.5px', fontWeight: 600, color: 'var(--crit)' }, text: ex.short }));
        if (ex.fix) box.append(h('div', { class: 'tiny', style: { marginTop: '4px' }, text: ex.fix }));
        (ex.links || []).forEach(l => box.append(h('div', { style: { marginTop: '6px' } },
          h('a', { href: l, target: '_blank', rel: 'noopener', class: 'tiny', style: { color: 'var(--accent)', wordBreak: 'break-all' }, text: l }))));
        gcard.append(box);
      }
      gcard.append(h('div', { class: 'tiny', style: { marginTop: '10px' }, html:
        'Orbit reads <strong>every</strong> calendar you tick above, not just the main one, and keeps each event in its own colour. Drive sync uses the app-private folder, so Orbit can only ever see the one file it created — not the rest of your Drive. Whichever device saved most recently wins.' }));
    }
    body.append(gcard);

    const dataRow = h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } });
    dataRow.append(
      h('button', { class: 'btn', html: `${icon('upload', 14)} Export backup`, onclick: () => { downloadFile(`orbit-backup-${today()}.json`, JSON.stringify(DB, null, 2)); toast('Backup downloaded', 'upload'); } }),
      h('button', { class: 'btn', html: `${icon('download', 14)} Restore backup`, onclick: async () => {
        const f = await pickFile('.json,application/json'); if (!f) return;
        try {
          const p = JSON.parse(f.text);
          if (!p || typeof p !== 'object' || !('tasks' in p || 'events' in p)) throw 0;
          DB = Object.assign(DEFAULTS(), p);
          DB.settings = Object.assign(DEFAULTS().settings, p.settings || {});
          save(); applySettings(); refresh(); toast('Backup restored', 'download');
        } catch (e) { toast('That file is not an Orbit backup', 'x'); }
      } }),
      h('button', { class: 'btn danger', html: `${icon('trash', 14)} Remove sample data only`, title: 'Deletes the invented starter content and nothing else', onclick: async () => {
        const f = sampleFound();
        if (!f.total) return toast('No sample data found — you are clean', 'check');
        if (await confirmModal('Remove the sample data?', `${f.total} invented entries will go. Everything you wrote yourself, and everything synced from Google, stays.`, 'Remove it')) {
          removeSample(); toast(`Removed ${f.total} entries`, 'trash');
          if (DB.settings.googleOn) googleSync({ silent: true });
        }
      } }),
      h('button', { class: 'btn', html: `${icon('bolt', 14)} Load sample data`, title: 'Fills Orbit with example content so you can see how it works', onclick: async () => {
        if (await confirmModal('Load sample data?', 'This replaces everything currently in Orbit with example content. Your theme and Google connection stay as they are.', 'Load it')) {
          seed(); DB.settings.sampleDismissed = false; applySettings(); refresh(); toast('Sample data loaded', 'bolt');
        }
      } }),
      h('button', { class: 'btn danger', html: `${icon('trash', 14)} Clear all content`, onclick: async () => {
        if (await confirmModal('Clear everything you have written?',
          'Every event, task, note, habit, entry and trip goes. Your theme, currency and Google connection stay. Anything that lives in your Google Calendar will come back on the next sync.', 'Clear it')) {
          clearContent(); toast('Cleared. Blank slate.', 'reset');
        }
      } }),
      h('button', { class: 'btn danger', html: `${icon('x', 14)} Reset Orbit completely`, title: 'Also forgets your Google Client ID and disconnects', onclick: async () => {
        if (await confirmModal('Reset Orbit completely?', 'This also forgets your Google Client ID and disconnects your account. You would have to set that up again. Export a backup first if you are not sure.', 'Reset everything')) {
          Vault.wipe(); G.forget(); DB = DEFAULTS(); save(); applySettings(); refresh(); toast('Reset. Fresh start.', 'reset');
        }
      } }));
    const storeNote = h('div', { class: 'tiny', style: { marginTop: '10px' } , text: Vault.persistent
      ? 'Your data is stored in this browser only — nothing is sent anywhere. Keep the .html file and use the same browser, and it stays. Export a backup now and then.'
      : 'Heads up: this browser is blocking local storage, so data will only last until you close the tab. Download the file and open it directly, or export a backup before you leave.' });
    body.append(sec('Your data', dataRow, storeNote));

    const counts = h('div', { class: 'tiny', html:
      `${DB.events.length} events · ${DB.tasks.length} tasks · ${DB.notes.length} notes · ${DB.journal.length} journal entries · ${DB.habits.length} habits · ${DB.txns.length} transactions · ${DB.trips.length} trips · ${DB.sessions.length} focus sessions` });
    body.append(sec('In here right now', counts));

    body.append(h('div', { class: 'tiny', style: { textAlign: 'center', padding: '10px' }, html: 'Orbit · one HTML file · works offline · <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>K</kbd> to search' }));
    app.append(body); root.append(app);
  }
};
